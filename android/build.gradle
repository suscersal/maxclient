buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.5.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"
        classpath "com.chaquo.python:gradle:16.0.0"
        // Для push-уведомлений через Firebase Cloud Messaging. Нужен файл
        // google-services.json из консоли Firebase (его сюда не кладу,
        // ключи проекта не мои — нужно создать свой Firebase-проект, см.
        // комментарий в app/build.gradle).
        classpath "com.google.gms:google-services:4.4.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
