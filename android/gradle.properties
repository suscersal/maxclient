org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Ускорение сборки:
# - parallel: независимые задачи/модули выполняются одновременно
# - caching: переиспользуем результаты задач между сборками (build cache),
#   его хранилище (~/.gradle/caches) кэширует gradle/actions/setup-gradle в CI
# - configureondemand: конфигурируются только затронутые модули, а не все сразу
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true