plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.suscersal.maxclient'
    compileSdk 34

    defaultConfig {
        applicationId "com.suscersal.maxclient"
        minSdk 24
        targetSdk 34
        // Версия задаётся из CI (см. .github/workflows/build-and-relis.yml) —
        // versionName растёт на +0.1 (1.0 -> 1.1 -> 1.2...) с каждой сборкой,
        // по номеру запуска GitHub Actions. При локальной сборке (когда
        // переменных окружения нет) используются значения по умолчанию.
        // ВАЖНО: считаем значения в переменные ДО вызова versionCode/versionName —
        // versionCode(...) это сеттер и ничего не возвращает, поэтому
        // versionCode(...).toInteger() в одну строку падает с "Value is null".
        def verCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        def verName = System.getenv("ANDROID_VERSION_NAME") ?: "1.0"

        versionCode verCode
        versionName verName

        // Собираем только под arm64-v8a — на нём сейчас подавляющее
        // большинство Android-устройств (32-битные armeabi-v7a телефоны —
        // это в основном модели старше ~2017 года). Раньше Chaquopy ставил
        // Python-пакеты и паковал нативные библиотеки под ОБЕ архитектуры на
        // каждой сборке — это была основная причина долгой сборки в CI.
        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            // Python-версия внутри APK.
            version "3.11"
        }
    }

    // ВАЖНО: без этого блока CI (GitHub Actions) собирает debug-APK на
    // одноразовом раннере, где каждый раз генерируется НОВЫЙ случайный
    // debug.keystore — то есть каждая сборка подписана разным ключом.
    // Android при установке APK сверяет подпись с уже установленным
    // приложением и отказывает в обновлении "поверх", если подпись другая
    // (требуя сначала удалить старую версию) — это и есть причина проблемы
    // "нельзя обновиться без удаления". Раньше это было незаметно локально,
    // где debug.keystore один и тот же на диске разработчика.
    //
    // Решение — подписывать ВСЕ сборки (и debug, и release) одним и тем же
    // постоянным keystore. Он не хранится в репозитории (см. .gitignore) —
    // на CI его подкладывает шаг "Decode signing keystore" в workflow из
    // GitHub Secret (ANDROID_KEYSTORE_BASE64), передавая путь/пароли через
    // переменные окружения. Локально, если этих переменных нет, используется
    // обычная временная debug-подпись Android Studio/Gradle — сборка при
    // этом не ломается, просто такой APK нельзя будет обновить поверх
    // "официального" CI-билда без переустановки (это ожидаемо для локальной
    // разработки).
    def hasCustomSigning = System.getenv("ANDROID_KEYSTORE_PATH") != null

    if (hasCustomSigning) {
        signingConfigs {
            custom {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (hasCustomSigning) {
                signingConfig signingConfigs.custom
            }
        }
        release {
            minifyEnabled false
            if (hasCustomSigning) {
                signingConfig signingConfigs.custom
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Python-исходники и статика (index.html, avatars.json, manifest.json)
    // лежат в app/src/main/python — это дефолтный путь Chaquopy,
    // указываем явно для наглядности.
    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }
}

chaquopy {
    defaultConfig {
        pip {
            install "flask"
            install "flask-sock"
            install "lz4"
            // msgpack сознательно НЕ ставим через pip — см. README-ANDROID.md.
            // Используется чистый Python-модуль msgpack_lite.py.
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    // On-device ИИ для скам-проверки сообщений (bridge.py:get_on_device_llm,
    // вызывается напрямую из Python через Chaquopy Java-интероп). API
    // сейчас в режиме maintenance-only у Google (не deprecated, но новых
    // фич не будет) — при желании со временем можно мигрировать на
    // LiteRT-LM, сохранив тот же контракт bridge.py (generateResponse).
    implementation 'com.google.mediapipe:tasks-genai:0.10.27'
    implementation 'com.google.mediapipe:tasks-text'
}