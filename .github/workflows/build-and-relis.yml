name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Определяем, какие файлы поменялись в этом пуше: если это ТОЛЬКО
  # "горячие" файлы (чистый Python + статика фронтенда — не требуют
  # компиляции), то полную сборку APK/Linux/Windows не запускаем вообще,
  # а вместо неё публикуем лёгкое OTA-обновление (см. publish-hot-update).
  # Если поменялось что-то ещё (Kotlin, gradle, манифест, воркфлоу) —
  # собираем как обычно.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      hot_only: ${{ steps.filter.outputs.hot_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        run: |
          set -euo pipefail

          # Для ручного запуска или самого первого пуша сравнивать не с чем —
          # считаем это "не только горячими" файлами, т.е. собираем всё.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]] || \
             [[ -z "${{ github.event.before }}" ]]; then
            echo "hot_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"

          # "Горячие" пути — то, что попадает в scripts/sync-android-python.sh
          # и не требует пересборки нативного кода.
          HOT_REGEX='^(bridge\.py|static/.*|android/app/src/main/python/msgpack_lite\.py)$'

          NON_HOT=$(echo "$CHANGED" | grep -Ev "$HOT_REGEX" || true)

          if [[ -z "$NON_HOT" ]]; then
            echo "hot_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "hot_only=false" >> "$GITHUB_OUTPUT"
          fi

  # Единая точка, где вычисляется тег релиза и версия — чтобы во всех
  # job'ах (android/linux/windows/hot-update) они были одинаковыми.
  # versionName растёт на +0.1 с каждой сборкой (1.0 -> 1.1 -> 1.2...),
  # используя монотонно растущий номер запуска GitHub Actions —
  # никаких коммитов версии обратно в репозиторий не требуется.
  resolve-tag:
    needs: detect-changes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version_name: ${{ steps.tag.outputs.version_name }}
      version_code: ${{ steps.tag.outputs.version_code }}
    steps:
      - name: Resolve release tag and version
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          echo "version_name=1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  # ---------- Android (APK через Chaquopy) ----------
  build-android:
    needs: [detect-changes, resolve-tag]
    if: needs.detect-changes.outputs.hot_only != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_VERSION_NAME: ${{ needs.resolve-tag.outputs.version_name }}
      ANDROID_VERSION_CODE: ${{ needs.resolve-tag.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Refuse to build if session.json leaked into the repo
        working-directory: .
        run: |
          if find . -iname "session.json" | grep -q .; then
            echo "::error::Found session.json in the checkout — it must never be committed (contains a live auth token). Aborting build."
            exit 1
          fi

      - name: Sync bridge.py + static assets into Android Chaquopy folder
        working-directory: .
        run: bash scripts/sync-android-python.sh

      - name: Verify loading.gif landed in the native assets folder
        working-directory: .
        run: |
          ls -la android/app/src/main/assets/
          file android/app/src/main/assets/loading.gif
          echo "size: $(stat -c%s android/app/src/main/assets/loading.gif) bytes"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Verify loading.gif ended up inside the built APK
        working-directory: .
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -i "loading.gif" || \
            (echo "::error::loading.gif is NOT present inside the built APK's assets!" && exit 1)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-client-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ---------- Linux (единый бинарник через PyInstaller) ----------
  build-linux:
    needs: [detect-changes, resolve-tag]
    if: needs.detect-changes.outputs.hot_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (pywebview / GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            gir1.2-webkit2-4.1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-sock msgpack lz4 pyinstaller "pywebview[gtk]"

      - name: Refuse to build if session.json leaked into the repo
        run: |
          if find . -iname "session.json" | grep -q .; then
            echo "::error::Found session.json in the checkout — it must never be committed (contains a live auth token). Aborting build."
            exit 1
          fi

      - name: Build standalone desktop app
        run: |
          # desktop_launcher.py: Flask в фоне + окно с UI (как Android WebView).
          # Явно перечисляем только нужные фронтенду файлы (whitelist),
          # а не всю папку static/ целиком — чтобы туда случайно
          # не попал session.json с токеном, если кто-то положит его рядом.
          pyinstaller --onefile --windowed --name max-client-linux \
            --hidden-import=webview \
            --collect-all webview \
            --add-data "static/index.html:static" \
            --add-data "static/avatars.json:static" \
            --add-data "static/manifest.json:static" \
            desktop_launcher.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-client-linux
          path: dist/max-client-linux
          if-no-files-found: error

  # ---------- Windows (единый .exe через PyInstaller) ----------
  build-windows:
    needs: [detect-changes, resolve-tag]
    if: needs.detect-changes.outputs.hot_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-sock msgpack lz4 pyinstaller pywebview

      - name: Refuse to build if session.json leaked into the repo
        shell: bash
        run: |
          if find . -iname "session.json" | grep -q .; then
            echo "::error::Found session.json in the checkout — it must never be committed (contains a live auth token). Aborting build."
            exit 1
          fi

      - name: Build standalone desktop app
        run: |
          # desktop_launcher.py: Flask в фоне + окно с UI (как Android WebView).
          # Явно перечисляем только нужные фронтенду файлы (whitelist),
          # а не всю папку static/ целиком — чтобы туда случайно
          # не попал session.json с токеном, если кто-то положит его рядом.
          pyinstaller --onefile --windowed --name max-client-windows `
            --hidden-import=webview `
            --collect-all webview `
            --add-data "static/index.html;static" `
            --add-data "static/avatars.json;static" `
            --add-data "static/manifest.json;static" `
            --add-data "static/assets/favorite.png;static" `
            --add-data "static/loading.gif;static" `
            desktop_launcher.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-client-windows
          path: dist/max-client-windows.exe
          if-no-files-found: error

  # ---------- Единый релиз: только 3 исполняемых файла (APK/Linux/Windows) ----------
  # OTA-пакет (bridge.py, index.html и т.п.) сюда больше не прикладывается —
  # эти файлы и так запечены внутрь каждой из трёх сборок. Отдельно они
  # публикуются только в hot-update релизах (см. publish-hot-update ниже),
  # которые как раз существуют для обновления без пересборки.
  release:
    needs:
      [detect-changes, resolve-tag, build-android, build-linux, build-windows]
    if: needs.detect-changes.outputs.hot_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: MAX Client ${{ needs.resolve-tag.outputs.tag }} (v${{ needs.resolve-tag.outputs.version_name }})
          generate_release_notes: true
          # ВАЖНО: это должен быть единственный тип релиза, который НЕ помечен
          # prerelease. Так GitHub-эндпоинт "latest release"
          # (releases/latest, .../releases/latest/download/<file>, бейдж в
          # README) всегда указывает на релиз, где точно есть APK.
          # Hot-update релизы ниже (publish-hot-update) специально помечены
          # prerelease: true, чтобы не перехватывать этот статус "latest".
          prerelease: false
          files: |
            dist-artifacts/max-client-android/app-debug.apk
            dist-artifacts/max-client-linux/max-client-linux
            dist-artifacts/max-client-windows/max-client-windows.exe

  # ---------- Лёгкое OTA-обновление: только когда менялись "горячие" файлы ----------
  # Никакой компиляции — просто публикуем изменившиеся Python/статика-файлы
  # как ассеты нового релиза. Приложение на устройстве само их подтянет
  # (см. OtaUpdater.kt) без переустановки APK.
  publish-hot-update:
    needs: [detect-changes, resolve-tag]
    if: needs.detect-changes.outputs.hot_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to publish if session.json leaked into the repo
        run: |
          if find . -iname "session.json" | grep -q .; then
            echo "::error::Found session.json in the checkout — it must never be committed (contains a live auth token). Aborting."
            exit 1
          fi

      - name: Sync bridge.py + static assets into Android Chaquopy folder
        run: bash scripts/sync-android-python.sh

      - name: Generate OTA manifest
        run: bash scripts/generate-ota-manifest.sh "${{ needs.resolve-tag.outputs.version_name }}"

      # Чтобы диагностировать "хэш вроде другой у файла, который не менялся"
      # без логов с телефона — просто печатаем сами хэши прямо в описание
      # релиза. Тогда два соседних hot-релиза на GitHub можно сравнить
      # построчно глазами: если хэш bridge.py совпадает у hot-26 и hot-27 —
      # значит OTA всё скачивает верно; если отличается — значит файл
      # реально изменился (например, из-за sed-патча импорта, который
      # прогоняется заново при каждой синхронизации).
      - name: Prepare per-file hash summary for release notes
        id: ota-summary
        run: |
          {
            echo "summary<<OTA_SUMMARY_EOF"
            python3 -c "
            import json
            m = json.load(open('ota/version.json', encoding='utf-8'))
            for name, h in sorted(m['files'].items()):
                print(f'- \`{name}\`: \`{h}\`')
            "
                        echo "OTA_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish hot-update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hot-${{ github.run_number }}
          name: "MAX Client — hot update ${{ needs.resolve-tag.outputs.version_name }}"
          body: |
            Только обновление Python/статики (bridge.py, index.html и т.п.),
            без изменений в нативном Android-коде. Полная пересборка APK
            для этого не запускалась.

            **sha256 файлов в этом обновлении** (сравни с прошлым hot-релизом,
            чтобы понять, что реально изменилось):
            ${{ steps.ota-summary.outputs.summary }}
          generate_release_notes: false
          # КРИТИЧНО: не даём этому релизу стать "latest release" в терминах
          # GitHub API/UI — иначе README-бейдж "Скачать APK" и прямая ссылка
          # releases/latest/download/app-debug.apk начнут указывать на релиз
          # без APK. OtaUpdater.kt из-за этого же переведён с
          # /releases/latest на /releases (полный список, включая
          # prerelease) — иначе он перестал бы видеть именно эти обновления.
          prerelease: true
          files: |
            ota/*.py
            ota/*.html
            ota/*.json
            ota/*.gif
            ota/assets/*
