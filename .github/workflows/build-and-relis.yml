name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Sync bridge.py + static assets into Android Chaquopy folder
        working-directory: .
        run: bash scripts/sync-android-python.sh

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Resolve release tag
        id: tag
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Ручной запуск без полей ввода — тег генерируется сам:
            # build-<номер запуска>, например build-17
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: MAX Client ${{ steps.tag.outputs.tag }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true