            try {
                var rq = indexedDB.open('tweb-account-1');

        (function () {
            // Имена воркеров/чанков не меняются при правках (хэш прежний), и Chrome держит старую копию.
            // bridge подставляет build; при его смене один раз перекачиваем воркеры с cache:'reload' и перезагружаем.
            var boot = /*TG_BOOT*/null;
            if (!boot || !boot.build) return;

            try {
                if (localStorage.getItem(K) === boot.build) return;
                localStorage.setItem(K, boot.build);
            } catch (e) { return; }
            // Service worker Web K отдаёт .js/.css/.json из кеша «cachedAssets» первым делом (cache-first) и сбрасывает его
            // только при смене собственного файла — поэтому правки чанков не доходили ни в браузере, ни в APK.
            // Чистим этот кеш напрямую и просим SW обновиться, затем перезагружаем страницу.
            var jobs = [];
            try { if (window.caches) jobs.push(caches.delete('cachedAssets')); } catch (e) { }
            try {
                if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                    return Promise.all(rs.map(function (r) { return r.update().catch(function () { }); }));
                }));
            } catch (e) { }
            Promise.all(jobs.map(function (p) { return Promise.resolve(p).catch(function () { }); })).then(function () { location.reload(); });
        })();

          if (!(n >= 1 && n <= 4)) n = 1;

          x.open('GET', '/api/account/status' + (n > 1 ? '?acc=' + n : ''), false);

          if (st.authorized === false) {
            location.replace('/?ui=classic&back=tg' + (n > 1 ? '&account=' + n : ''));

          if (n > 1 && !localStorage.getItem('account' + n)) {
            localStorage.setItem('account' + n, JSON.stringify({ userId: 100, dcId: 2, date: Math.floor(Date.now() / 1e3) }));

        } catch (e) {}

<!-- ==== ВРЕМЕННАЯ DEBUG-КОНСОЛЬ (убрать после диагностики офлайн-запуска) ==== -->
    <script>
        (function () {
            var maxLines = 1000;
            var MIN_HEIGHT = 120;
            var MAX_HEIGHT_RATIO = 0.85;
            var consoleHeight = Math.round(window.innerHeight * 0.32);
            try {
                var savedHeight = parseInt(localStorage.getItem('maxclient_debug_height'), 10);
                if (!isNaN(savedHeight)) consoleHeight = savedHeight;
            } catch (e) { }

            var box = document.createElement('div');
            box.id = 'debugConsole';
            box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);' +
                'color:#0f0;font:11px/1.4 monospace;overflow-y:scroll;-webkit-overflow-scrolling:touch;' +
                'touch-action:pan-y;overscroll-behavior:contain;z-index:2147483646;padding:18px 8px 6px 8px;' +
                'box-sizing:border-box;white-space:pre-wrap;word-break:break-all;border-top:2px solid #0f0;' +
                'display:none;height:' + consoleHeight + 'px;user-select:text;-webkit-user-select:text;';
            // Web K глобально запрещает выделение текста — разрешаем его внутри консоли.
            var selStyle = document.createElement('style');
            selStyle.textContent = '#debugConsole,#debugConsole *{user-select:text !important;-webkit-user-select:text !important;-webkit-touch-callout:default !important;}';
            document.head.appendChild(selStyle);

            // Полоска-хваталка сверху консоли — перетаскиванием вверх/вниз
            // можно менять её высоту (как перетаскиваемый bottom sheet).
            // position:absolute внутри position:fixed родителя не скроллится
            // вместе с содержимым лога — остаётся приклеенной к верхнему краю.
            var handle = document.createElement('div');
            handle.id = 'debugConsoleHandle';
            handle.style.cssText = 'position:absolute;top:0;left:0;right:0;height:16px;cursor:ns-resize;' +
                'display:flex;align-items:center;justify-content:center;touch-action:none;' +
                'background:rgba(0,0,0,0.92);z-index:1;';
            handle.innerHTML = '<div style="width:36px;height:4px;border-radius:2px;background:#0f0;opacity:0.6;"></div>';

            var toggle = document.createElement('button');
            toggle.textContent = '🐞';
            toggle.style.cssText = 'position:fixed;right:8px;z-index:2147483647;width:36px;' +
                'height:36px;border-radius:50%;background:#222;color:#0f0;border:1px solid #0f0;font-size:16px;' +
                'touch-action:none;';

            // Кнопки быстрой прокрутки лога вверх/вниз — видны только пока консоль открыта.
            var btnStyle = 'position:fixed;right:8px;z-index:2147483647;width:36px;height:36px;border-radius:50%;' +
                'background:#222;color:#0f0;border:1px solid #0f0;font-size:16px;display:none;';
            var btnTop = document.createElement('button');
            btnTop.textContent = '⬆';
            btnTop.style.cssText = btnStyle;
            btnTop.onclick = function () { box.scrollTop = 0; };
            var btnBottom = document.createElement('button');
            btnBottom.textContent = '⬇';
            btnBottom.style.cssText = btnStyle;
            btnBottom.onclick = function () { box.scrollTop = box.scrollHeight; };

            // 📋 — копирует весь лог в буфер обмена, 🗑 — очищает. Выделять текст пальцем тоже можно.
            var btnCopy = document.createElement('button');
            btnCopy.textContent = '📋';
            btnCopy.style.cssText = btnStyle;
            var btnClear = document.createElement('button');
            btnClear.textContent = '🗑';
            btnClear.style.cssText = btnStyle;
            function logText() {
                return Array.prototype.filter.call(box.children, function (c) { return c !== handle; })
                    .map(function (c) { return c.textContent; }).join('\n');
            }
            function copyLog() {
                var t = logText();
                function done(ok) {

                }
                function fallback() {
                    var ta = document.createElement('textarea');
                    ta.value = t;
                    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    var ok = false;
                    try { ok = document.execCommand('copy'); } catch (e) { }
                    ta.remove();
                    done(ok);

                    if (navigator.clipboard && navigator.clipboard.writeText) {

                        return;
                    }

            }
            btnCopy.onclick = copyLog;
            btnClear.onclick = function () {
                Array.prototype.slice.call(box.children).forEach(function (c) { if (c !== handle) box.removeChild(c); });
            };

            // Высота консоли определяет, где над ней висит кнопка-переключатель
            // и кнопки прокрутки — пересчитываем при каждом изменении высоты.
            // Все три кнопки размещаются НАД консолью (bottom = consoleHeight + 8),
            // в один ряд, чтобы консоль их не перекрывала.
            function layoutForHeight() {
                box.style.height = consoleHeight + 'px';
                btnTop.style.bottom = (consoleHeight + 8) + 'px';
                btnTop.style.right = '52px';
                btnBottom.style.bottom = (consoleHeight + 8) + 'px';
                btnBottom.style.right = '96px';
                btnCopy.style.bottom = (consoleHeight + 8) + 'px';
                btnCopy.style.right = '140px';
                btnClear.style.bottom = (consoleHeight + 8) + 'px';
                btnClear.style.right = '184px';
                if (!toggleHasCustomPos) {
                    // по умолчанию жук — в правом верхнем углу, поверх всего
                    toggle.style.left = 'auto';
                    toggle.style.bottom = 'auto';
                    toggle.style.top = 'calc(env(safe-area-inset-top, 0px) + 8px)';
                }
            }

            function saveHeight() {
                try { localStorage.setItem('maxclient_debug_height', String(consoleHeight)); } catch (e) { }
            }

            // --- Перетаскивание хваталки: изменение высоты консоли ---
            (function () {
                var dragging = false;
                var startY = 0;

                handle.addEventListener('pointerdown', function (e) {
                    dragging = true;
                    startY = e.clientY;
                    startHeight = consoleHeight;
                    try { handle.setPointerCapture(e.pointerId); } catch (err) { }

                handle.addEventListener('pointermove', function (e) {
                    if (!dragging) return;
                    var dy = e.clientY - startY;
                    var maxHeight = Math.round(window.innerHeight * MAX_HEIGHT_RATIO);

                    layoutForHeight();
                });
                function endHandleDrag() {
                    if (!dragging) return;
                    dragging = false;
                    saveHeight();
                }
                handle.addEventListener('pointerup', endHandleDrag);
                handle.addEventListener('pointercancel', endHandleDrag);
            })();

            // --- Перетаскивание кнопки 🐞 в любое место экрана (как иконка mod-меню) ---
            var toggleHasCustomPos = false;
            (function () {
                var DRAG_THRESHOLD = 6;
                var dragging = false;
                var moved = false;
                var startX = 0, startY = 0;
                var startRight = 0, startBottom = 0;

                try {
                    var saved = JSON.parse(localStorage.getItem('maxclient_debug_btn_pos') || 'null');
                    if (saved && typeof saved.right === 'number' && typeof saved.bottom === 'number') {
                        toggleHasCustomPos = true;
                        applyTogglePos(saved.right, saved.bottom);
                    }
                } catch (e) { }

                function applyTogglePos(right, bottom) {
                    var maxRight = window.innerWidth - 36 - 4;
                    var maxBottom = window.innerHeight - 36 - 4;
                    right = Math.max(4, Math.min(right, maxRight));
                    bottom = Math.max(4, Math.min(bottom, maxBottom));
                    toggle.style.left = 'auto';
                    toggle.style.top = 'auto';
                    toggle.style.right = right + 'px';
                    toggle.style.bottom = bottom + 'px';

                }

                toggle.addEventListener('pointerdown', function (e) {
                    dragging = true;
                    moved = false;
                    startX = e.clientX;
                    startY = e.clientY;
                    var rect = toggle.getBoundingClientRect();

                    startBottom = window.innerHeight - rect.bottom;

                function endToggleDrag(e) {
                    if (!dragging) return;
                    dragging = false;
                    if (moved) {
                        var rect = toggle.getBoundingClientRect();
                        var pos = { right: window.innerWidth - rect.right, bottom: window.innerHeight - rect.bottom };

                toggle.addEventListener('pointercancel', endToggleDrag);

                toggle.style.cssText = 'position:fixed;right:8px;z-index:10000000;width:36px;' +
                    'height:36px;border-radius:50%;background:#222;color:#0f0;border:1px solid #0f0;font-size:16px;' +
                    'touch-action:none;cursor:pointer;';
            })();

            toggle.onclick = function () {
                var show = box.style.display === 'none';
                box.style.display = show ? 'block' : 'none';
                btnTop.style.display = show ? 'block' : 'none';
                btnBottom.style.display = show ? 'block' : 'none';
                btnCopy.style.display = show ? 'block' : 'none';
                btnClear.style.display = show ? 'block' : 'none';
                if (show) box.scrollTop = box.scrollHeight;
            };

            function addLine(text, color) {
                // Автопрокрутка вниз только если пользователь и так уже был у низа —
                // иначе он не смог бы пролистать лог вверх руками во время потока
                // новых сообщений (как это нормально работает на странице/в чатах).
                var wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
                var line = document.createElement('div');
                if (color) line.style.color = color;
                line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text;
                box.appendChild(line);
                while (box.children.length > maxLines) box.removeChild(box.firstChild);
                if (wasAtBottom) box.scrollTop = box.scrollHeight;
            }

            function toText(a) {
                try {
                    if (typeof a === 'string') return a;
                    if (a instanceof Error) return a.stack || a.message;
                    // Event (напр. «video load error») сериализуется в {} — разворачиваем сами.

                    // ниже и превращалась в бесполезное "JS error @ :". Берём

                        window.__mxVidDiag[vsrc] = 1;
                        fetch(vsrc).then(function (r) { return r.blob(); }).then(function (bl) {
                            return bl.arrayBuffer().then(function (ab) {
                                var u8 = new Uint8Array(ab), n = u8.length;
                                function s4(i) { return String.fromCharCode(u8[i], u8[i + 1], u8[i + 2], u8[i + 3]); }
                                function find(tag) {
                                    for (var i = 0; i + 4 <= n; i++) { if (u8[i] === tag.charCodeAt(0) && s4(i) === tag) return i; }
                                    return -1;
                                }
                                var codecs = ['avc1', 'hvc1', 'hev1', 'av01', 'vp09', 'mp4v'].filter(function (c) { return find(c) >= 0; });
                                var moov = find('moov'), mdat = find('mdat');
                                var hex = Array.prototype.slice.call(u8.subarray(0, 12)).map(function (x) { return ('0' + x.toString(16)).slice(-2); }).join(' ');
                                var ok = ['video/mp4; codecs="avc1.640028"', 'video/mp4; codecs="hvc1.1.6.L93.B0"', 'video/mp4'].map(function (m) { return m.split(';')[0] + (m.indexOf('hvc1') > 0 ? '[hevc]' : m.indexOf('avc1') > 0 ? '[avc]' : '') + '=' + (document.createElement('video').canPlayType(m) || 'no'); }).join(' ');
                                var holder = t.closest ? t.closest('[data-doc-id]') : null, bub = t.closest ? t.closest('.bubble') : null;
                                addLine('🔬 blob видео: doc=' + (holder ? holder.dataset.docId : '?') + ' mid=' + (bub ? bub.dataset.mid : '?') + ' size=' + bl.size + ' type=' + (bl.type || '(пусто)') + ' head=' + hex + ' brand=' + (n > 12 ? s4(8) : '?') + ' moov@' + moov + ' mdat@' + mdat + ' (размер ' + n + ') codec=' + (codecs.join(',') || '?') + ' canPlay: ' + ok, '#6cf');
                            });
                        }).catch(function (e2) { addLine('🔬 blob видео не прочитан: ' + e2, '#fa0'); });
                    }
                } else {
                    addLine('❌ ' + (e.message || 'JS error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''), '#f66');
                }
            }, true);

            window.addEventListener('unhandledrejection', function (e) {
                addLine('❌ Unhandled promise rejection: ' + toText(e.reason), '#f66');
            });

            try {
                var bc = new BroadcastChannel('mxlog');
                bc.onmessage = function (ev) {
                    var d = ev.data || {};
                    addLine('[worker] ' + (d.l === 'error' ? '❌ ' : (d.l === 'warn' ? '⚠️ ' : '')) + d.a, d.l === 'error' ? '#f66' : (d.l === 'warn' ? '#fd6' : '#6cf'));
                };
            } catch (e) { }
            box.appendChild(handle);
            document.body.appendChild(box);
            document.body.appendChild(toggle);
            document.body.appendChild(btnTop);
            document.body.appendChild(btnBottom);
            document.body.appendChild(btnCopy);
            document.body.appendChild(btnClear);
            box.addEventListener('touchmove', function (e) { e.stopPropagation(); }, { passive: true });
            layoutForHeight();
            addLine('Debug-консоль /tg/ запущена (логи воркера: [worker])');
        })();
    </script>
