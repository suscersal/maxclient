<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX Client</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('maxclient_theme') || 'dark';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            background: #f5f5f5;
        }

        @media (min-width: 900px) {
            body {
                max-width: 800px;
            }
        }

        @media (min-width: 1300px) {
            body {
                max-width: 1000px;
            }
        }

        @media (min-width: 1700px) {
            body {
                max-width: 1200px;
            }
        }

        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 20px;
            overflow: auto;
            background: #f5f5f5;
            transition: opacity 0.25s ease;
        }

        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loadingOverlay img {
            max-width: 60vw;
            max-height: 50vh;
            border-radius: 12px;
            flex-shrink: 0;
        }

        #loadingOverlay .loading-label {
            font-size: 15px;
            color: #666;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        #loadingOverlay .loading-label .dots span {
            opacity: 0;
            animation: loadingDot 1.4s infinite;
        }

        #loadingOverlay .loading-label .dots span:nth-child(1) {
            animation-delay: 0s;
        }

        #loadingOverlay .loading-label .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        #loadingOverlay .loading-label .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes loadingDot {

            0%,
            80%,
            100% {
                opacity: 0;
            }

            40% {
                opacity: 1;
            }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #007bff;
        }

        .section {
            margin: 16px 0;
            padding: 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #555;
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .input-group input {
            flex: 1;
            min-width: 150px;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        /* ===== НОВЫЕ СТИЛИ ДЛЯ НАСТРОЕК (МОБИЛЬНАЯ ВЕРСИЯ) ===== */

/* Меню настроек — ограничиваем высоту и делаем скролл */
.settings-menu {
    max-height: 200px; /* Показываем ~3-4 пункта */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
}

/* Скрываем скроллбар для чистоты интерфейса */
.settings-menu::-webkit-scrollbar {
    width: 3px;
}
.settings-menu::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 3px;
}

/* Уменьшаем отступы в меню для компактности */
.settings-menu-item {
    padding: 10px 12px;
    font-size: 14px;
    min-height: 44px;
}

.settings-menu-item .icon {
    font-size: 18px;
    width: 28px;
}

/* Контент настройки тоже с ограничением */
.settings-content {
    max-height: 50vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 0;
}

/* Сама модалка чуть меньше, чтобы влезала на экран */
.settings-modal {
    max-height: 80vh;
    padding: 16px 16px 20px;
}

.settings-modal-header h2 {
    font-size: 18px;
}

/* В тёмной теме поправляем скроллбар */
html[data-theme="dark"] .settings-menu::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
}

        .input-group button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        /* ===== ИСПРАВЛЕНИЯ ДЛЯ ТЁМНОЙ ТЕМЫ ===== */

/* Цвета текста в настройках */
.settings-modal h2,
.settings-modal .settings-menu-item,
.settings-modal .settings-content-page,
.settings-modal .settings-empty,
.settings-modal label,
.settings-modal .settings-row input,
.settings-modal .settings-row select,
.settings-modal .settings-content-footer button {
    color: inherit;
}

/* Фон модалки в тёмной теме */
html[data-theme="dark"] .settings-modal {
    background: #1C1C1E;
}

html[data-theme="dark"] .settings-modal-header {
    border-bottom-color: #2C2C2E;
}

html[data-theme="dark"] .settings-modal-header h2 {
    color: #FFFFFF;
}

/* Пункты меню */
html[data-theme="dark"] .settings-menu-item {
    color: #FFFFFF;
}

html[data-theme="dark"] .settings-menu-item:hover {
    background: rgba(255, 255, 255, 0.08);
}

html[data-theme="dark"] .settings-menu-item:active {
    background: rgba(255, 255, 255, 0.12);
}

/* Текст в контенте */
html[data-theme="dark"] .settings-content-page {
    color: #FFFFFF;
}

html[data-theme="dark"] .settings-empty {
    color: #8E8E93;
}

/* Поля ввода */
html[data-theme="dark"] .settings-row input,
html[data-theme="dark"] .settings-row select {
    background: #2C2C2E;
    border-color: #3A3A3C;
    color: #FFFFFF;
}

html[data-theme="dark"] .settings-row input:focus {
    border-color: #4DA3FF;
}

/* Кнопки */
html[data-theme="dark"] .btn-add {
    background: rgba(77, 163, 255, 0.15);
    color: #4DA3FF;
}

html[data-theme="dark"] .btn-save {
    background: #4DA3FF;
    color: #FFFFFF;
}

html[data-theme="dark"] .settings-modal-close {
    background: #2C2C2E;
    color: #FFFFFF;
}

/* Чекбоксы и переключатели */
html[data-theme="dark"] .settings-row label {
    color: #FFFFFF;
}

/* Меню-разделитель */
html[data-theme="dark"] .settings-menu-divider {
    border-color: #2C2C2E;
}

/* Опасные кнопки */
html[data-theme="dark"] .settings-menu-item.danger {
    color: #FF6B6B;
}

html[data-theme="dark"] .settings-menu-item.danger:hover {
    background: rgba(255, 107, 107, 0.12);
}

html[data-theme="dark"] .settings-logout-btn {
    background: #E53935;
    color: #FFFFFF;
}

html[data-theme="dark"] .settings-logout-btn:hover {
    background: #C62828;
}

/* Для полей ввода пароля и прочего */
html[data-theme="dark"] #passwordSection {
    background: rgba(255, 160, 0, 0.12);
    border-color: rgba(255, 160, 0, 0.3);
}

html[data-theme="dark"] #passwordSection .password-hint {
    color: #FFB84D;
}

html[data-theme="dark"] #passwordSection .password-email {
    color: #8E8E93;
}

/* Статус в настройках */
html[data-theme="dark"] #scamCheckStatus,
html[data-theme="dark"] #transcribeStatus {
    color: #8E8E93;
}

        .input-group button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        /* ===== ДЕБАГ-КОНСОЛЬ ПОВЕРХ ВСЕГО ===== */

/* Сама консоль уже имеет z-index: 999999, но для надёжности */
#debugConsole {
    z-index: 9999999 !important; /* Выше всех модалок */
}

/* Кнопка-жук */
#debugConsoleToggle {
    z-index: 10000000 !important; /* Ещё выше консоли */
}

/* Кнопки прокрутки */
#debugConsoleBtnTop,
#debugConsoleBtnBottom {
    z-index: 10000001 !important;
}

/* Полоска-хваталка */
#debugConsoleHandle {
    z-index: 10000002 !important;
}

/* Убеждаемся, что модалки НЕ перекрывают консоль */
.settings-modal-overlay,
.chat-profile-overlay,
.video-modal,
.media-viewer {
    z-index: 1000000 !important; /* Меньше, чем у консоли */
}

/* Мини-приложение тоже ниже дебаг-консоли */
.miniapp-overlay {
    z-index: 999999 !important;
}

/* Чтобы консоль не перекрывала саму себя */
#debugConsole * {
    z-index: auto !important;
}

        .input-group button.success {
            background: #28a745;
        }

        .input-group button.warning {
            background: #ffc107;
            color: #000;
        }

        .input-group button.danger {
            background: #dc3545;
        }

        .status {
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        #log {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            max-height: 240px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #d4d4d4;
            line-height: 1.6;
        }

        .log-entry.info {
            color: #9cdcfe;
        }

        .log-entry.success {
            color: #6a9955;
        }

        .log-entry.error {
            color: #f48771;
        }

        .log-entry .time {
            color: #6a6a6a;
            margin-right: 8px;
        }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.online {
            background: #28a745;
            color: white;
        }

        .badge.offline {
            background: #dc3545;
            color: white;
        }

        .badge.auth-error {
            background: #ffc107;
            color: #000;
        }

        .hidden {
            display: none !important;
        }

        .search-toggle-btn {
            display: none;
        }

        .section-header-row {
            display: none;
        }

        #chatsSection {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 6px !important;
        }

        .search-hint {
            font-size: 12px;
            color: #888;
            margin: -4px 0 10px 2px;
        }

        #globalSearchResultsList {
            margin-top: 4px;
        }

        #globalSearchResultsList.hidden {
            display: none;
        }

        .global-search-label {
            font-size: 12px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin: 10px 2px 4px;
            padding: 0 4px;
        }

        .chat-list-divider {
            height: 1px;
            margin: 8px 4px;
            background: #eee;
        }

        html[data-theme="dark"] .chat-list-divider {
            background: #2C2C2E;
        }

        #globalSearchResultsList .chat-item {
            border-bottom: 1px solid #eee;
        }

        .search-empty {
            font-size: 13px;
            color: #888;
            padding: 8px 4px;
        }

        #localChatSearchWrap {
            margin: 0 6px 14px;
        }

        #localChatSearchInput {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            background: var(--tg-panel, #f0f2f5);
            color: var(--tg-text, #17212B);
        }

        #localChatSearchInput::placeholder {
            color: var(--tg-text-secondary, #8A9199);
        }

        #localChatSearchInput:focus {
            outline: none;
            background: var(--tg-panel, #fff);
        }

        #revokeContactsAccessBtn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 8px 12px;
            border: none;
            border-radius: 10px;
            background: #fdecea;
            color: #c0392b;
            font-size: 12px;
            cursor: pointer;
        }

        #revokeContactsAccessBtn:hover {
            background: #fbd8d4;
        }

        .mention-link {
            color: #007bff;
            text-decoration: underline;
            cursor: pointer;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 4px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-item:hover {
            background: #f8f9fa;
        }

        .chat-item:last-child {
            border-bottom: none;
        }

        .chat-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4da3ff, #6a5af9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 26px;
            color: #fff;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-weight: 600;
            font-size: 17px;
        }

        .chat-preview {
            font-size: 15px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-meta {
            font-size: 12px;
            color: #aaa;
            text-align: right;
            flex-shrink: 0;
        }

        .unread {
            background: #007bff;
            color: white;
            border-radius: 10px;
            font-size: 11px;
            padding: 1px 6px;
            margin-top: 4px;
            display: inline-block;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .chat-header .chat-name-clickable {
            cursor: pointer;
            border-radius: 8px;
            padding: 2px 6px;
            transition: background 0.2s;
        }

        .chat-header .chat-name-clickable:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .chat-header .chat-avatar {
            width: 32px;
            height: 32px;
        }

        .chat-header .chat-info-block {
            flex: 1;
            min-width: 0;
        }

        .chat-header .chat-id-label {
            font-size: 11px;
            color: #999;
            white-space: nowrap;
            margin-left: 4px;
        }

        .msg-enc-badge {
            font-size: 11px;
            color: #4caf50;
            opacity: 0.75;
            margin-top: 2px;
        }

        .msg-enc-badge-error {
            color: #e53935;
        }

        .msg-scam-badge {
            font-size: 11px;
            color: #e53935;
            background: rgba(229, 57, 53, 0.1);
            border: 1px solid rgba(229, 57, 53, 0.3);
            border-radius: 6px;
            padding: 4px 6px;
            margin-top: 4px;
            line-height: 1.35;
        }

        /* Бейдж для сообщений, которые прошли скам-проверку и НЕ похожи на
           скам — процент риска всё равно показываем, просто нейтральным
           цветом, чтобы не путать с предупреждением. */
        .msg-scam-badge.msg-scam-badge-safe {
            color: #888;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        /* Средняя категория риска: confidence в [50, 90) — "вероятно скам".
           Оранжевый, чтобы отличать от явного красного скама (>=90). */
        .msg-scam-badge.msg-scam-badge-likely {
            color: #e07b00;
            background: rgba(224, 123, 0, 0.1);
            border: 1px solid rgba(224, 123, 0, 0.3);
        }

        /* Маленький чип "быстро" рядом с бейджем скам-проверки — как у
           Gemini/подобных: просто факт скорости, без объяснения методики. */
        .msg-scam-speed-chip {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 10px;
            color: #888;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            padding: 1px 6px;
            margin-left: 6px;
            vertical-align: middle;
            white-space: nowrap;
        }

        .bot-webapp-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 11px 16px;
            margin: 0 0 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(180deg, #ecf6ff 0%, #e3f1fc 100%);
            color: #2481cc;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(36, 129, 204, 0.12);
            transition: background 0.15s, transform 0.1s;
        }

        .bot-webapp-bar:active {
            background: #d9ebfa;
            transform: scale(0.99);
        }

        .bot-webapp-bar .bot-webapp-icon {
            font-size: 17px;
            line-height: 1;
            opacity: 0.9;
        }

        #messagesList {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 50vh;
            overflow-y: auto;
            padding: 4px;
            margin-bottom: 10px;
        }

        .msg-bubble {
            position: relative;
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 14px;
            background: #f0f0f0;
            align-self: flex-start;
        }

        .msg-bubble.own {
            background: #d1e7ff;
            align-self: flex-end;
        }

        .msg-time {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
            text-align: right;
        }

        .msg-img {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 4px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .msg-img:hover {
            opacity: 0.85;
        }

        .msg-attach {
            margin-bottom: 6px;
        }

        .msg-video-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            max-width: 350px;
            min-width: 200px;
            margin: 4px 0;
            background: #000;
            cursor: pointer;
        }

        .msg-video-poster {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #1a1a1a;
            cursor: pointer;
        }

        .msg-video-poster img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .msg-video-poster .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            transition: transform 0.2s, background 0.2s;
        }

        .msg-video-poster:hover .play-icon {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(0, 0, 0, 0.4);
        }

        .msg-video-poster .duration-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .inline-video-el {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .inline-top-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            z-index: 3;
        }

        .inline-bottom-actions {
            position: absolute;
            bottom: 8px;
            left: 8px;
            z-index: 3;
        }

        .inline-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            border: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .msg-video-container.loading .msg-video-poster {
            opacity: 0.5;
        }

        .video-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            z-index: 10000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            align-items: center;
            justify-content: center;
        }

        .video-modal.active {
            display: flex;
        }

        .video-modal .video-wrapper {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            width: auto;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 12px;
            overflow: hidden;

            border-top: 1px solid #e8e8e8;
            margin: 6px 0;
        }

        /* Красная кнопка в профиле чата */
        .chat-profile-danger {
            color: #dc3545;
        }

        .chat-profile-danger:hover {
            background: rgba(220, 53, 69, 0.08);
        }

        .chat-profile-danger:active {
            background: rgba(220, 53, 69, 0.15);
        }

        /* --- Клавиатура бота (inline_keyboard) --- */
        .msg-keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
            width: 100%;
        }

        .msg-keyboard-row {
            display: flex;
            gap: 6px;
        }

        .msg-keyboard-btn {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #007bff;
            border-radius: 8px;
            background: #fff;
            color: #007bff;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .msg-keyboard-btn:active {
            background: #eaf3ff;
        }

        .msg-keyboard-btn.link-btn::after {
            content: " ↗";
        }

        .bot-badge {
            display: inline-block;
            margin-left: 4px;
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
            background: #e8f0fe;
            color: #1a73e8;
            vertical-align: middle;
        }

        /* --- Мини-приложение (bot web app) --- */
        .miniapp-overlay {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 2000;
            display: flex;
            flex-direction: column;
        }



        .miniapp-top-alert {
            position: fixed;
            /* Привязка к экрану */
            top: 0;
            /* В самый верх */
            left: 50%;
            /* Сдвиг на 50% слева */
            transform: translateX(-50%);
            /* Идеальное центрирование по горизонтали */

            width: 100%;
            /* По умолчанию на всю ширину для мобильных */
            max-width: 600px;
            /* Ограничение ширины на компьютерах, чтобы не растягивался */

            padding: 8px 16px;
            /* Внутренние отступы */
            background-color: #fff3cd;
            /* Заметный желтый цвет */
            color: #856404;
            /* Темный читаемый текст */
            border-bottom: 1px solid #ffeeba;
            /* Красивая полоса снизу */

            font-size: 13px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            /* Тень, чтобы визуально приподнять над контентом */
            z-index: 9999;
            /* Самый высокий приоритет, перекроет шапку и iframe */
        }

        /* Сдвигаем шапку чуть ниже, чтобы предупреждение её не перекрывало визуально */
        .miniapp-header {
            margin-top: 35px;
            /* Высота равна примерно высоте предупреждения */
        }


        /* На мобильных экранах скрываем стандартный заголовок, чтобы текст не накладывался друг на друга */
        @media (max-width: 600px) {
            .miniapp-title {
                visibility: hidden;
                /* Скрывает текст «Мини-приложение», освобождая место */
            }

            .miniapp-warning-header {
                width: 75%;
                /* На смартфонах даем предупреждению больше места */
            }
        }



        .miniapp-overlay.hidden {
            display: none;
        }

        .miniapp-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
            background: #f7f7f8;
            flex-shrink: 0;
        }

        .miniapp-header .miniapp-back-btn {
            display: none;
            border: none;
            background: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .miniapp-header .miniapp-back-btn.visible {
            display: inline-block;
        }

        .miniapp-header .miniapp-title {
            flex: 1;
            font-weight: 600;
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .miniapp-header .miniapp-close-btn {
            border: none;
            background: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            color: #888;
        }

        .miniapp-iframe {
            flex: 1;
            width: 100%;
            border: none;
        }

        /* ================================================================
           TELEGRAM-STYLE THEME OVERRIDE
           Переопределяет внешний вид под интерфейс Telegram/MAX, не трогая
           разметку и логику выше — все селекторы те же, меняется только
           оформление (правила ниже по каскаду имеют приоритет).
           ================================================================ */
        :root {
            --tg-blue: #2AABEE;
            --tg-blue-dark: #229ED9;
            --tg-blue-deep: #168ACD;
            --tg-bg: #E7EBF0;
            --tg-panel: #ffffff;
            --tg-text: #17212B;
            --tg-text-secondary: #8A9199;
            --tg-border: #EBEEF0;
            --tg-own-bubble: linear-gradient(135deg, #3E96FF, #2E86F5);
            --tg-incoming-bubble: #ffffff;
        }

        html {
            background: var(--tg-bg);
        }

        body {
            background: var(--tg-bg);
            color: var(--tg-text);
            padding: 0 0 24px;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 8px;
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 26px;
            font-weight: 700;
            color: var(--tg-text);
            background: transparent;
            border-bottom: none;
            margin: 4px 0 6px;
            padding: 10px 16px 0;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: none;
        }

        h1::before {
            content: '';
        }

        h1 .badge {
            width: 10px;
            height: 10px;
            padding: 0;
            border-radius: 50%;
            font-size: 0;
            overflow: hidden;
            flex-shrink: 0;
        }

        h1 .badge.auth-error {
            background: #FFA000;
        }

        h1 .gear-btn {
            color: var(--tg-text-secondary);
        }

        .app-topbar-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .gear-btn {
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .gear-btn:hover {
            background: rgba(255, 255, 255, 0.18) !important;
        }

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            background: var(--tg-panel);
            border-top: 1px solid var(--tg-border);
            padding: 6px 0 max(6px, env(safe-area-inset-bottom));
            z-index: 60;
        }

        .bottom-nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            padding: 4px 0;
            font-size: 10px;
            font-weight: 500;
            color: var(--tg-text-secondary);
            cursor: pointer;
        }

        .bottom-nav-item .bn-icon {
            font-size: 20px;
            line-height: 1;
        }

        .bottom-nav-item.active {
            color: var(--tg-blue);
        }

        body.has-bottom-nav {
            padding-bottom: 74px;
        }

        #status {
            margin: 0 16px 10px;
        }

        .section {
            margin: 12px 16px;
            padding: 12px 14px;
            background: var(--tg-panel);
            border-radius: 16px;
            box-shadow: 0 1px 3px rgba(23, 33, 43, 0.06);
        }

        .section h3 {
            color: var(--tg-text);
            font-weight: 600;
        }

        .input-group input {
            border: 1px solid var(--tg-border);
            background: #F5F7F9;
            border-radius: 20px;
            padding: 10px 16px;
        }

        .input-group input:focus {
            border-color: var(--tg-blue);
            background: #fff;
        }

        .input-group button {
            background: var(--tg-blue);
            border-radius: 20px;
            font-weight: 600;
            transition: background 0.15s, transform 0.1s;
        }

        .input-group button:hover:not(:disabled) {
            background: var(--tg-blue-dark);
        }

        .input-group button:active:not(:disabled) {
            transform: scale(0.97);
        }

        .input-group button.success {
            background: #31B545;
        }

        .input-group button.warning {
            background: #FFA000;
            color: #fff;
        }

        .status {
            border-radius: 12px;
        }

        .badge {
            border-radius: 20px;
        }

        .badge.online {
            background: #31B545;
        }

        .badge.offline {
            background: #E53935;
        }

        /* ---- Список чатов ---- */
        .chat-item {
            gap: 12px;
            padding: 10px 6px;
            border-bottom: none;
            border-radius: 12px;
        }

        .chat-item:hover {
            background: #F0F4F8;
        }

        .chat-avatar {
            width: 54px;
            height: 54px;
            font-size: 19px;
        }

        .chat-name {
            color: var(--tg-text);
            font-size: 15.5px;
        }

        .chat-preview {
            color: var(--tg-text-secondary);
            font-size: 14px;
            margin-top: 2px;
        }

        .chat-meta {
            color: #A6ADB4;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .unread {
            background: var(--tg-blue);
            border-radius: 999px;
            min-width: 20px;
            height: 20px;
            line-height: 18px;
            padding: 0 6px;
            font-weight: 700;
            text-align: center;
            margin-top: 0;
        }

        .online-dot {
            background: #31B545;
        }

        /* ---- Офлайн-баннер сохранённых чатов ---- */
        .offline-cache-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 4px 10px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #FFF4E0;
            border: 1px solid #FCE2AE;
            color: #8A5A00;
            font-size: 13px;
            line-height: 1.4;
        }

        .offline-cache-banner-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .offline-cache-banner-time {
            color: #B98A2E;
        }

        /* ---- Переписка ---- */
        #chatDetailSection {
            padding: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        .chat-header {
            background: var(--tg-panel);
            padding: 10px 12px;
            margin: 0;
            position: sticky;
            top: 0;
            z-index: 5;
            box-shadow: 0 1px 0 var(--tg-border);
        }

        .chat-header .chat-avatar {
            width: 38px;
            height: 38px;
        }

        .back-btn {
            border-radius: 50%;
            width: 34px;
            height: 34px;
            color: var(--tg-blue);
        }

        .back-btn:hover {
            background: #F0F4F8;
        }

        #messagesList {
            background: #E9EEF3;
            padding: 12px;
            border-radius: 0;
        }

        .date-separator {
            align-self: center;
            margin: 6px 0;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(23, 33, 43, 0.06);
            color: var(--tg-text-secondary);
            font-size: 12px;
            font-weight: 500;
            text-align: center;
        }

        .msg-bubble {
            background: var(--tg-incoming-bubble);
            border-radius: 16px 16px 16px 4px;
            box-shadow: 0 1px 2px rgba(23, 33, 43, 0.08);
            padding: 7px 10px 6px;
        }

        .msg-bubble.own {
            background: var(--tg-own-bubble);
            color: #fff;
            border-radius: 16px 16px 4px 16px;
            box-shadow: 0 1px 3px rgba(46, 134, 245, 0.35);
        }

        .msg-bubble.own .msg-text,
        .msg-bubble.own .msg-file a {
            color: #fff;
        }

        .msg-bubble.own .msg-time {
            color: rgba(255, 255, 255, 0.8);
        }

        .msg-bubble.own .msg-status.sent {
            color: rgba(255, 255, 255, 0.75);
        }

        .msg-bubble.own .msg-status.read {
            color: #fff;
        }

        .msg-bubble.own .msg-enc-badge {
            color: #d8ffd8;
        }

        .msg-file a {
            color: var(--tg-blue-dark);
        }

        .reaction-badge.mine {
            background: var(--tg-blue);
        }

        /* ================================================================
           DARK THEME (MAX-style) — переопределяет светлую тему выше,
           тот же приём каскада: селекторы те же, только оформление.
           ================================================================ */
        html[data-theme="dark"] {
            --tg-blue: #4DA3FF;
            --tg-blue-dark: #2E86F5;
            --tg-blue-deep: #1F6FD6;
            --tg-bg: #000000;
            --tg-panel: #1C1C1E;
            --tg-text: #FFFFFF;
            --tg-text-secondary: #8E8E93;
            --tg-border: #2C2C2E;
            --tg-own-bubble: linear-gradient(135deg, #4DA3FF, #2E86F5);
            --tg-incoming-bubble: #1C1C1E;
        }

        html[data-theme="dark"] html,
        html[data-theme="dark"] body {
            background: #000 !important;
        }

        html[data-theme="dark"] #loadingOverlay {
            background: #000 !important;
        }

        html[data-theme="dark"] #loadingOverlay .loading-label {
            color: #8E8E93 !important;
        }

        html[data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2) !important;
        }

        html[data-theme="dark"] .section {
            background: var(--tg-panel) !important;
            border: 1px solid var(--tg-border);
            box-shadow: none !important;
        }

        html[data-theme="dark"] .section h3 {
            color: var(--tg-text) !important;
        }

        html[data-theme="dark"] .input-group input {
            background: #2C2C2E !important;
            border-color: #3A3A3C !important;
            color: #fff !important;
        }

        html[data-theme="dark"] .input-group input:focus {
            background: #2C2C2E !important;
        }

        html[data-theme="dark"] .status.success {
            background: rgba(49, 181, 69, 0.15) !important;
            color: #4CD964 !important;
        }

        html[data-theme="dark"] .status.error {
            background: rgba(229, 57, 53, 0.15) !important;
            color: #FF6B6B !important;
        }

        html[data-theme="dark"] .status.info {
            background: rgba(77, 163, 255, 0.15) !important;
            color: #4DA3FF !important;
        }

        html[data-theme="dark"] .search-hint,
        html[data-theme="dark"] .search-empty,
        html[data-theme="dark"] .global-search-label {
            color: #8E8E93 !important;
        }

        html[data-theme="dark"] #globalSearchResultsList .chat-item {
            border-bottom-color: #2C2C2E !important;
        }

        html[data-theme="dark"] #localChatSearchInput {
            background: #2C2C2E !important;
            border-color: #3A3A3C !important;
            color: #fff !important;
        }

        html[data-theme="dark"] #localChatSearchInput:focus {
            background: #2C2C2E !important;
            border-color: #4DA3FF !important;
        }

        html[data-theme="dark"] #revokeContactsAccessBtn {
            background: rgba(229, 57, 53, 0.15) !important;
            color: #FF6B6B !important;
        }

        html[data-theme="dark"] #revokeContactsAccessBtn:hover {
            background: rgba(229, 57, 53, 0.25) !important;
        }

        html[data-theme="dark"] .chat-item:hover {
            background: #1C1C1E !important;
        }

        html[data-theme="dark"] .chat-name {
            color: #fff !important;
        }

        html[data-theme="dark"] .chat-meta {
            color: #8E8E93 !important;
        }

        html[data-theme="dark"] .offline-cache-banner {
            background: rgba(255, 160, 0, 0.12) !important;
            border-color: rgba(255, 160, 0, 0.3) !important;
            color: #FFB84D !important;
        }

        html[data-theme="dark"] .offline-cache-banner-time {
            color: #FFB84D !important;
        }

        html[data-theme="dark"] .back-btn:hover {
            background: #2C2C2E !important;
        }

        html[data-theme="dark"] #messagesList {
            background: #000 !important;
        }

        html[data-theme="dark"] .date-separator {
            background: rgba(255, 255, 255, 0.08) !important;
            color: #8E8E93 !important;
        }

        html[data-theme="dark"] .msg-bubble {
            background: var(--tg-incoming-bubble) !important;
            color: #fff !important;
        }

        html[data-theme="dark"] .msg-file a {
            color: #4DA3FF !important;
        }

        html[data-theme="dark"] .miniapp-header .miniapp-close-btn {
            color: #8E8E93 !important;
        }

        /* Ловим оставшиеся светлые инлайн-стили из JS (модалки, настройки,
           device-id, антискам и т.п.), не переписывая каждую строку JS. */
        html[data-theme="dark"] [style*="background:#fff"],
        html[data-theme="dark"] [style*="background: #fff"],
        html[data-theme="dark"] [style*="background:#ffffff"],
        html[data-theme="dark"] [style*="background: #ffffff"],
        html[data-theme="dark"] [style*="background:white"],
        html[data-theme="dark"] [style*="background: white"] {
            background: #1C1C1E !important;
        }

        html[data-theme="dark"] [style*="background:#f5f5f5"],
        html[data-theme="dark"] [style*="background: #f5f5f5"],
        html[data-theme="dark"] [style*="background:#f8f9fa"],
        html[data-theme="dark"] [style*="background: #f8f9fa"],
        html[data-theme="dark"] [style*="background:#f0f0f0"],
        html[data-theme="dark"] [style*="background: #f0f0f0"],
        html[data-theme="dark"] [style*="background:#f7f7f8"],
        html[data-theme="dark"] [style*="background: #f7f7f8"],
        html[data-theme="dark"] [style*="background:#eee"],
        html[data-theme="dark"] [style*="background: #eee"] {
            background: #2C2C2E !important;
        }

        html[data-theme="dark"] [style*="color:#555"],
        html[data-theme="dark"] [style*="color: #555"],
        html[data-theme="dark"] [style*="color:#333"],
        html[data-theme="dark"] [style*="color: #333"],
        html[data-theme="dark"] [style*="color:#222"],
        html[data-theme="dark"] [style*="color: #222"],
        html[data-theme="dark"] [style*="color:#000"],
        html[data-theme="dark"] [style*="color: #000"] {
            color: #C7C7CC !important;
        }

        html[data-theme="dark"] [style*="border:1px solid #555"] {
            border-color: #3A3A3C !important;
        }
    </style>
</head>

            box.id = 'debugConsole';
            box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);' +
                'color:#0f0;font:11px/1.4 monospace;overflow-y:scroll;-webkit-overflow-scrolling:touch;' +
                'touch-action:pan-y;overscroll-behavior:contain;z-index:999999;padding:18px 8px 6px 8px;' +
                'box-sizing:border-box;white-space:pre-wrap;word-break:break-all;border-top:2px solid #0f0;' +
                'display:none;height:' + consoleHeight + 'px;';

            // Полоска-хваталка сверху консоли — перетаскиванием вверх/вниз
            // можно менять её высоту (как перетаскиваемый bottom sheet).
            // position:absolute внутри position:fixed родителя не скроллится
            // вместе с содержимым лога — остаётся приклеенной к верхнему краю.
            var handle = document.createElement('div');
            handle.id = 'debugConsoleHandle';
            handle.style.cssText = 'position:absolute;top:0;left:0;right:0;height:16px;cursor:ns-resize;' +
                'display:flex;align-items:center;justify-content:center;touch-action:none;' +
                'background:rgba(0,0,0,0.92);z-index:1;';
            handle.innerHTML = '<div style="width:36px;height:4px;border-radius:2px;background:#0f0;opacity:0.6;"></div>';

            var toggle = document.createElement('button');
            toggle.textContent = '🐞';
            toggle.style.cssText = 'position:fixed;right:8px;z-index:1000000;width:36px;' +
                'height:36px;border-radius:50%;background:#222;color:#0f0;border:1px solid #0f0;font-size:16px;' +
                'touch-action:none;';

            // Кнопки быстрой прокрутки лога вверх/вниз — видны только пока консоль открыта.
            var btnStyle = 'position:fixed;right:8px;z-index:1000001;width:36px;height:36px;border-radius:50%;' +
                'background:#222;color:#0f0;border:1px solid #0f0;font-size:16px;display:none;';
            var btnTop = document.createElement('button');
            btnTop.textContent = '⬆';
            btnTop.style.cssText = btnStyle;
            btnTop.onclick = function () { box.scrollTop = 0; };
            var btnBottom = document.createElement('button');
            btnBottom.textContent = '⬇';
            btnBottom.style.cssText = btnStyle;
            btnBottom.onclick = function () { box.scrollTop = box.scrollHeight; };

            // Высота консоли определяет, где над ней висит кнопка-переключатель
            // и кнопки прокрутки — пересчитываем при каждом изменении высоты.
            // Все три кнопки размещаются НАД консолью (bottom = consoleHeight + 8),
            // в один ряд, чтобы консоль их не перекрывала.
            function layoutForHeight() {
                box.style.height = consoleHeight + 'px';
                btnTop.style.bottom = (consoleHeight + 8) + 'px';
                btnTop.style.right = '52px';
                btnBottom.style.bottom = (consoleHeight + 8) + 'px';
                btnBottom.style.right = '96px';
                if (!toggleHasCustomPos) {
                    toggle.style.left = 'auto';
                    toggle.style.top = 'auto';
                    toggle.style.bottom = (consoleHeight + 8) + 'px';
                }
            }

            function saveHeight() {
                try { localStorage.setItem('maxclient_debug_height', String(consoleHeight)); } catch (e) { }
            }

            // --- Перетаскивание хваталки: изменение высоты консоли ---
            (function () {
                var dragging = false;
                var startY = 0;
                var startHeight = 0;
                handle.addEventListener('pointerdown', function (e) {
                    dragging = true;
                    startY = e.clientY;
                    startHeight = consoleHeight;
                    try { handle.setPointerCapture(e.pointerId); } catch (err) { }
                });
                handle.addEventListener('pointermove', function (e) {
                    if (!dragging) return;
                    var dy = e.clientY - startY;
                    var maxHeight = Math.round(window.innerHeight * MAX_HEIGHT_RATIO);
                    consoleHeight = Math.max(MIN_HEIGHT, Math.min(startHeight - dy, maxHeight));
                    layoutForHeight();
                });
                function endHandleDrag() {
                    if (!dragging) return;
                    dragging = false;
                    saveHeight();
                }
                handle.addEventListener('pointerup', endHandleDrag);
                handle.addEventListener('pointercancel', endHandleDrag);
            })();

            // --- Перетаскивание кнопки 🐞 в любое место экрана (как иконка mod-меню) ---
            var toggleHasCustomPos = false;
            (function () {
                var DRAG_THRESHOLD = 6;
                var dragging = false;
                var moved = false;
                var startX = 0, startY = 0;
                var startRight = 0, startBottom = 0;

                try {
                    var saved = JSON.parse(localStorage.getItem('maxclient_debug_btn_pos') || 'null');
                    if (saved && typeof saved.right === 'number' && typeof saved.bottom === 'number') {
                        toggleHasCustomPos = true;
                        applyTogglePos(saved.right, saved.bottom);
                    }
                } catch (e) { }

                function applyTogglePos(right, bottom) {
                    var maxRight = window.innerWidth - 36 - 4;
                    var maxBottom = window.innerHeight - 36 - 4;
                    right = Math.max(4, Math.min(right, maxRight));
                    bottom = Math.max(4, Math.min(bottom, maxBottom));
                    toggle.style.left = 'auto';
                    toggle.style.top = 'auto';
                    toggle.style.right = right + 'px';
                    toggle.style.bottom = bottom + 'px';
                    return { right: right, bottom: bottom };
                }

                toggle.addEventListener('pointerdown', function (e) {
                    dragging = true;
                    moved = false;
                    startX = e.clientX;
                    startY = e.clientY;
                    var rect = toggle.getBoundingClientRect();
                    startRight = window.innerWidth - rect.right;
                    startBottom = window.innerHeight - rect.bottom;
                    try { toggle.setPointerCapture(e.pointerId); } catch (err) { }
                });

                toggle.addEventListener('pointermove', function (e) {
                    if (!dragging) return;
                    var dx = e.clientX - startX;
                    var dy = e.clientY - startY;
                    if (!moved && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) moved = true;
                    if (moved) {
                        toggleHasCustomPos = true;
                        applyTogglePos(startRight - dx, startBottom - dy);
                    }
                });

                function endToggleDrag(e) {
                    if (!dragging) return;
                    dragging = false;
                    if (moved) {
                        var rect = toggle.getBoundingClientRect();
                        var pos = { right: window.innerWidth - rect.right, bottom: window.innerHeight - rect.bottom };
                        try { localStorage.setItem('maxclient_debug_btn_pos', JSON.stringify(pos)); } catch (err) { }
                        // Не даём этому же жесту сработать как клик (открыть/закрыть консоль).
                        var suppressClick = function (ev) { ev.stopPropagation(); ev.preventDefault(); };
                        toggle.addEventListener('click', suppressClick, { capture: true, once: true });
                    }
                }
                toggle.addEventListener('pointerup', endToggleDrag);
                toggle.addEventListener('pointercancel', endToggleDrag);
                // В коде инициализации дебаг-консоли:
toggle.style.cssText = 'position:fixed;right:8px;z-index:10000000;width:36px;' +
    'height:36px;border-radius:50%;background:#222;color:#0f0;border:1px solid #0f0;font-size:16px;' +
    'touch-action:none;cursor:pointer;';
            })();

            toggle.onclick = function () {
                var show = box.style.display === 'none';
                box.style.display = show ? 'block' : 'none';
                btnTop.style.display = show ? 'block' : 'none';
                btnBottom.style.display = show ? 'block' : 'none';
                if (show) box.scrollTop = box.scrollHeight;
            };

            function addLine(text, color) {
                // Автопрокрутка вниз только если пользователь и так уже был у низа —
                // иначе он не смог бы пролистать лог вверх руками во время потока
                // новых сообщений (как это нормально работает на странице/в чатах).
                var wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
                var line = document.createElement('div');
                if (color) line.style.color = color;
                line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text;
                box.appendChild(line);
                while (box.children.length > maxLines) box.removeChild(box.firstChild);
                if (wasAtBottom) box.scrollTop = box.scrollHeight;
            }

            function toText(a) {
                try {
                    if (typeof a === 'string') return a;
                    if (a instanceof Error) return a.stack || a.message;
                    return JSON.stringify(a);
                } catch (e) { return String(a); }
            }

            ['log', 'info', 'warn', 'error'].forEach(function (level) {
                var orig = console[level];
                console[level] = function () {
                    var args = Array.prototype.slice.call(arguments).map(toText).join(' ');
                    var prefix = level === 'error' ? '❌ ' : (level === 'warn' ? '⚠️ ' : '');
                    var color = level === 'error' ? '#f66' : (level === 'warn' ? '#fd6' : '#0f0');
                    addLine(prefix + args, color);
                    orig.apply(console, arguments);
                };
            });

            // Ловим в т.ч. ошибки загрузки ресурсов (сорванные <script src>/<link>/<img>) —
            // именно это нужно для диагностики офлайн-запуска.
            window.addEventListener('error', function (e) {
                var t = e.target;
                if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK' || t.tagName === 'IMG')) {
                    addLine('❌ Не удалось загрузить ресурс: ' + (t.src || t.href), '#f66');
                } else {
                    addLine('❌ ' + (e.message || 'JS error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''), '#f66');
                }
            }, true);

            window.addEventListener('unhandledrejection', function (e) {
                addLine('❌ Unhandled promise rejection: ' + toText(e.reason), '#f66');
            });

            box.appendChild(handle);
            document.body.appendChild(box);
            document.body.appendChild(toggle);
            document.body.appendChild(btnTop);
            document.body.appendChild(btnBottom);
            box.addEventListener('touchmove', function (e) { e.stopPropagation(); }, { passive: true });
            layoutForHeight();
            addLine('Debug-консоль запущена');
        })();
    </script>

    <script>
        // Проверяет, может ли текущий пользователь писать в данный чат
        function canWriteToChat(chat) {
            if (!chat || !selfId) return false;

            // Если это диалог — проверяем тип контакта (бот/канал)
            if (chat.type === 'DIALOG') {
                const otherId = otherParticipantId(chat);
                const contact = contactsById[otherId];

                // Боты обычно принимают сообщения всегда (если они публичные),
                // а вот каналы часто имеют флаг запрета отправки.
                if (contact && Array.isArray(contact.options)) {
                    // Типичные флаги: CHANNEL, BROADCAST, NO_MESSAGES_FOR_SUBSCRIBERS
                    if (contact.options.includes('CHANNEL') || contact.options.includes('BROADCAST')) {

                        }
                    } catch (e) {
                        console.warn('Failed to cache emoji:', emoji, e);
                    }
                }
                localStorage.setItem(EMOJI_CACHE_KEY, JSON.stringify(newCache));

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    // reader.result выглядит как "data:<mime>;base64,<data>" —
                    // мосту на Android нужна только часть после запятой.
                    const commaIdx = reader.result.indexOf(',');
                    resolve(commaIdx >= 0 ? reader.result.slice(commaIdx + 1) : reader.result);
                };
                reader.onerror = () => reject(reader.error || new Error('FileReader error'));
                reader.readAsDataURL(blob);
            });
        }

        async function downloadBlobUrl(url, filename) {
            try {
                const res = await fetch(url);
                const blob = await res.blob();
                const mimeType = blob.type || 'application/octet-stream';

                // Внутри Android-приложения (system WebView) обычный
                // `<a download>` с blob:-ссылкой ничего не сохраняет — там
                // нет ни DownloadListener (он не срабатывает для blob:), ни
                // доступа к MediaStore напрямую из страницы. Поэтому раньше
                // здесь просто показывалось "успешно скачан", хотя файла
                // нигде не было. Если есть нативный мост — сохраняем через
                // него (запись в MediaStore/галерею), иначе (обычный браузер,
                // desktop_launcher.py) — старый способ через <a download>.
                if (window.AndroidDownload && window.AndroidDownload.isAvailable()) {
                    const base64 = await blobToBase64(blob);
                    const result = window.AndroidDownload.saveFile(base64, filename, mimeType);
                    if (result === 'true') {
                        log(`✅ «${filename}» сохранён в галерею`, 'success');
                    } else {
                        log('❌ Ошибка сохранения: ' + (result || 'неизвестная ошибка'), 'error');
                    }
                    return;
                }

                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                log(`✅ «${filename}» скачан`, 'success');
            } catch (e) {
                log('❌ Ошибка скачивания: ' + e.message, 'error');
            }
        }

            const box = document.getElementById(uid + '_transcript');
            if (!box) return;
            if (btn) { btn.disabled = true; btn.textContent = '…'; }
            box.style.display = 'block';
            box.style.color = '#888';
            box.textContent = 'Распознаю…';
            console.debug('[transcribe] запрос распознавания:', { messageId, url: rawUrl, force: !!force });
            try {
                const resp = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messageId, url: rawUrl, force: !!force })
                });
                let data;
                const rawText = await resp.text();
                try {
                    data = JSON.parse(rawText);
                } catch (parseErr) {
                    console.error('[transcribe] ответ сервера не JSON, status=', resp.status, 'body=', rawText);
                    box.style.color = '#c00';
                    box.textContent = '⚠️ Сервер вернул не JSON (status ' + resp.status + ')';
                    return;
                }
                console.debug('[transcribe] ответ /api/transcribe:', { status: resp.status, ok: resp.ok, data });
                if (!resp.ok || data.error) {
                    console.error('[transcribe] ошибка распознавания:', data.error || ('HTTP ' + resp.status), 'полный ответ:', JSON.stringify(data));
                    box.style.color = '#c00';
                    box.textContent = '⚠️ ' + (data.error || 'Ошибка распознавания');
                    if (data.diag) {
                        console.error('[transcribe diag]', JSON.stringify(data.diag));
                        box.textContent += '\n\n' + JSON.stringify(data.diag, null, 1);
                    }
                } else if (!data.text || !data.text.trim()) {
                    console.warn('[transcribe] распознавание вернуло пустой текст. Полный ответ:', JSON.stringify(data));
                    box.style.color = '#888';
                    box.textContent = '(пусто — речь не распознана)';
                } else {
                    box.style.color = '';
                    box.textContent = data.text;
                }
            } catch (e) {
                console.error('[transcribe] сетевая/JS ошибка при запросе распознавания:', e);
                box.style.color = '#c00';
                box.textContent = '⚠️ ' + e.message;
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = '📝'; }
            }
        }

        function createAudioPlayer(messageId, attach) {
            const src = resolveMediaSrc(attach);
            const rawUrl = attach.baseUrl || attach.fileUrl || attach.url || '';
            const totalLabel = attach.duration ? formatTime(Math.round(attach.duration / 1000)) : '';
            if (!src) {
                return `<div class="msg-file" style="color:#888;">🎤 Голосовое сообщение ${totalLabel ? '(' + totalLabel + ')' : ''} — недоступно</div>`;
            }
            const uid = 'voiceplayer_' + (++audioPlayerSeq);
            const transcribeBtn = rawUrl ? `
            <button type="button" id="${uid}_t_btn" title="Расшифровать (локально)"
                    onclick="transcribeVoiceMessage('${uid}', '${messageId}', '${rawUrl.replace(/'/g, "\\'")}', false)"
                    style="flex:0 0 auto;border:none;background:none;cursor:pointer;font-size:14px;padding:2px 4px;">📝</button>` : '';
            // <audio> без атрибута controls — интерфейс полностью свой,
            // элемент используется только как источник звука/событий.
            return `
          <div class="msg-audio-player" id="${uid}" data-duration-ms="${attach.duration || 0}"
               style="display:flex;flex-direction:column;gap:4px;min-width:220px;max-width:280px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <audio preload="none" src="${src}" style="display:none;"></audio>
            <button type="button" class="voice-play-btn" onclick="toggleAudioPlayer('${uid}')"
                style="flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:none;background:#2196f3;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;">▶</button>
            <div class="voice-progress-track" onclick="seekAudioPlayer(event, '${uid}')"
                style="flex:1 1 auto;height:4px;border-radius:2px;background:rgba(0,0,0,0.15);position:relative;cursor:pointer;">
              <div class="voice-progress-fill" style="position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:2px;background:#2196f3;"></div>
            </div>
            <span class="voice-time-label" style="flex:0 0 auto;font-size:11px;color:#888;min-width:32px;text-align:right;">${totalLabel || '0:00'}</span>
            ${transcribeBtn}
          </div>
          <div id="${uid}_transcript" style="display:none;font-size:12.5px;line-height:1.4;padding:4px 2px 0;white-space:pre-wrap;"></div>
          </div>`;
        }

        function toggleAudioPlayer(uid) {
            const root = document.getElementById(uid);
            if (!root) return;
            const audio = root.querySelector('audio');
            const btn = root.querySelector('.voice-play-btn');
            if (!audio) return;
            if (audio.paused) {
                // На всякий случай ставим на паузу остальные плееры — как в
                // большинстве мессенджеров, одновременно играет одно голосовое.
                document.querySelectorAll('.msg-audio-player audio').forEach(a => {
                    if (a !== audio && !a.paused) {
                        a.pause();
                        const otherRoot = a.closest('.msg-audio-player');
                        const otherBtn = otherRoot?.querySelector('.voice-play-btn');
                        if (otherBtn) otherBtn.textContent = '▶';
                    }
                });
                audio.play().catch(() => { });
                btn.textContent = '⏸';
            } else {
                audio.pause();
                btn.textContent = '▶';
            }
        }

        function seekAudioPlayer(e, uid) {
            const root = document.getElementById(uid);
            if (!root) return;
            const audio = root.querySelector('audio');
            const track = root.querySelector('.voice-progress-track');
            if (!audio || !track || !audio.duration) return;
            const rect = track.getBoundingClientRect();
            const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
            audio.currentTime = ratio * audio.duration;
        }

        document.addEventListener('timeupdate', (e) => {
            if (!(e.target instanceof HTMLAudioElement)) return;
            const root = e.target.closest('.msg-audio-player');
            if (!root) return;
            const fill = root.querySelector('.voice-progress-fill');
            const label = root.querySelector('.voice-time-label');
            const dur = e.target.duration || (Number(root.dataset.durationMs) / 1000) || 0;
            if (fill && dur) fill.style.width = Math.min(100, (e.target.currentTime / dur) * 100) + '%';
            if (label) label.textContent = formatTime(Math.round(e.target.currentTime));
        }, true);

        document.addEventListener('ended', (e) => {
            if (!(e.target instanceof HTMLAudioElement)) return;
            const root = e.target.closest('.msg-audio-player');
            if (!root) return;
            const btn = root.querySelector('.voice-play-btn');
            const fill = root.querySelector('.voice-progress-fill');
            const label = root.querySelector('.voice-time-label');
            if (btn) btn.textContent = '▶';
            if (fill) fill.style.width = '0%';
            if (label) label.textContent = formatTime(Math.round((Number(root.dataset.durationMs) || 0) / 1000));
        }, true);

        // Видео-кружок (video note, videoType === 1 / isNote в Komet).
        // ВАЖНО: в отличие от AUDIO/PHOTO, у VIDEO-вложений (обычных и
        // кружочков) сервер не кладёт готовый playable URL в baseUrl/url —
        // там только token+videoId, а реальную ссылку нужно резолвить
        // отдельным запросом (opcode 83, см. /api/video-sources) — так же,
        // как это уже делает обычное видео в createVideoPreview/
        // inlineVideoTap. Раньше здесь ошибочно ждали attach.baseUrl
        // напрямую — отсюда и "недоступно" на каждый присланный кружок.
        // Резолвим по клику (лениво, чтобы не грузить видео заранее).
        function createVideoNotePlayer(messageId, chatId, attach) {
            const size = 200;
            const durationLabel = attach.duration ? formatTime(Math.round(attach.duration / 1000)) : '';
            const token = attach.token || attach.videoToken || '';
            const videoId = attach.videoId || 0;
            const uid = 'note_' + Math.random().toString(36).slice(2, 9);
            if (!token || !videoId) {
                return `<div class="msg-file" style="color:#888;">⏺️ Видео-кружок ${durationLabel ? '(' + durationLabel + ')' : ''} — недоступно</div>`;
            }
            // Без постера: у кружочков "thumbnail" в реальном ответе сервера
            // указывает на тот же видео-эндпоинт (v.oneme.ru/videoMsg?...),
            // а не на статичную картинку — /img через него отдаёт не image,
            // грузить это как <img> нельзя (см. Komet: video_note_bubble.dart
            // тоже не показывает постер, только play-заглушку до резолва).
            return `
          <div class="msg-video-note" id="${uid}"
               data-msg-id="${messageId}" data-chat-id="${chatId}" data-token="${token}" data-video-id="${videoId}"
               style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;position:relative;cursor:pointer;background:#000;"
               onclick="playVideoNoteInline('${uid}')">
            <div class="video-note-placeholder" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1a1a;color:#666;font-size:32px;">⏺️</div>
            <div class="video-note-play-overlay"
                 style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.25);color:#fff;font-size:28px;">▶</div>
            ${durationLabel ? `<span style="position:absolute;bottom:6px;right:10px;color:#fff;font-size:11px;text-shadow:0 0 4px rgba(0,0,0,0.8);">${durationLabel}</span>` : ''}
          </div>`;
        }

        async function playVideoNoteInline(uid) {
            const container = document.getElementById(uid);
            if (!container) return;
            const overlay = container.querySelector('.video-note-play-overlay');
            const existingVideo = container.querySelector('video');
            if (existingVideo) {
                if (existingVideo.paused) {
                    existingVideo.play().catch(() => { });
                    if (overlay) overlay.style.display = 'none';
                } else {
                    existingVideo.pause();
                    if (overlay) overlay.style.display = 'flex';
                }
                return;
            }
            const messageId = container.dataset.msgId;
            const chatId = container.dataset.chatId;
            const token = container.dataset.token;
            const videoId = container.dataset.videoId;
            if (!token || !videoId) { log('❌ Нет данных для видео-кружка', 'error'); return; }
            container.classList.add('loading');
            try {
                const res = await fetch('/api/video-sources', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messageId, chatId, token, videoId }),
                });
                const data = await res.json();
                const sources = data.sources || {};
                const best = sources['720p'] || sources['480p'] || Object.values(sources)[0];
                container.classList.remove('loading');
                if (!best) {
                    log('❌ Не удалось получить видео-кружок' + (data.error ? ` (${data.error})` : ''), 'error');
                    return;
                }
                const v = document.createElement('video');
                v.playsInline = true;
                v.muted = false;
                v.autoplay = true;
                v.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
                v.src = '/video?url=' + encodeURIComponent(best);
                v.onended = () => { if (overlay) overlay.style.display = 'flex'; };
                const existingImg = container.querySelector('img, div[style*="background:#1a1a1a"]');
                if (existingImg) existingImg.remove();
                container.insertBefore(v, container.firstChild);
                if (overlay) overlay.style.display = 'none';
            } catch (err) {
                container.classList.remove('loading');
                log('❌ Ошибка загрузки видео-кружка: ' + err, 'error');
            }
        }

        function createVideoPreview(messageId, chatId, attach) {
            const poster = attach.thumbnail ? '/img?url=' + encodeURIComponent(attach.thumbnail) :
                attach.previewData ? hexPreviewToDataUrl(attach.previewData) : null;
            const duration = attach.duration ? formatTime(Math.round(attach.duration / 1000)) : '';
            const token = attach.token || attach.videoToken || '';
            const videoId = attach.videoId || 0;
            const uid = 'vid_' + Math.random().toString(36).slice(2, 9);
            let html = `
            <div class="msg-video-container" id="${uid}"
                 data-msg-id="${messageId}" data-chat-id="${chatId}" data-token="${token}" data-video-id="${videoId}"
                 onclick="inlineVideoTap('${uid}')">
                <div class="msg-video-poster">
        `;
            if (poster) {
                html += `<img src="${poster}" alt="Превью видео" loading="lazy" onerror="this.style.display='none'">`;
            } else {
                html +=
                    `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1a1a;color:#666;font-size:40px;">🎬</div>`;
            }
            html += `
                    <div class="play-icon">▶</div>
                    ${duration ? `<div class="duration-badge">${duration}</div>` : ''}
                </div>
                <div class="inline-top-actions" onclick="event.stopPropagation();">
                    <button class="inline-icon-btn" onclick="expandInlineVideo('${uid}')" aria-label="Развернуть на весь экран">⛶</button>
                    <button class="inline-icon-btn inline-mute-btn" onclick="toggleInlineMute('${uid}')" aria-label="Звук">🔇</button>
                </div>
            </div>
