<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX Client</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            background: #f5f5f5;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #007bff;
        }

        .section {
            margin: 16px 0;
            padding: 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #555;
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .input-group input {
            flex: 1;
            min-width: 150px;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .input-group button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        .input-group button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .input-group button.success {
            background: #28a745;
        }

        .input-group button.warning {
            background: #ffc107;
            color: #000;
        }

        .input-group button.danger {
            background: #dc3545;
        }

        .status {
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        #log {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            max-height: 240px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #d4d4d4;
            line-height: 1.6;
        }

        .log-entry.info {
            color: #9cdcfe;
        }

        .log-entry.success {
            color: #6a9955;
        }

        .log-entry.error {
            color: #f48771;
        }

        .log-entry .time {
            color: #6a6a6a;
            margin-right: 8px;
        }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.online {
            background: #28a745;
            color: white;
        }

        .badge.offline {
            background: #dc3545;
            color: white;
        }

        .badge.auth-error {
            background: #ffc107;
            color: #000;
        }

        .hidden {
            display: none !important;
        }

        .chat-item {
            display: flex;
            gap: 12px;
            padding: 10px 4px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-item:hover {
            background: #f8f9fa;
        }

        .chat-item:last-child {
            border-bottom: none;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #666;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-weight: 600;
            font-size: 14px;
        }

        .chat-preview {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-meta {
            font-size: 11px;
            color: #aaa;
            text-align: right;
            flex-shrink: 0;
        }

        .unread {
            background: #007bff;
            color: white;
            border-radius: 10px;
            font-size: 11px;
            padding: 1px 6px;
            margin-top: 4px;
            display: inline-block;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .chat-header .chat-name-clickable {
            cursor: pointer;
            border-radius: 8px;
            padding: 2px 6px;
            transition: background 0.2s;
        }

        .chat-header .chat-name-clickable:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .chat-header .chat-avatar {
            width: 32px;
            height: 32px;
        }

        .chat-header .chat-info-block {
            flex: 1;
            min-width: 0;
        }

        .chat-header .chat-id-label {
            font-size: 11px;
            color: #999;
            white-space: nowrap;
            margin-left: 4px;
        }

        #messagesList {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 50vh;
            overflow-y: auto;
            padding: 4px;
            margin-bottom: 10px;
        }

        .msg-bubble {
            position: relative;
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 14px;
            background: #f0f0f0;
            align-self: flex-start;
        }

        .msg-bubble.own {
            background: #d1e7ff;
            align-self: flex-end;
        }

        .msg-time {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
            text-align: right;
        }

        .msg-img {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 4px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .msg-img:hover {
            opacity: 0.85;
        }

        .msg-attach {
            margin-bottom: 6px;
        }

        .msg-video-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            max-width: 350px;
            min-width: 200px;
            margin: 4px 0;
            background: #000;
            cursor: pointer;
        }

        .msg-video-poster {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #1a1a1a;
            cursor: pointer;
        }

        .msg-video-poster img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .msg-video-poster .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            transition: transform 0.2s, background 0.2s;
        }

        .msg-video-poster:hover .play-icon {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(0, 0, 0, 0.4);
        }

        .msg-video-poster .duration-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .inline-video-el {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .inline-top-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            z-index: 3;
        }

        .inline-bottom-actions {
            position: absolute;
            bottom: 8px;
            left: 8px;
            z-index: 3;
        }

        .inline-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            border: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .msg-video-container.loading .msg-video-poster {
            opacity: 0.5;
        }

        .video-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            z-index: 10000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            align-items: center;
            justify-content: center;
        }

        .video-modal.active {
            display: flex;
        }

        .video-modal .video-wrapper {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            width: auto;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-modal video {
            max-width: 90vw;
            max-height: 85vh;
            width: auto;
            height: auto;
            object-fit: contain;
            background: #000;
            display: block;
        }

        .video-modal .close-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: white;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .video-modal .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 24px 24px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85) 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10001;
        }

        .video-modal:hover .player-controls,
        .video-modal.show-controls .player-controls {
            opacity: 1;
        }

        .player-controls .top-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .player-controls .time {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 500;
            min-width: 36px;
            font-variant-numeric: tabular-nums;
        }

        .player-controls .time-right {
            text-align: right;
            min-width: 36px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            min-height: 20px;
            display: flex;
            align-items: center;
        }

        .progress-bar .progress-fill {
            height: 4px;
            background: #4da3ff;
            border-radius: 2px;
            width: 0%;
            position: relative;
            transition: width 0.1s linear;
        }

        .progress-bar .progress-fill .progress-dot {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: #4da3ff;
            border-radius: 50%;
            border: 2px solid white;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-bar:hover .progress-fill .progress-dot {
            opacity: 1;
        }

        .progress-bar .progress-buffer {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            width: 0%;
        }

        .controls-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-buttons button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            font-size: 20px;
        }

        .controls-buttons button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .controls-buttons button.primary {
            width: 48px;
            height: 48px;
            font-size: 28px;
            background: rgba(255, 255, 255, 0.08);
        }

        .controls-buttons button.primary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .msg-text {
            margin-top: 4px;
            word-wrap: break-word;
        }

        .msg-file {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .msg-file a {
            color: #007bff;
            text-decoration: none;
        }

        .msg-file a:hover {
            text-decoration: underline;
        }

        .settings-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }

        .settings-row input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }

        .verified-badge {
            color: #4da3ff;
            font-size: 16px;
            font-weight: bold;
            margin-left: 3px;
        }

        .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #4caf50;
            border: 2px solid white;
        }

        .msg-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
            position: relative;
        }

        .reaction-badge {
            background: rgba(0, 0, 0, 0.06);
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 12px;
            cursor: pointer;
        }

        .reaction-badge.mine {
            background: #007bff;
            color: white;
        }

        .msg-status {
            font-size: 12px;
            margin-left: 3px;
        }

        .msg-status.read {
            color: #4fc3f7;
        }

        .msg-status.sent {
            color: #999;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .video-modal.active {
            animation: fadeIn 0.2s ease;
        }

        .video-modal video::-webkit-media-controls {
            display: none !important;
        }

        .video-modal video::-webkit-media-controls-enclosure {
            display: none !important;
        }

        .media-bottom-bar {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.92);
            border-radius: 30px;
            display: flex;
            align-items: center;
            z-index: 2100;
            overflow: hidden;
        }

        .media-bottom-bar button {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            padding: 14px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .media-bottom-bar button+button {
            border-left: 1px solid rgba(255, 255, 255, 0.2);
        }

        .media-bottom-bar button:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .media-viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .media-viewer.active {
            display: flex;
        }

        .media-viewer img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
        }

        .media-viewer .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            z-index: 2101;
        }

        #passwordSection {
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 8px;
            border: 1px solid #ffc107;
        }

        #passwordSection.hidden {
            display: none;
        }

        .password-hint {
            font-size: 12px;
            color: #856404;
            margin-bottom: 8px;
        }

        .password-email {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }

        .icon-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .volume-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-group button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        .center-play {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            font-size: 28px;
            padding: 8px;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .center-play:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== SETTINGS MODAL ===== */
        .settings-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 30000;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }

        .settings-modal-overlay.active {
            display: flex;
        }

        .settings-modal {
            background: #f5f5f5;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 20px 20px 0 0;
            padding: 20px 20px 30px;
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .settings-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }

        .settings-modal-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #222;
        }

        .settings-modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e8e8e8;
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            transition: background 0.2s;
        }

        .settings-modal-close:hover {
            background: #d5d5d5;
        }

        /* ----- MENU SYSTEM ----- */
        .settings-menu {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 4px 0 8px;
            flex-shrink: 0;
        }

        .settings-menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            background: transparent;
            border: none;
            width: 100%;
            font-size: 15px;
            font-weight: 500;
            color: #222;
            text-align: left;
        }

        .settings-menu-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .settings-menu-item:active {
            background: rgba(0, 0, 0, 0.08);
        }

        .settings-menu-item .icon {
            font-size: 20px;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
        }

        .settings-menu-item .label {
            flex: 1;
        }

        .settings-menu-item .arrow {
            color: #999;
            font-size: 16px;
        }

        .settings-menu-item.danger {
            color: #dc3545;
        }

        .settings-menu-item.danger:hover {
            background: rgba(220, 53, 69, 0.08);
        }

        .settings-menu-item.danger:active {
            background: rgba(220, 53, 69, 0.15);
        }

        .settings-menu-divider {
            border: none;
            border-top: 1px solid #e8e8e8;
            margin: 6px 0;
        }

        /* Панель содержимого меню */
        .settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .settings-content-page {
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .settings-content-page.active {
            display: block;
        }

        .settings-content-page .settings-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .settings-content-page .settings-row input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        .settings-content-page .settings-row input:focus {
            border-color: #007bff;
        }

        .settings-empty {
            color: #999;
            text-align: center;
            padding: 24px 0;
            font-size: 14px;
        }

        .settings-content-footer {

        /* Кнопка шестерёнки в заголовке */

        /* Бейдж в меню */
        .settings-menu-badge {

        .settings-logout-btn {

        .settings-logout-btn:hover {

        }

        .settings-logout-btn:active {
            opacity: 0.8;
        }

        /* ===== CHAT PROFILE MODAL (центр экрана) ===== */
        .chat-profile-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 30050;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .chat-profile-overlay.active {
            display: flex;
        }

        .chat-profile-modal {
            background: #f5f5f5;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 24px 24px 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
            animation: scaleIn 0.25s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .chat-profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8e8e8;
        }

        .chat-profile-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #222;
        }

        .chat-profile-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e8e8e8;
            border: none;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            transition: background 0.2s;
        }

        .chat-profile-close:hover {
            background: #d5d5d5;
        }

        .chat-profile-avatar {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0 12px;
        }

        .chat-profile-avatar .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #666;
            overflow: hidden;
            position: relative;
        }

        .chat-profile-avatar .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-profile-avatar .name {
            font-size: 18px;
            font-weight: 600;
            margin-top: 10px;
            color: #222;
        }

        .chat-profile-avatar .sub {
            font-size: 13px;

        .chat-profile-options {

        .chat-profile-option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            border: none;
            background: transparent;
            width: 100%;
            font-size: 15px;
            color: #222;
            text-align: left;

        .chat-profile-option:hover {

        }

        .chat-profile-option .opt-icon {
            font-size: 20px;
            width: 32px;
            text-align: center;
            flex-shrink: 0;

        .chat-profile-option .opt-label {

        /* Красивые toggle-переключатели */
        .toggle-switch {
            width: 44px;
            height: 26px;
            background: #ccc;
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: background 0.25s;
            flex-shrink: 0;
        }

        .toggle-switch.active {
            background: #34c759;
        }

        .toggle-switch .toggle-knob {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.25s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);

        /* Красная кнопка в профиле чата */

        }

        .chat-profile-danger:hover {
            background: rgba(220, 53, 69, 0.08);
        }

        .chat-profile-danger:active {
            background: rgba(220, 53, 69, 0.15);
        }

        /* --- Клавиатура бота (inline_keyboard) --- */
        .msg-keyboard {

        .msg-keyboard-btn {

            padding: 8px 10px;

            background: #fff;

            text-align: center;
            cursor: pointer;

            overflow: hidden;

        .msg-keyboard-btn.link-btn::after {

        /* --- Мини-приложение (bot web app) --- */
        .miniapp-overlay {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 2000;
            display: flex;
            flex-direction: column;
        }

        .miniapp-overlay.hidden {
            display: none;
        }

        .miniapp-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
            background: #f7f7f8;
            flex-shrink: 0;
        }

        .miniapp-header .miniapp-back-btn {
            display: none;
            border: none;
            background: none;
            font-size: 18px;
            cursor: pointer;

        }

        .miniapp-header .miniapp-back-btn.visible {
            display: inline-block;
        }

        .miniapp-header .miniapp-title {
            flex: 1;
            font-weight: 600;
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .miniapp-header .miniapp-close-btn {
            border: none;
            background: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            color: #888;
        }

        .miniapp-iframe {
            flex: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <div class="video-modal" id="videoModal">
        <div class="video-wrapper" onclick="togglePlay()">
            <video id="videoPlayer" playsinline></video>
            <button class="close-btn" onclick="closeVideoModal(event)">✕</button>
            <div class="player-controls" id="playerControls">
                <div class="icon-row">
                    <div class="volume-group">
                        <button onclick="toggleMute()" aria-label="Mute">
                            <span id="muteIcon">🔊</span>
                        </button>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100"
                            oninput="setVolumeFromSlider(this.value)">
                    </div>
                    <button class="center-play" onclick="togglePlay()" aria-label="Play/Pause">
                        <span id="playPauseIcon">⏸</span>
                    </button>
                    <button onclick="toggleFullscreen()" aria-label="Fullscreen">
                        <span>⤢</span>
                    </button>
                </div>
                <div class="top-row">
                    <span class="time" id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar" onclick="seekVideo(event)">
                        <div class="progress-buffer" id="bufferBar"></div>
                        <div class="progress-fill" id="progressFill">
                            <div class="progress-dot"></div>
                        </div>
                    </div>
                    <span class="time time-right" id="totalTime">0:00</span>
                </div>
            </div>
            <div class="media-bottom-bar" id="videoBottomBar">
                <button onclick="jumpToMessageFromViewer()">↗ Перейти к сообщению</button>
                <button onclick="downloadCurrentVideo()">⬇ Скачать видео</button>
            </div>
        </div>
    </div>

    <div class="media-viewer" id="photoViewer">
        <button class="close-btn" onclick="closePhotoViewer()">✕</button>
        <img id="photoViewerImg" src="" alt="Фото">
        <div class="media-bottom-bar">
            <button onclick="jumpToMessageFromViewer()">↗ Перейти к сообщению</button>
            <button onclick="downloadCurrentPhoto()">⬇ Скачать фото</button>
        </div>
    </div>

    <!-- ===== SETTINGS MODAL ===== -->
    <div class="settings-modal-overlay" id="settingsModal">
        <div class="settings-modal">
            <div class="settings-modal-header">
                <h2>⚙️ Настройки</h2>
                <button class="settings-modal-close" onclick="closeSettingsModal()">✕</button>
            </div>
            <div class="settings-menu" id="settingsMenu"></div>
            <hr class="settings-menu-divider">
            <div class="settings-content" id="settingsContent"></div>
        </div>
    </div>

    <!-- ===== CHAT PROFILE MODAL (центр экрана) ===== -->
    <div class="chat-profile-overlay" id="chatProfileModal">
        <div class="chat-profile-modal">
            <div class="chat-profile-header">
                <h3 id="chatProfileTitle">Информация</h3>
                <button class="chat-profile-close" onclick="closeChatProfile()">✕</button>
            </div>
            <div class="chat-profile-avatar">
                <div class="avatar" id="chatProfileAvatar"></div>
                <div class="name" id="chatProfileName"></div>
                <div class="sub" id="chatProfileSub"></div>
            </div>
            <div class="chat-profile-options" id="chatProfileOptions">
                <!-- Опции будут добавлены через JS -->
            </div>
        </div>
    </div>

    <h1>
        MAX Client
        <span id="connectionBadge" class="badge offline" style="float:right;">Offline</span>
        <button class="gear-btn" onclick="openSettingsModal()" style="float:right;margin-right:6px;">⚙️</button>
    </h1>

    <div id="status" class="status info">Подключение...</div>

    <div id="loginSection" class="section">
        <h3>📱 Авторизация</h3>
        <div class="input-group">
            <input type="tel" id="phone" placeholder="Номер телефона" value="+7" inputmode="tel" autocomplete="tel">
            <button id="requestOtp">Отправить код</button>

            <input type="text" id="code" placeholder="Код из SMS" inputmode="numeric" pattern="[0-9]*"
                autocomplete="one-time-code">

        </div>
        <div id="passwordSection" class="hidden">
            <div class="password-email" id="passwordEmail"></div>
            <div class="password-hint" id="passwordHint"></div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Пароль">
                <button id="verifyPassword" class="warning">Войти</button>
            </div>
        </div>
        <div id="authStatus" style="font-size:13px;color:#888;margin-top:4px;"></div>
    </div>

    <div id="chatsSection" class="section hidden">
        <h3>💬 Чаты</h3>
        <div id="chatsList"></div>
    </div>

    <div id="chatDetailSection" class="section hidden">
        <div class="chat-header">
            <button class="back-btn" id="backBtn">←</button>
            <div class="chat-avatar" id="chatDetailAvatar"></div>
            <div class="chat-info-block">
                <div class="chat-name chat-name-clickable" id="chatDetailName" onclick="openChatProfile()"></div>
                <div id="chatDetailStatus" style="font-size:12px;color:#888;"></div>
            </div>
            <span class="chat-id-label" id="chatIdLabel"></span>
        </div>
        <div id="messagesList"></div>
        <div class="input-group" id="composerRow">
            <input type="text" id="messageText" placeholder="Сообщение">
            <button id="sendMessageBtn" class="success">Отправить</button>
        </div>
    </div>

    <div id="miniappOverlay" class="miniapp-overlay hidden">
        <div class="miniapp-header">
            <button class="miniapp-back-btn" id="miniappBackBtn" title="Назад">←</button>
            <div class="miniapp-title" id="miniappTitle">Мини-приложение</div>
            <button class="miniapp-close-btn" id="miniappCloseBtn" title="Закрыть">✕</button>
        </div>
        <iframe class="miniapp-iframe" id="miniappIframe" src="about:blank"
            sandbox="allow-scripts allow-forms allow-popups allow-same-origin allow-modals"></iframe>
    </div>

    <div class="section">
        <h3>📋 Лог</h3>
        <div id="log"></div>
    </div>

    <script>
        // ========================================
        // ПЛЕЕР (сокращён)
        // ========================================
        let currentVideoUrl = null;
        let currentViewerMessageId = null;
        let currentPhotoUrl = null;
        let isPlaying = false;
        let isMuted = false;
        let controlsTimeout = null;
        let isControlsVisible = true;

        const video = document.getElementById('videoPlayer');
        const modal = document.getElementById('videoModal');
        const progressFill = document.getElementById('progressFill');
        const bufferBar = document.getElementById('bufferBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const playPauseIcon = document.getElementById('playPauseIcon');

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function updateProgress() {
            if (!video.duration) return;
            const percent = (video.currentTime / video.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(video.currentTime);
            totalTimeEl.textContent = formatTime(video.duration);
        }

        function updateBuffer() {
            if (!video.buffered || !video.buffered.length) return;
            const bufferedEnd = video.buffered.end(video.buffered.length - 1);
            const percent = (bufferedEnd / video.duration) * 100;
            bufferBar.style.width = percent + '%';
        }

        function togglePlay() {
            if (video.paused) {
                video.play().catch(() => { });
                playPauseIcon.textContent = '⏸';
                isPlaying = true;
            } else {
                video.pause();
                playPauseIcon.textContent = '▶';
                isPlaying = false;
            }
        }

        function toggleMute() {
            video.muted = !video.muted;
            isMuted = video.muted;
            document.getElementById('muteIcon').textContent = isMuted ? '🔇' : '🔊';
            const slider = document.getElementById('volumeSlider');
            if (slider) slider.value = isMuted ? 0 : Math.round((video.volume || 1) * 100);
        }

        function setVolumeFromSlider(value) {
            const v = Number(value) / 100;
            video.volume = v;
            video.muted = v === 0;
            isMuted = video.muted;
            document.getElementById('muteIcon').textContent = video.muted ? '🔇' : (v < 0.5 ? '🔉' : '🔊');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.().catch(() => { });
            } else {
                document.exitFullscreen?.().catch(() => { });
            }
        }

        function seekVideo(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            video.currentTime = x * video.duration;
        }

        function showControls() {
            const controls = document.getElementById('playerControls');
            controls.style.opacity = '1';
            isControlsVisible = true;
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    controls.style.opacity = '0';
                    isControlsVisible = false;
                }
            }, 3000);
        }

        function hideControls() {
            if (isPlaying) {
                document.getElementById('playerControls').style.opacity = '0';
                isControlsVisible = false;
            }
        }

        video.addEventListener('timeupdate', updateProgress);
        video.addEventListener('progress', updateBuffer);
        video.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(video.duration);
            updateProgress();
        });
        video.addEventListener('play', () => {
            playPauseIcon.textContent = '⏸';
            isPlaying = true;
            showControls();
        });
        video.addEventListener('pause', () => {
            playPauseIcon.textContent = '▶';
            isPlaying = false;
            showControls();
        });
        video.addEventListener('click', togglePlay);

        modal.addEventListener('mousemove', showControls);
        modal.addEventListener('touchstart', showControls);

        document.querySelector('.video-wrapper').addEventListener('click', (e) => {
            if (e.target === e.currentTarget || e.target.tagName === 'VIDEO') {
                if (isControlsVisible) {
                    hideControls();
                } else {
                    showControls();
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return;
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
            if (e.key === 'Escape') {
                closeVideoModal();
            }
            if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
            if (e.key === 'm' || e.key === 'M') {
                toggleMute();
            }
        });

        async function inlineVideoTap(uid) {
            const container = document.getElementById(uid);
            if (!container) return;
            const existingVideo = container.querySelector('video');
            if (existingVideo) {
                existingVideo.paused ? existingVideo.play() : existingVideo.pause();
                return;
            }
            const messageId = container.dataset.msgId;
            const chatId = container.dataset.chatId;
            const token = container.dataset.token;
            const videoId = container.dataset.videoId;
            if (!token || !videoId) { log('❌ Нет данных для видео', 'error'); return; }
            container.classList.add('loading');
            try {
                const res = await fetch('/api/video-sources', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messageId, chatId, token, videoId }),
                });
                const data = await res.json();
                const sources = data.sources || {};
                const best = sources['720p'] || sources['480p'] || Object.values(sources)[0];
                if (!best) {
                    log('❌ Не удалось получить видео' + (data.error ? ` (${data.error})` : ''), 'error');
                    container.classList.remove('loading');
                    return;
                }
                const posterImg = container.querySelector('.msg-video-poster img');
                const posterSrc = posterImg ? posterImg.src : '';
                const v = document.createElement('video');
                v.className = 'inline-video-el';
                v.loop = true;
                v.muted = true;
                v.playsInline = true;
                v.autoplay = true;
                if (posterSrc) v.poster = posterSrc;
                v.src = '/video?url=' + encodeURIComponent(best);
                container.querySelector('.msg-video-poster').replaceWith(v);
                container.classList.remove('loading');
                const bottom = document.createElement('div');
                bottom.className = 'inline-bottom-actions';
                bottom.onclick = (e) => e.stopPropagation();
                bottom.innerHTML = `<button class="inline-icon-btn play-pause-btn">⏸</button>`;
                container.appendChild(bottom);
                const playPauseBtn = bottom.querySelector('.play-pause-btn');
                playPauseBtn.onclick = () => { v.paused ? v.play() : v.pause(); };
                v.addEventListener('play', () => { playPauseBtn.textContent = '⏸'; });
                v.addEventListener('pause', () => { playPauseBtn.textContent = '▶'; });
                v.play().catch(() => { });
            } catch (e) {
                log('❌ Ошибка видео: ' + e.message, 'error');
                container.classList.remove('loading');
            }
        }

        function toggleInlineMute(uid) {
            const container = document.getElementById(uid);
            const video = container?.querySelector('video');
            const btn = container?.querySelector('.inline-mute-btn');
            if (!video) return;
            video.muted = !video.muted;
            if (btn) btn.textContent = video.muted ? '🔇' : '🔊';
        }

        function expandInlineVideo(uid) {
            const container = document.getElementById(uid);
            if (!container) return;
            openVideoPlayer(container.dataset.msgId, container.dataset.chatId, container.dataset.token, Number(container.dataset
                .videoId));
        }

        async function openVideoPlayer(messageId, chatId, token, videoId) {
            currentViewerMessageId = messageId;
            if (!token || !videoId) { log('❌ Нет данных для видео', 'error'); return; }
            log('⏳ Получаю ссылку на видео...', 'info');
            try {
                const res = await fetch('/api/video-sources', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messageId, chatId, token, videoId }),
                });
                const data = await res.json();
                const sources = data.sources || {};
                const best = sources['1080p'] || sources['720p'] || sources['480p'] || Object.values(sources)[0];
                if (!best) {
                    log('❌ Не удалось получить видео' + (data.error ? ` (${data.error})` : ''), 'error');
                    return;
                }
                video.pause();
                video.removeAttribute('src');
                video.load();
                const videoUrl = '/video?url=' + encodeURIComponent(best);
                currentVideoUrl = videoUrl;
                video.src = videoUrl;
                video.load();
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
                video.play().catch(() => { log('ℹ️ Нажмите Play для воспроизведения', 'info'); });
                showControls();
                log('✅ Видео загружено', 'success');
            } catch (e) {
                log('❌ Ошибка: ' + e.message, 'error');
            }
        }

                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                log(`✅ «${filename}» скачан`, 'success');

        class SettingsMenu {
            constructor() {
                this.items = [];
                this.pages = {};
                this.currentPage = null;
                this.menuContainer = document.getElementById('settingsMenu');
                this.contentContainer = document.getElementById('settingsContent');
            }

            addItem(options) {
                this.items.push(options);
                if (options.page) {
                    this.pages[options.id] = options.page;
                }
                return this;
            }

            addDivider() {
                this.items.push({ divider: true });
                return this;
            }

            render() {
                this.menuContainer.innerHTML = '';
                this.contentContainer.innerHTML = '';
                let firstPageId = null;
                this.items.forEach((item) => {
                    if (item.divider) {
                        const hr = document.createElement('hr');
                        hr.className = 'settings-menu-divider';
                        this.menuContainer.appendChild(hr);
                        return;
                    }
                    const btn = document.createElement('button');
                    btn.className = 'settings-menu-item';
                    if (item.danger) btn.classList.add('danger');
                    btn.innerHTML = `
                    <span class="icon">${item.icon || '•'}</span>
                    <span class="label">${item.label}</span>
                    ${item.badge ? `<span class="settings-menu-badge">${item.badge}</span>` : ''}
                    <span class="arrow">›</span>
                `;
                    btn.onclick = () => { this.showPage(item.id); };
                    this.menuContainer.appendChild(btn);
                    if (!firstPageId) firstPageId = item.id;
                });
                Object.entries(this.pages).forEach(([id, pageFn]) => {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'settings-content-page';
                    pageDiv.id = 'page-' + id;
                    pageDiv.innerHTML = pageFn();
                    this.contentContainer.appendChild(pageDiv);
                });
                if (firstPageId) {
                    this.showPage(firstPageId);
                }
            }

            showPage(id) {
                document.querySelectorAll('.settings-content-page').forEach(el => {
                    el.classList.remove('active');
                });
                const page = document.getElementById('page-' + id);
                if (page) {
                    page.classList.add('active');
                }
                this.currentPage = id;
                this.menuContainer.querySelectorAll('.settings-menu-item').forEach((btn, index) => {
                    const items = this.items.filter(it => !it.divider);
                    const item = items[index];
                    if (item && item.id === id) {
                        btn.style.background = 'rgba(0,0,0,0.06)';
                    } else {
                        btn.style.background = 'transparent';
                    }
                });
            }

            refreshPage(id) {
                const pageFn = this.pages[id];
                if (!pageFn) return;
                const pageDiv = document.getElementById('page-' + id);
                if (pageDiv) {
                    pageDiv.innerHTML = pageFn();
                }
            }

            refreshAll() {
                Object.keys(this.pages).forEach(id => {
                    this.refreshPage(id);
                });
            }
        }

        function hexPreviewToDataUrl(hex) {
            try {
                const bytes = new Uint8Array(hex.length / 2);
                for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
                let binary = '';
                bytes.forEach(b => binary += String.fromCharCode(b));
                return 'data:image/webp;base64,' + btoa(binary);
            } catch (e) {
                return null;
            }
        }

        function renderChats(payload) {
            selfId = payload.profile?.contact?.id;
            contactsById = {};
            (payload.contacts || []).forEach(c => { contactsById[c.id] = c; });
            if (payload.presence) {
                Object.entries(payload.presence).forEach(([uid, p]) => {
                    presenceById[uid] = { online: p?.status === 1, seen: p?.seen || 0 };
                });

            const chats = (payload.chats || []).slice().sort((a, b) => (b.lastEventTime || 0) - (a.lastEventTime || 0));
