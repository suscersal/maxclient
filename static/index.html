                const langLabel = (lang || '').trim();
                blocks.push(renderCodeBlockHtml(langLabel, trimmedCode));
                return `\u0000CODEBLOCK${blocks.length - 1}\u0000`;
            });
            return { text, blocks };
        }

        function reinsertCodeBlocks(text, blocks) {
            return text.replace(/\u0000CODEBLOCK(\d+)\u0000/g, (m, idx) => blocks[Number(idx)] || '');
        }

        function renderCodeBlockHtml(langLabel, codeHtml) {
            const displayLang = langLabel || 'text';
            return `<div class="msg-code-block">
                <div class="msg-code-header">
                    <span class="msg-code-lang">${escapeHtml(displayLang)}</span>
                    <button type="button" class="msg-code-copy" onclick="copyCodeBlock(this)">📋 Копировать</button>
                </div>
                <pre class="msg-code-pre"><code class="msg-code-content language-${escapeHtml(displayLang)}">${codeHtml}</code></pre>
            </div>`;
        }

        function copyCodeBlock(btn) {
            const block = btn.closest('.msg-code-block');
            const codeEl = block && block.querySelector('code');
            if (!codeEl) return;
            const text = codeEl.textContent;
            const done = () => {
                const original = btn.textContent;
                btn.textContent = '✅ Скопировано';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1500);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(() => {
                    log('❌ Не удалось скопировать код', 'error');
                });
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); done(); } catch (e) { log('❌ Не удалось скопировать код', 'error'); }
                document.body.removeChild(ta);
            }
        }
        async function downloadFileAttach(linkEl) {
            const fileId = linkEl.dataset.fileId;
            const messageId = linkEl.dataset.msgId2;
            const chatId = linkEl.dataset.chatId;
            const fileName = linkEl.querySelector('.file-name')?.textContent || 'file';

            const originalHtml = linkEl.innerHTML;
            linkEl.innerHTML = '<span class="file-name">⏳ Получаю ссылку...</span>';

            try {
                const res = await fetch('/api/file-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileId, messageId, chatId })
                });
                const data = await res.json();
                if (!res.ok || !data.url) {
                    log('❌ Не удалось получить ссылку на файл: ' + (data.error || res.status), 'error');
                    linkEl.innerHTML = originalHtml;
                    return;
                }
                const a = document.createElement('a');
                a.href = data.url;
                a.download = fileName;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) {
                log('❌ Ошибка получения ссылки на файл: ' + e, 'error');
            } finally {
                linkEl.innerHTML = originalHtml;
            }
        }

        function handleAvatarError(img) {
            img.style.display = 'none';
            const parent = img.parentElement;
            if (parent && parent.classList.contains('chat-avatar')) {
                parent.textContent = parent.dataset.initials || '?';
                if (parent.dataset.avatarSeed) {
                    parent.style.background = avatarGradient(parent.dataset.avatarSeed);
                }
            }
        }

        function hexPreviewToDataUrl(hex) {
            try {
                const bytes = new Uint8Array(hex.length / 2);
                for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
                let binary = '';
                bytes.forEach(b => binary += String.fromCharCode(b));
                return 'data:image/webp;base64,' + btoa(binary);
            } catch (e) {
                return null;
            }
        }

        function renderChats(payload) {
            if (payload.profile?.contact?.id != null) {
                selfId = payload.profile.contact.id;
            }
            contactsById = {};
            (payload.contacts || []).forEach(c => { contactsById[c.id] = c; });
            if (payload.presence) {
                Object.entries(payload.presence).forEach(([uid, p]) => {
                    presenceById[uid] = { online: p?.status === 1, seen: p?.seen || 0 };
                });
            }
            // Вторичный ключ (chat.id) обязателен: при равном/нулевом
            // lastEventTime (например, у чатов без сообщений) Array.sort
            // стабильна относительно ВХОДНОГО порядка массива, а он у нас не
            // постоянный — Object.values(chatsById) отдаёт числовые id не в
            // порядке вставки, а по возрастанию номера (особенность JS).
            // Без явного тайбрейка это приводило к тому, что такие чаты
            // "перескакивали" местами между перерисовками (initial sync vs.
            // повторный renderChats после подгрузки avatars.json и т.п.).
            const chats = (payload.chats || []).slice().sort((a, b) => {
                const byTime = (b.lastEventTime || 0) - (a.lastEventTime || 0);
                if (byTime !== 0) return byTime;
                return String(b.id).localeCompare(String(a.id));
            });
            chatsById = {};
            chats.forEach(chat => { chatsById[chat.id] = chat; });
            chatsSortedCache = chats;
            renderChatsList();
            settingsMenu.refreshPage('account');
            log(`📋 Загружено ${chats.length} чатов`, 'success');
            if (currentChatId != null && !document.getElementById('chatDetailSection').classList.contains('hidden')) {
                updateBotWebAppButton(chatsById[currentChatId]);
            }
            fetchMissingContactInfo();
            if (!isOfflineCacheMode) {
                cacheChatsToDisk();
            }
        }

        // Строит DOM-элемент строки чата (вынесено из renderChats, чтобы
        // переиспользовать при отрисовке отфильтрованного списка).
        function buildChatItemEl(chat) {
            const name = chatDisplayName(chat);
            const preview = chatPreview(chat);
            const time = chat.lastEventTime ? new Date(chat.lastEventTime).toLocaleDateString() : '';
            const unread = chat.newMessages ? `<div class="unread">${chat.newMessages}</div>` : '';
            const avatarUrl = chatAvatarUrl(chat);
            const initial = getInitials(name);
            let avatarHtml;
            let avatarBg = '';
            if (avatarUrl) {
                avatarHtml = `<img src="${avatarUrl}" alt="" loading="lazy" onerror="handleAvatarError(this)">`;
            } else {
                avatarHtml = initial;
                avatarBg = `background:${avatarGradient(chat.id)};`;
            }
            const otherId = chat.type === 'DIALOG' ? otherParticipantId(chat) : null;
            const isOnline = otherId != null && presenceById[otherId]?.online && !isBotChat(chat);
            const onlineDot = isOnline ? '<span class="online-dot"></span>' : '';
            const el = document.createElement('div');
            el.className = 'chat-item';
            el.dataset.chatId = chat.id;
            el.innerHTML = `
                <div class="chat-avatar" data-initials="${initial}" data-avatar-seed="${chat.id}" style="position:relative;${avatarBg}">${avatarHtml}${onlineDot}</div>
                <div class="chat-info">
                    <div class="chat-name">${name}</div>
                    <div class="chat-preview">${escapeHtml(preview)}</div>
                </div>
                <div class="chat-meta">${time}${unread}</div>
            `;
            el.onclick = () => openChat(chat.id);
            return el;
        }

        // ========================================
        // ЛОКАЛЬНЫЙ ПОИСК ПО ЧАТАМ И КОНТАКТАМ
        //
        // В отличие от peopleSearchPanel (запросы к серверу по номеру/юзернейму),
        // это чисто клиентский фильтр по уже загруженным chatsById/contactsById —
        // сервер при синке чатов (opcode 19) и так присылает contacts вместе
        // с chats, так что искать можно без лишних запросов.
        // ========================================
        let chatsSortedCache = [];
        let chatFilterQuery = '';

        function normalizeSearchText(s) {
            return String(s || '').toLowerCase().trim();
        }

        function stripHtmlText(html) {
            const d = document.createElement('div');
            d.innerHTML = html;
            return (d.textContent || d.innerText || '').trim();
        }

        function contactSearchStrings(contact) {
            if (!contact) return [];
            const names = Array.isArray(contact.names) ? contact.names : [];
            const strs = [];
            names.forEach(n => {
                if (n.name) strs.push(n.name);
                if (n.firstName) strs.push(n.firstName);
                if (n.lastName) strs.push(n.lastName);
                // Добавляем полное имя, собранное из firstName + lastName
                if (n.firstName && n.lastName) {
                    strs.push(n.firstName + ' ' + n.lastName);
                }
            });
            if (contact.phone != null) strs.push(String(contact.phone));
            return strs;
        }

        function chatSearchStrings(chat) {
            const strs = [stripHtmlText(chatDisplayName(chat))];
            const otherId = chat.type === 'DIALOG' ? otherParticipantId(chat) : null;
            if (otherId != null) {
                const contact = contactsById[otherId];
                if (contact) {
                    // Добавляем все возможные варианты имени
                    const names = Array.isArray(contact.names) ? contact.names : [];
                    names.forEach(n => {
                        if (n.name) strs.push(n.name);
                        if (n.firstName) strs.push(n.firstName);
                        if (n.lastName) strs.push(n.lastName);
                        if (n.firstName && n.lastName) {
                            strs.push(n.firstName + ' ' + n.lastName);
                        }
                    });
                    if (contact.phone != null) strs.push(String(contact.phone));
                }
            }
            return strs;
        }

        function textMatchesQuery(strs, q, qDigits) {
            return strs.some(s => {
                const norm = normalizeSearchText(s);
                if (norm.includes(q)) return true;
                if (qDigits && qDigits.length >= 3) {
                    const digits = norm.replace(/[^\d]/g, '');
                    if (digits && digits.includes(qDigits)) return true;
                }
                return false;
            });
        }

        function hasDialogWithContact(contactId) {
            for (const id in chatsById) {
                if (chatsById[id].type === 'DIALOG' && otherParticipantId(chatsById[id]) === contactId) return true;
            }
            return false;
        }

        // Строка списка для кастомного бота (добавлен вручную или из GitHub-реестра) —
        // по клику открывает локальный чат с ботом по его HTTP API (см. openBotChatModal).
        function customBotSearchStrings(bot) {
            return [bot.name, bot.url];
        }

        function buildCustomBotItemEl(bot) {
            const el = document.createElement('div');
            el.className = 'chat-item';
            el.dataset.botId = bot.id;
            const initial = getInitials(bot.name);
            el.innerHTML = `
                <div class="chat-avatar" data-initials="${initial}" style="background:${avatarGradient(bot.id)};">🤖</div>
                <div class="chat-info">
                    <div class="chat-name">${escapeHtml(bot.name)}</div>
                    <div class="chat-preview">Кастомный бот · нажмите, чтобы написать</div>
                </div>
            `;
            el.onclick = () => openBotChatModal(bot.id);
            return el;
        }

        // Строка списка для контакта, с которым ещё нет чата — по клику
        // открывает/создаёт диалог (та же логика, что у peopleSearchPanel).
        function buildContactItemEl(contact) {
            const name = contactNameFromPayload(contact);
            const el = document.createElement('div');
            el.className = 'chat-item';
            el.dataset.contactId = contact.id;
            const avatarUrl = contact.baseUrl ? '/img?url=' + encodeURIComponent(contact.baseUrl) : null;
            const initial = getInitials(name);
            const avatarHtml = avatarUrl
                ? `<img src="${avatarUrl}" alt="" loading="lazy" onerror="handleAvatarError(this)">`
                : initial;
            const avatarBg = avatarUrl ? '' : `background:${avatarGradient(contact.id)};`;
            el.innerHTML = `
                <div class="chat-avatar" data-initials="${initial}" data-avatar-seed="${contact.id}" style="${avatarBg}">${avatarHtml}</div>
                <div class="chat-info">
                    <div class="chat-name">${escapeHtml(name)}</div>
                    <div class="chat-preview">Контакт · нажмите, чтобы написать</div>
                </div>
            `;
            el.onclick = () => openOrCreateDialogWithContact(contact);
            return el;
        }

        // ----------------------------------------
        // Локальные контакты телефона (мост AndroidContacts из MainActivity).
        // Разрешение READ_CONTACTS уже объявлено в манифесте, но запрашивать
        // его в рантайме нужно явно — и делаем это лениво, при первом
        // обращении к локальному поиску, а не при каждом запуске приложения.
        // ----------------------------------------
        let localPhoneContacts = [];
        let localPhoneContactsRequested = false;

        function hasAndroidContactsBridge() {
            return typeof AndroidContacts !== 'undefined' && AndroidContacts.isAvailable();
        }

        // Дёргается из MainActivity.notifyContactsPermissionResult() после
        // ответа пользователя на системный диалог разрешения.
        window.onAndroidContactsPermissionResult = function (granted) {
            if (granted) {
                loadLocalPhoneContacts();
            } else {
                log('❌ Нет доступа к контактам телефона — локальный поиск ограничен контактами MAX', 'info');
            }
        };

        function loadLocalPhoneContacts() {
            if (!hasAndroidContactsBridge()) return;
            try {
                const raw = AndroidContacts.getContacts();
                const parsed = JSON.parse(raw || '[]');
                localPhoneContacts = Array.isArray(parsed) ? parsed : [];
                log(`📱 Загружено ${localPhoneContacts.length} контактов из телефона`, 'success');
            } catch (e) {
                localPhoneContacts = [];
            }
            updateRevokeContactsButton();
            renderChatsList();
        }

        // Кнопку показываем, только если доступ реально есть — Android не
        // даёт приложению отозвать разрешение самому, поэтому кнопка ведёт
        // на системный экран настроек приложения, где это может сделать
        // сам пользователь.
        function updateRevokeContactsButton() {
            const btn = document.getElementById('revokeContactsAccessBtn');
            const hasAccess = hasAndroidContactsBridge() && AndroidContacts.hasPermission();
            btn.classList.toggle('hidden', !hasAccess);
        }

        function openContactsAppSettings() {
            if (hasAndroidContactsBridge()) {
                AndroidContacts.openAppSettings();
            } else {
                log('❌ Открыть настройки приложения можно только из Android-приложения', 'error');
            }
        }

        // Вызывается при первом взаимодействии с полем локального поиска.
        // Если бриджа нет (не Android-обёртка, а обычный браузер) — тихо
        // ничего не делает, поиск просто продолжает работать по
        // contactsById, полученным от сервера MAX.
        function ensureLocalPhoneContacts() {
            if (localPhoneContactsRequested || !hasAndroidContactsBridge()) return;
            localPhoneContactsRequested = true;
            if (AndroidContacts.hasPermission()) {
                loadLocalPhoneContacts();
            } else {
                AndroidContacts.requestPermission();
            }
        }

        function phoneDigitsTail(phone, n = 10) {
            const digits = String(phone || '').replace(/[^\d]/g, '');
            return digits.slice(-n);
        }

        // Контакт телефона считается "уже известным", если такой же номер
        // (по последним 10 цифрам — без учёта кода страны/формата) уже есть
        // среди контактов MAX, полученных от сервера — тогда его и так
        // покажет buildContactItemEl/buildChatItemEl выше, дублировать не нужно.
        function isLocalContactKnownOnMax(phone) {
            const tail = phoneDigitsTail(phone);
            if (!tail) return false;
            return Object.values(contactsById).some(c => c.phone && phoneDigitsTail(c.phone) === tail);
        }

        // Строка для контакта из телефонной книги, которого ещё нет в MAX —
        // по клику ищем его на сервере по номеру (тот же путь, что и ручной
        // поиск по номеру в peopleSearchPanel).
        function buildLocalContactItemEl(localContact) {
            const name = localContact.name || localContact.phone;
            const el = document.createElement('div');
            el.className = 'chat-item';
            const initial = getInitials(name);
            el.innerHTML = `
                <div class="chat-avatar" data-initials="${initial}" data-avatar-seed="${escapeHtml(String(localContact.phone))}" style="background:${avatarGradient(localContact.phone)};">${initial}</div>
                <div class="chat-info">
                    <div class="chat-name">${escapeHtml(name)}</div>
                    <div class="chat-preview">📱 Из контактов телефона · найти в MAX</div>
                </div>
            `;
            el.onclick = () => findLocalContactOnMax(localContact);
            return el;
        }

        function findLocalContactOnMax(localContact) {
            const phone = normalizePhoneForSearch(localContact.phone);
            if (!phone) return;
            const input = document.getElementById('localChatSearchInput');
            input.value = phone;
            log(`🔎 Ищу ${localContact.name || phone} на MAX...`, 'info');
            applyChatFilter(phone);
        }

        // Перерисовывает #chatsList с учётом текущего chatFilterQuery.
        // Порядок при активном поиске — как в Telegram: сначала контакты
        // (их отдаёт сам MAX, это самый релевantный результат), затем
        // тонкая разделительная черта, и только потом остальное — чаты,
        // боты, локальные контакты телефона и подсказка по @юзернейму.
        function renderChatsList() {
            const list = document.getElementById('chatsList');
            list.innerHTML = '';
            const qRaw = normalizeSearchText(chatFilterQuery);
            const qDigits = qRaw.replace(/[^\d]/g, '');

            let matchedContactsCount = 0;

            if (qRaw) {
                const shown = new Set();
                Object.values(contactsById).forEach(contact => {
                    if (typeof contact.id !== 'number') return;
                    if (shown.has(contact.id)) return;
                    if (hasDialogWithContact(contact.id)) return; // уже будет показан ниже как чат
                    if (!textMatchesQuery(contactSearchStrings(contact), qRaw, qDigits)) return;
                    shown.add(contact.id);
                    matchedContactsCount++;
                    list.appendChild(buildContactItemEl(contact));
                });
            }

            const chats = qRaw
                ? chatsSortedCache.filter(chat => textMatchesQuery(chatSearchStrings(chat), qRaw, qDigits))
                : chatsSortedCache;

            let restCount = chats.length;

            if (qRaw && matchedContactsCount > 0 && restCount > 0) {
                const divider = document.createElement('div');
                divider.className = 'chat-list-divider';
                list.appendChild(divider);
            }

            chats.forEach(chat => list.appendChild(buildChatItemEl(chat)));

            if (qRaw) {
                // Кастомные боты (добавлены вручную или из GitHub-реестра) — идут
                // после реальных контактов MAX, но до локальных телефонных контактов.
                // Порядок внутри: сначала добавленные вручную, затем недавно
                // запускавшиеся (см. getCustomBotsSorted).
                getCustomBotsSorted().forEach(bot => {
                    if (!textMatchesQuery(customBotSearchStrings(bot), qRaw, qDigits)) return;
                    list.appendChild(buildCustomBotItemEl(bot));
                });

                const shownPhones = new Set();
                localPhoneContacts.forEach(localContact => {
                    const tail = phoneDigitsTail(localContact.phone);
                    if (!tail || shownPhones.has(tail)) return;
                    if (isLocalContactKnownOnMax(localContact.phone)) return; // уже показан выше
                    if (!textMatchesQuery([localContact.name, localContact.phone], qRaw, qDigits)) return;
                    shownPhones.add(tail);
                    list.appendChild(buildLocalContactItemEl(localContact));
                });

                // Если запрос похож на @username или ссылку max.ru — предлагаем
                // найти/открыть его напрямую на сервере MAX (люди и боты, которых
                // ещё нет ни в контактах, ни в кэше чатов). Это самый нижний
                // приоритет — сначала показываем то, что уже есть локально.
                const trimmedRaw = (chatFilterQuery || '').trim();
                const usernameMatch = trimmedRaw.match(/^@([A-Za-z][A-Za-z0-9_]{2,31})$/);
                const isMaxLink = /^https?:\/\/(www\.)?max\.ru\//i.test(trimmedRaw);
                if (usernameMatch || isMaxLink) {
                    const el = document.createElement('div');
                    el.className = 'chat-item';
                    el.innerHTML = `
                        <div class="chat-avatar" style="background:#eee;color:#888;">🔎</div>
                        <div class="chat-info">
                            <div class="chat-name">Найти в MAX: ${escapeHtml(trimmedRaw)}</div>
                            <div class="chat-preview">Открыть профиль, чат или бота по ссылке/@юзернейму</div>
                        </div>
                    `;
                    el.onclick = () => resolveMaxLink(usernameMatch ? ('https://max.ru/' + usernameMatch[1]) : trimmedRaw);
                    list.appendChild(el);
                }
            }

            if (qRaw && !list.children.length) {
                list.innerHTML = '<div class="search-empty">Ничего не найдено</div>';
            }
        }

        function applyChatFilter(raw) {
            try {
                chatFilterQuery = raw || '';
                ensureLocalPhoneContacts();
                renderChatsList();
                scheduleGlobalSearch(chatFilterQuery);
            } catch (e) {
                log('❌ Ошибка поиска: ' + (e && e.message ? e.message : e), 'error');
            }
        }

        // ========================================
        // ЕДИНЫЙ ПОИСК (как в Telegram): то же поле localChatSearchInput,
        // что фильтрует локальные чаты/контакты, с задержкой (debounce)
        // дополнительно обращается к серверу MAX — по номеру телефона
        // (opcode 46) или по имени/юзернейму (opcode 60) — и результаты
        // дорисовываются отдельным блоком "Результаты из MAX" под
        // локальным списком, без отдельной панели/кнопки.
        // ========================================
        let globalSearchTimer = null;
        let globalSearchQuery = ''; // запрос, на который реально ушёл запрос к серверу
        let globalSearchResults = [];
        let globalSearchLoading = false;

        function scheduleGlobalSearch(raw) {
            const trimmed = (raw || '').trim();
            if (globalSearchTimer) {
                clearTimeout(globalSearchTimer);
                globalSearchTimer = null;
            }
            if (trimmed.length < 2) {
                globalSearchQuery = '';
                globalSearchResults = [];
                globalSearchLoading = false;
                renderGlobalSearchResults();
                return;
            }
            globalSearchTimer = setTimeout(() => {
                globalSearchTimer = null;
                try {
                    performGlobalSearch(trimmed);
                } catch (e) {
                    log('❌ Ошибка поиска: ' + (e && e.message ? e.message : e), 'error');
                }
            }, 400);
        }

        function performGlobalSearch(trimmed) {
            // Поле могло измениться, пока ждали debounce — не ищем устаревшее.
            if ((chatFilterQuery || '').trim() !== trimmed) return;
            if (!isConnected) return; // нет соединения — обойдёмся локальными результатами
            globalSearchQuery = trimmed;
            globalSearchLoading = true;
            renderGlobalSearchResults();

            const digitCount = (trimmed.match(/\d/g) || []).length;
            const compact = trimmed.replace(/[\s()+-]/g, '');
            const looksLikePhone = digitCount >= 5 && compact.length > 0 && digitCount >= compact.length * 0.8;

            if (looksLikePhone) {
                const phone = normalizePhoneForSearch(trimmed);
                if (phone) {
                    log(`🔎 Поиск по номеру ${phone}...`, 'info');
                    send(46, { phone });
                    return;
                }
            }

            const cleanQuery = trimmed.replace(/^@/, '');
            if (!cleanQuery) {
                globalSearchLoading = false;
                globalSearchResults = [];
                renderGlobalSearchResults();
                return;
            }
            log(`🔎 Поиск "${cleanQuery}"...`, 'info');
            send(60, { type: 'ALL', count: 20, query: cleanQuery });
        }

        function renderGlobalSearchResults() {
            const wrap = document.getElementById('globalSearchResultsList');
            if (!wrap) return;
            if (!globalSearchQuery) {
                wrap.classList.add('hidden');
                wrap.innerHTML = '';
                return;
            }
            wrap.classList.remove('hidden');
            wrap.innerHTML = '<div class="global-search-label">Результаты из MAX</div>';
            if (globalSearchLoading) {
                wrap.innerHTML += '<div class="search-empty">Ищем на сервере…</div>';
                return;
            }
            if (!globalSearchResults.length) {
                wrap.innerHTML += '<div class="search-empty">Ничего не найдено на сервере</div>';
                return;
            }
            globalSearchResults.forEach(item => {
                if (!item) return;
                const el = document.createElement('div');
                el.className = 'chat-item';
                const avatarUrl = item.avatarUrl ? '/img?url=' + encodeURIComponent(item.avatarUrl) : null;
                const initial = getInitials(item.name);
                const avatarHtml = avatarUrl
                    ? `<img src="${avatarUrl}" alt="" loading="lazy" onerror="handleAvatarError(this)">`
                    : initial;
                const avatarBg = avatarUrl ? '' : `background:${avatarGradient(item.id)};`;
                el.innerHTML = `
                    <div class="chat-avatar" data-initials="${initial}" data-avatar-seed="${item.id}" style="${avatarBg}">${avatarHtml}</div>
                    <div class="chat-info">
                        <div class="chat-name">${escapeHtml(item.name || '')}</div>
                        <div class="chat-preview">${escapeHtml(item.subtitle || '')}</div>
                    </div>
                `;
                el.onclick = item.onOpen;
                wrap.appendChild(el);
            });
        }

        // ========================================
        // ОФЛАЙН-РЕЖИМ: показываем чаты, сохранённые в файл на диске,
        // когда нет сети и лимит попыток переподключения исчерпан.
        // ========================================

        function cacheChatsToDisk() {
            try {
                const data = {
                    chats: Object.values(chatsById),
                    contacts: Object.values(contactsById),
                    savedAt: Date.now(),
                };
                fetch('/api/chats-cache', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                }).catch(() => { });
            } catch (e) { /* сохранение кэша не критично — молча пропускаем */ }
        }

        // Держим в памяти последние 20 сообщений на чат и синхронизируем их
        // на диск (зашифрованно, на бэкенде), чтобы при следующем офлайн-запуске
        // можно было открыть чат и увидеть хотя бы недавнюю переписку.
        const MESSAGES_CACHE_LIMIT = 20;

        function updateMessagesCache(chatId, newMessages) {
            if (!chatId || !newMessages || !newMessages.length) return;
            const arr = messagesByChatId[chatId] || (messagesByChatId[chatId] = []);
            const ids = new Set(arr.map(m => String(m.id)));
            newMessages.forEach(m => {
                if (!ids.has(String(m.id))) {
                    arr.push(m);
                    ids.add(String(m.id));
                }
            });
            arr.sort((a, b) => (a.time || 0) - (b.time || 0));
            if (arr.length > MESSAGES_CACHE_LIMIT) {
                arr.splice(0, arr.length - MESSAGES_CACHE_LIMIT);
            }
            if (!isOfflineCacheMode) {
                cacheMessagesToDisk(chatId, arr);
            }
        }

        function cacheMessagesToDisk(chatId, messages) {
            try {
                fetch('/api/messages-cache', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId, messages }),
                }).catch(() => { });
            } catch (e) { /* сохранение кэша не критично — молча пропускаем */ }
        }

        // Загружает сохранённые сообщения чата с диска, когда мы в офлайн-режиме
        // и обычный send(49, ...) по вебсокету всё равно ничего не вернёт.
        async function loadCachedMessagesForChat(chatId) {
            try {
                const res = await fetch('/api/messages-cache?chatId=' + encodeURIComponent(chatId));
                const json = await res.json();
                if (json.success && json.data && Array.isArray(json.data.messages) && json.data.messages.length) {
                    messagesByChatId[chatId] = json.data.messages.slice();
                    await renderMessages({ messages: json.data.messages }, false);
                    log('📦 Показаны сохранённые сообщения чата ' + chatId + ' (офлайн)', 'info');
                } else {
                    log('ℹ️ Нет сохранённых сообщений для этого чата', 'info');
                }
            } catch (e) {
                log('❌ Не удалось загрузить сохранённые сообщения: ' + e.message, 'error');
            }
        }

        function removeOfflineBanner() {
            document.getElementById('offlineCacheBanner')?.remove();
        }

        function insertOfflineBanner(savedAt) {
            removeOfflineBanner();
            const list = document.getElementById('chatsList');
            if (!list || !list.parentNode) return;
            const banner = document.createElement('div');
            banner.id = 'offlineCacheBanner';
            banner.className = 'offline-cache-banner';
            const when = savedAt ? new Date(savedAt).toLocaleString() : '';
            banner.innerHTML = `<span class="offline-cache-banner-icon">📡</span><span>Нет соединения — показаны сохранённые чаты${when ? ' <span class="offline-cache-banner-time">(на ' + when + ')</span>' : ''}</span>`;
            list.parentNode.insertBefore(banner, list);
        }

        async function showOfflineCachedChats() {
            if (offlineBannerShown) return;
            // ВАЖНО: раньше оверлей загрузки скрывался только если в кэше
            // реально были сохранённые чаты — если пользователь уже был
            // авторизован (валидный токен), но локального кэша чатов ещё
            // не было (или он пуст), приложение так и оставалось на экране
            // загрузки навсегда при отсутствии интернета. Теперь оверлей
            // скрываем и показываем UI в любом случае.
            hideLoadingOverlay();
            try {
                const res = await fetch('/api/chats-cache');
                const json = await res.json();
                offlineBannerShown = true;
                isOfflineCacheMode = true;
                showAuthenticatedUI();
                if (!json.success || !json.data || !(json.data.chats || []).length) {
                    log('ℹ️ Сохранённых чатов для офлайн-режима нет', 'info');
                    insertOfflineBanner();
                    return;
                }
                renderChats(json.data);
                insertOfflineBanner(json.data.savedAt);
                log('📦 Показаны сохранённые чаты (офлайн-режим)', 'info');
            } catch (e) {
                log('❌ Не удалось загрузить сохранённые чаты: ' + e.message, 'error');
                offlineBannerShown = true;
                isOfflineCacheMode = true;
                showAuthenticatedUI();
                insertOfflineBanner();
            }
        }

        function chatPreview(chat) {
            const draft = getDrafts()[chat.id];
            if (draft) return `✏️ Черновик: ${escapeHtml(draft.slice(0, 80))}`;
            const m = chat.lastMessage;
            if (!m) return '';
            const isTranslationKey = m.text && /^[a-z0-9]+(\.[a-z0-9]+)+$/i.test(m.text);
            const attach = m.attaches?.[0];
            if (attach?._type === 'CONTROL') {
                return attach.message || attach.shortMessage || 'Системное событие';
            }
            if (attach?._type === 'VIDEO') {
                return '🎬 Видео';
            }
            if (attach?._type === 'AUDIO') {
                return '🎤 Голосовое сообщение';
            }
            if (attach?._type === 'VIDEO' && attach?.videoType === 1) {
                return '⏺️ Видео-кружок';
            }
            if (attach?._type === 'GIF') {
                return '🎞️ GIF';
            }
            if (m.text && !isTranslationKey) return m.text.slice(0, 80);
            if (attach) {
                const labels = {
                    PHOTO: '🖼️ Фото',
                    VIDEO: '🎬 Видео',
                    GIF: '🎞️ GIF',
                    FILE: '📎 ' + (attach.name || 'Файл'),
                    CALL: attach.callType === 'VIDEO' ? '📞 Видеозвонок' : '📞 Звонок',
                };
                return labels[attach._type] || `[${attach._type}]`;
            }
            return '';
        }

        function buildStatusTicksHtml(m, chat) {
            try {
                if (chat?.type !== 'DIALOG') {
                    return '<span class="msg-status sent">✓</span>';
                }
                const otherId = otherParticipantId(chat);
                if (!otherId) return '<span class="msg-status sent">✓</span>';
                const info = chat?.participants?.[otherId];
                let otherLastRead = null;
                if (typeof info === 'number' || typeof info === 'string') {
                    otherLastRead = info;
                } else if (info && typeof info === 'object') {
                    otherLastRead = info.lastReadMessageId ?? info.mark ?? info.readMark ?? null;
                }
                if (otherLastRead == null && chat?.readMarks) {
                    otherLastRead = chat.readMarks[otherId] || null;
                }
                if (otherLastRead != null) {
                    try {
                        if (BigInt(m.id) <= BigInt(otherLastRead)) {
                            return '<span class="msg-status read">✓✓</span>';
                        }
                    } catch (e) { }
                }
                return '<span class="msg-status sent">✓</span>';
            } catch (err) {
                return '<span class="msg-status sent">✓</span>';
            }
        }

        function buildReactionsHtml(m) {
            try {
                const counts = m.reactionInfo?.counters || [];
                let badges = '';
                if (Array.isArray(counts)) {
                    counts.forEach(r => {
                        const emoji = r.reaction || '🚫';
                        const count = r.count ?? 1;
                        const mine = m.reactionInfo?.yourReaction === emoji ? ' mine' : '';
                        const imgSrc = EMOJI_CDN_URLS[emoji];
                        let inner;
                        if (imgSrc) {
                            inner = `<img src="${imgSrc}" alt="${escapeHtml(emoji)}" style="width:16px;height:16px;vertical-align:middle;" onerror="this.style.display='none';this.parentElement.textContent='${escapeHtml(emoji)}';"> ${count}`;
                        } else {
                            inner = `${escapeHtml(emoji)} ${count}`;
                        }
                        badges += `<span class="reaction-badge${mine}" data-emoji="${escapeHtml(emoji)}" data-msg-id="${m.id}" onclick="handleReactionBadgeClick(this)" style="cursor:pointer;">${inner}</span>`;
                    });
                }
                return badges ? `<div class="msg-reactions">${badges}</div>` : '';
            } catch (err) {
                return '';
            }
        }

        function sendReaction(m, emoji) {
            if (!currentChatId) return;
            const info = m.reactionInfo || { counters: [] };
            const counters = Array.isArray(info.counters) ? info.counters.slice() : [];
            const prevMine = info.yourReaction;
            const cancel = prevMine === emoji;

            function bump(e, delta) {
                const idx = counters.findIndex(c => c.reaction === e);
                if (idx >= 0) {
                    counters[idx] = { ...counters[idx], count: Math.max(0, (counters[idx].count || 0) + delta) };
                    if (counters[idx].count <= 0) counters.splice(idx, 1);
                } else if (delta > 0) {
                    counters.push({ reaction: e, count: 1 });
                }
            }

            if (prevMine) bump(prevMine, -1);
            if (!cancel) bump(emoji, 1);

            // Оптимистичное обновление — как в Telegram, без ожидания ответа сервера.
            m.reactionInfo = { counters, yourReaction: cancel ? null : emoji };
            const old = document.querySelector(`.msg-bubble[data-msg-id="${m.id}"]`);
            if (old) old.replaceWith(createMessageElement(m));

            if (cancel) {
                send(179, { chatId: currentChatId, messageId: m.id });
            } else {
                send(178, { chatId: currentChatId, messageId: m.id, reaction: { reactionType: 'EMOJI', id: emoji } });
            }
        }
        function handleReactionBadgeClick(el) {
            const msgId = el.dataset.msgId;
            const emoji = el.dataset.emoji;
            if (!msgId || !emoji) return;
            // Находим сообщение в кэше текущего чата
            const messages = messagesByChatId[currentChatId];
            if (!messages) return;
            const m = messages.find(msg => String(msg.id) === String(msgId));
            if (!m) return;
            sendReaction(m, emoji);
        }

        // ---- Панель выбора реакции по двойному тапу на сообщение ----
        // Полный список — все эмодзи из EMOJI_CDN_URLS (тот же источник,
        // что и уже стоящие на сообщениях бейджи реакций), картинками,
        // а не системным эмодзи-шрифтом — на части устройств/шрифтов
        // системные эмодзи рисуются мелко/чёрно-белым контуром, картинки
        // выглядят одинаково везде. Панель скроллится, если список не
        // помещается на экран.

        let _reactionPickerEls = null;
        function _ensureReactionPickerEls() {
            if (_reactionPickerEls) return _reactionPickerEls;
            const backdrop = document.createElement('div');
            backdrop.id = 'reactionPickerBackdrop';
            const popup = document.createElement('div');
            popup.id = 'reactionPickerPopup';
            document.body.appendChild(backdrop);
            document.body.appendChild(popup);
            backdrop.addEventListener('click', hideReactionPicker);
            backdrop.addEventListener('touchstart', hideReactionPicker, { passive: true });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') hideReactionPicker();
            });
            _reactionPickerEls = { backdrop, popup };
            return _reactionPickerEls;
        }

        function hideReactionPicker() {
            if (!_reactionPickerEls) return;
            _reactionPickerEls.backdrop.classList.remove('active');
            _reactionPickerEls.popup.classList.remove('active');
        }

        function showReactionPicker(x, y, m) {
            const { backdrop, popup } = _ensureReactionPickerEls();
            popup.innerHTML = '';
            Object.keys(EMOJI_CDN_URLS).forEach(emoji => {
                const btn = document.createElement('div');
                btn.className = 'rp-emoji';
                const src = (typeof getEmojiSrc === 'function' ? getEmojiSrc(emoji) : null) || EMOJI_CDN_URLS[emoji];
                if (src) {
                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = emoji;
                    img.onerror = function () {
                        btn.innerHTML = '';
                        btn.textContent = emoji;
                    };
                    btn.appendChild(img);
                } else {
                    btn.textContent = emoji;
                }
                btn.onclick = () => {
                    sendReaction(m, emoji);
                    hideReactionPicker();
                };
                popup.appendChild(btn);
            });

            backdrop.classList.add('active');
            popup.classList.add('active');

            // Показываем сначала off-screen, чтобы измерить реальный размер
            // панели и потом аккуратно вписать её в экран у точки тапа —
            // иначе на узких мобильных экранах панель могла бы вылезать
            // за правый/нижний край.
            popup.style.left = '-9999px';
            popup.style.top = '-9999px';
            requestAnimationFrame(() => {
                const rect = popup.getBoundingClientRect();
                const margin = 8;
                let left = x - rect.width / 2;
                let top = y - rect.height - 12;
                left = Math.max(margin, Math.min(left, window.innerWidth - rect.width - margin));
                if (top < margin) top = y + 12; // не влезает сверху — показываем под пальцем
                top = Math.max(margin, Math.min(top, window.innerHeight - rect.height - margin));
                popup.style.left = left + 'px';
                popup.style.top = top + 'px';
            });
        }

        // Кэш, чтобы не дёргать /lottie повторно для одного и того же стикера
        const lottieJsonCache = {};
        async function loadLottieSticker(holderId, lottieUrl) {
            try {
                if (typeof lottie === 'undefined') return; // библиотека не подключилась — остаётся статичный fallback
                let animData = lottieJsonCache[lottieUrl];
                if (!animData) {
                    const res = await fetch('/lottie?url=' + encodeURIComponent(lottieUrl));
                    if (!res.ok) return;
                    animData = await res.json();
                    lottieJsonCache[lottieUrl] = animData;
                }
                const holder = document.getElementById(holderId);
                if (!holder) return; // сообщение уже могло уйти со экрана (смена чата и т.п.)
                holder.innerHTML = '';
                lottie.loadAnimation({
                    container: holder,
                    renderer: 'svg',
                    loop: true,
                    autoplay: true,
                    animationData: animData
                });
            } catch (e) {
                console.log('[maxclient] lottie load failed:', e);
            }
        }

        // Вставляет элемент сообщения в правильную хронологическую позицию по
        // dataset.msgTime, а не всегда в конец списка. Раньше новые сообщения
        // (и из истории, и входящие через WS) всегда добавлялись через
        // appendChild — если пакет догрузки истории приходил не строго по
        // возрастанию времени (например, после переподключения WS), более
        // новые сообщения оказывались НИЖЕ более старых, которые их обогнали
        // при appendChild — визуально это выглядело как "сообщения уезжают
        // назад" после отправки нового.
        function insertMessageInOrder(list, el) {
            const time = Number(el.dataset.msgTime) || 0;
            const children = list.querySelectorAll('.msg-bubble[data-msg-time]');
            let inserted = false;
            for (let i = children.length - 1; i >= 0; i--) {
                const childTime = Number(children[i].dataset.msgTime) || 0;
                if (childTime <= time) {
                    children[i].after(el);
                    inserted = true;
                    break;
                }
            }
            if (!inserted) {
                // Либо список пуст, либо это сообщение старше всех текущих.
                if (children.length) {
                    children[0].before(el);
                } else {
                    list.appendChild(el);
                }
            }
        }

        function createMessageElement(m, allMessages) {
            const el = document.createElement('div');
            const isOwn = m.sender === selfId;
            el.className = 'msg-bubble' + (isOwn ? ' own' : '');
            el.dataset.msgId = m.id;
            el.dataset.msgTime = m.time || Date.now();
            el.addEventListener('dblclick', (e) => { e.preventDefault(); showReactionPicker(e.clientX, e.clientY, m); });
            // dblclick не всегда надёжно ловится в мобильном WebView (там где
            // это приложение и рендерится — MAX-клиент под Android) — там
            // события двойного тапа глушатся встроенной логикой зума/скролла.
            // Ловим двойной тап вручную по паре touchend в пределах 300мс и
            // ~24px друг от друга, независимо от родного dblclick выше.
            let _lastTap = 0, _lastTapX = 0, _lastTapY = 0;
            el.addEventListener('touchend', (e) => {
                const t = e.changedTouches && e.changedTouches[0];
                if (!t) return;
                const now = Date.now();
                const dx = t.clientX - _lastTapX, dy = t.clientY - _lastTapY;
                if (now - _lastTap < 300 && Math.abs(dx) < 24 && Math.abs(dy) < 24) {
                    e.preventDefault();
                    showReactionPicker(t.clientX, t.clientY, m);
                    _lastTap = 0;
                } else {
                    _lastTap = now;
                    _lastTapX = t.clientX;
                    _lastTapY = t.clientY;
                }
            });
            let attachesHtml = '';
            let keyboardHtml = '';
            let encBadgeHtml = '';
            if (m.__e2e && m.__e2e.encrypted) {
                if (m.__e2e.ok) {
                    m.text = m.__e2e.text;
                    encBadgeHtml = '<div class="msg-enc-badge">🔒 Зашифровано (E2E)</div>';
                } else {
                    m.text = '🔒 Не удалось расшифровать сообщение';
                    encBadgeHtml = '<div class="msg-enc-badge msg-enc-badge-error">🔒 Ошибка расшифровки</div>';
                }
            }
            // Бейдж скам-проверки: пустой и скрытый, пока не пришёл вердикт
            // от локальной ИИ-модели (см. queueScamCheck/applyScamVerdictToDom).
            // Проверяем ВСЕ сообщения, включая свои — не только чужие, т.к.
            // пользователю важно видеть предупреждение и если он сам
            // случайно пересылает/копирует скам-текст себе или в другой чат.
            let scamBadgeHtml = '';
            if (m.text) {
                const cached = scamVerdictCache[m.id];
                if (cached) {
                    const pct = typeof cached.confidence === 'number' ? clampPct(cached.confidence) : (cached.confidence ?? '?');
                    const cat = scamCategory(cached);
                    // Процент риска показываем для ЛЮБОГО проверенного
                    // сообщения, не только для помеченных как скам.
                    if (cat === 'scam') {
                        scamBadgeHtml = `<div class="msg-scam-badge">⚠️ Похоже на скам (${pct}%): ${escapeHtml(cached.reason || '')}</div>`;
                    } else if (cat === 'likely') {
                        scamBadgeHtml = `<div class="msg-scam-badge msg-scam-badge-likely">⚠️ Вероятно скам (${pct}%): ${escapeHtml(cached.reason || '')}</div>`;
                    } else {
                        scamBadgeHtml = `<div class="msg-scam-badge msg-scam-badge-safe">✅ Скам-проверка: ${pct}% риска</div>`;
                    }
                } else {
                    scamBadgeHtml = '<div class="msg-scam-badge" style="display:none;"></div>';
                    let scamContext = '';
                    if (Array.isArray(allMessages)) {
                        const idx = allMessages.findIndex(x => x.id === m.id);
                        if (idx > 0) {
                            scamContext = allMessages.slice(Math.max(0, idx - 5), idx)
                                .map(x => (x.text || '').trim())
                                .filter(Boolean)
                                .join('\n');
                        }
                    }
                    queueScamCheck(m.id, m.text, scamContext);
                }
            }
            (m.attaches || []).forEach(a => {
                if (a._type === 'PHOTO') {
                    let src = a.baseRawUrl || a.baseUrl;
                    if (src && !src.startsWith('data:')) src = '/img?url=' + encodeURIComponent(src);
                    if (!src && a.previewData) {
                        src = hexPreviewToDataUrl(a.previewData);
                    }
                    if (src) {
                        attachesHtml +=
                            `<div class="msg-attach"><img class="msg-img" src="${src}" alt="Фото" loading="lazy" onerror="this.style.display='none'" onclick="openPhotoViewer('${src}', '${m.id}')"></div>`;
                    } else {
                        attachesHtml += `<div class="msg-attach msg-file">🖼️ Фото (недоступно)</div>`;
                    }
                    return;
                }
                if (a._type === 'VIDEO') {
                    if (a.videoType === 1) {
                        attachesHtml += `<div class="msg-attach">${createVideoNotePlayer(m.id, currentChatId, a)}</div>`;
                    } else {
                        attachesHtml += `<div class="msg-attach">${createVideoPreview(m.id, currentChatId, a)}</div>`;
                    }
                    return;
                }
                if (a._type === 'AUDIO') {
                    attachesHtml += `<div class="msg-attach msg-audio">${createAudioPlayer(m.id, a)}</div>`;
                    return;
                }
                if (a._type === 'GIF') {
                    attachesHtml += `<div class="msg-attach">${createGifPreview(m.id, currentChatId, a)}</div>`;
                    return;
                }
                if (a._type === 'FILE') {
                    const fileName = a.name || 'файл';

                    let sizeText = '';
                    if (a.size) {
                        if (a.size >= 1024 * 1024) {
                            sizeText = `(${(a.size / (1024 * 1024)).toFixed(2)} МБ)`;
                        } else {
                            sizeText = `(${(a.size / 1024).toFixed(1)} КБ)`;
                        }
                    }

                    const isPdf = /\.pdf$/i.test(fileName);
                    const fileIcon = isPdf ? '📄' : '📎';

                    if (a.fileId) {
                        attachesHtml += `
          <div class="msg-attach msg-file">
            <a href="javascript:void(0)" class="msg-file-link"
               data-file-id="${a.fileId}" data-msg-id2="${m.id}" data-chat-id="${currentChatId}"
               onclick="downloadFileAttach(this)"
               style="text-decoration: none; color: #007bff; display: inline-flex; align-items: center; gap: 5px;">
              <span class="file-icon">${fileIcon}</span> 
              <span class="file-name" style="font-weight: 500; text-decoration: underline;">${escapeHtml(fileName)}</span> 
              <span class="file-size" style="color: #888; font-size: 12px; font-weight: normal;">${sizeText}</span>
            </a>
          </div>`;
                    } else {
                        attachesHtml += `
          <div class="msg-attach msg-file" style="color: #888;">
            ${fileIcon} ${escapeHtml(fileName)} ${sizeText} (ссылка недоступна)
          </div>`;
                    }
                    return;
                }
                if (a._type === 'STICKER') {
                    const w = a.width || 170;
                    const h = a.height || 170;
                    const stickerSrc = a.url ? '/img?url=' + encodeURIComponent(a.url) : null;
                    const fallbackImgHtml = stickerSrc
                        ? `<img src="${stickerSrc}" alt="${escapeHtml((a.tags || []).join(' ') || 'Стикер')}" loading="lazy" style="width:100%;height:auto;display:block;" onerror="this.parentElement.innerHTML='😀 Стикер (недоступен)'">`
                        : `😀 Стикер`;

                    if (a.lottieUrl && a.stickerType === 'LOTTIE') {
                        const holderId = 'lottie_' + m.id + '_' + Math.random().toString(36).slice(2, 8);
                        attachesHtml +=
                            `<div class="msg-attach msg-sticker" data-lottie-url="${escapeHtml(a.lottieUrl)}" data-holder-id="${holderId}" style="max-width:${w}px;">
                <div id="${holderId}" style="width:100%;aspect-ratio:${w}/${h};">${fallbackImgHtml}</div>
            </div>`;
                        // Не вызываем loadLottieSticker здесь – вызов будет после вставки в DOM
                    } else if (stickerSrc) {
                        attachesHtml +=
                            `<div class="msg-attach msg-sticker" style="max-width:${w}px;">${fallbackImgHtml}</div>`;
                    } else {
                        attachesHtml += `<div class="msg-attach msg-file">😀 Стикер</div>`;
                    }
                }


                if (a._type === 'CALL') {
                    let callText = a.callType === 'VIDEO' ? 'Видеозвонок' : 'Звонок';
                    if (a.duration && a.duration > 0) {
                        const totalSeconds = Math.floor(a.duration / 1000);
                        const hours = Math.floor(totalSeconds / 3600);
                        const minutes = Math.floor((totalSeconds % 3600) / 60);
                        const seconds = totalSeconds % 60;

                        let durationStr = '';
                        if (hours > 0) {
                            durationStr = `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                        } else {
                            durationStr = `${minutes}:${String(seconds).padStart(2, '0')}`;
                        }
                        callText += ` (${durationStr})`;
                    }
                    attachesHtml += `<div class="msg-attach msg-file">📞 ${callText}</div>`;
                    return;
                }
                if (a._type === 'CONTROL') {
                    const text = a.message || a.shortMessage || 'Системное событие';
                    attachesHtml +=
                        `<div class="msg-attach" style="text-align:center;color:#888;font-size:12px;">${escapeHtml(text)}</div>`;
                    return;
                }
                if (a._type === 'INLINE_KEYBOARD' || a._type === 'KEYBOARD') {
                    keyboardHtml += renderKeyboardAttach(a, m.id);
                    return;
                }
                // Неизвестный тип attach — не рендерим, но логируем, чтобы можно было
                // опознать реальное имя типа (например для клавиатуры бота) по живому трафику
                // и добавить обработчик выше.
                console.log('[maxclient] неизвестный attach._type:', a._type, a);
            });
            const isTranslationKey = m.text && /^[a-z0-9]+(\.[a-z0-9]+)+$/i.test(m.text);
            const hasControlAttach = (m.attaches || []).some(a => a._type === 'CONTROL');
            let textHtml = '';
            if (m.text && !(isTranslationKey && hasControlAttach)) {
                textHtml = `<div class="msg-text">${buildMessageTextHtml(m)}</div>`;
            }
            const time = m.time ? new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
            const chat = chatsById[currentChatId];
            const statusHtml = isOwn ? buildStatusTicksHtml(m, chat) : '';
            const timeHtml = `<div class="msg-time">${time}${statusHtml}</div>`;
            const reactionsHtml = buildReactionsHtml(m);
            el.innerHTML = attachesHtml + textHtml + encBadgeHtml + scamBadgeHtml + reactionsHtml + keyboardHtml + timeHtml
            return el;
        }

        // ========================================
        // БОТЫ: клавиатура (inline_keyboard) и мини-приложения (WebApp)
        // ========================================
        //
        // Схема кнопок ориентируется на официальный Bot API MAX (dev.max.ru),
        // т.к. приватный протокол мессенджера почти наверняка использует ту же
        // модель данных. Точные имена полей у приватного протокола не подтверждены
        // статическим анализом APK — код написан защитно (проверяет несколько
        // возможных путей к массиву кнопок) и логирует непонятные структуры,
        // чтобы их можно было быстро доопределить по реальному трафику.
        function normalizeButtonType(type) {
            return String(type || 'callback').toUpperCase();
        }

        function parseWebAppDeeplink(webApp) {
            if (!webApp) return {};
            try {
                const u = new URL(webApp);
                return {
                    startParam: u.searchParams.get('startapp') || u.searchParams.get('startApp') || '',
                    chatId: u.searchParams.get('chat_id') ? parseInt(u.searchParams.get('chat_id'), 10) : null,
                };
            } catch (e) {
                return {};
            }
        }

        function extractWebAppDataFromUrl(url) {
            if (!url) return null;
            try {
                const u = new URL(url);
                const fromQuery = u.searchParams.get('WebAppData') || u.searchParams.get('webAppData');
                if (fromQuery) return decodeURIComponent(fromQuery);
                if (u.hash.length > 1) {
                    const hashParams = new URLSearchParams(u.hash.slice(1));
                    const fromHash = hashParams.get('WebAppData') || hashParams.get('webAppData');
                    if (fromHash) return decodeURIComponent(fromHash);
                }
            } catch (e) {
                // fall through to regex
            }
            const match = url.match(/[#&?]WebAppData=([^&#]+)/i);
            return match ? decodeURIComponent(match[1]) : null;
        }

        function renderKeyboardAttach(attach, msgId) {
            const rows = attach.keyboard?.buttons || attach.buttons || attach.payload?.buttons || [];
            if (!Array.isArray(rows) || !rows.length) {
                console.log('[maxclient] клавиатура без кнопок, структура:', attach);
                return '';
            }
            let html = `<div class="msg-keyboard" data-msg-id="${msgId}">`;
            rows.forEach((row, rowIdx) => {
                const buttons = Array.isArray(row) ? row : [row];
                html += `<div class="msg-keyboard-row">`;
                buttons.forEach((btn, btnIdx) => {
                    const type = normalizeButtonType(btn.type);
                    const label = escapeHtml(btn.text || btn.label || '...');
                    const cls = type === 'LINK' || type === 'OPEN_APP' ? 'link-btn' : '';
                    html += `<div class="msg-keyboard-btn ${cls}" data-row="${rowIdx}" data-btn="${btnIdx}" data-msg-id="${msgId}" onclick="handleKeyboardButtonClick(this)">${label}</div>`;
                });
                html += `</div>`;
            });
            html += `</div>`;
            keyboardAttachCache[msgId] = {
                rows,
                callbackId: attach.callbackId || attach.callback_id || null,
            };
            return html;
        }

        const keyboardAttachCache = {};

        async function handleKeyboardButtonClick(el) {
            const msgId = el.dataset.msgId;
            const rowIdx = +el.dataset.row;
            const btnIdx = +el.dataset.btn;
            const cache = keyboardAttachCache[msgId];
            if (!cache) return;
            const row = Array.isArray(cache.rows[rowIdx]) ? cache.rows[rowIdx] : [cache.rows[rowIdx]];
            const btn = row[btnIdx];
            if (!btn) return;
            const type = normalizeButtonType(btn.type);

            if (type === 'LINK') {
                const url = btn.url;
                if (url) window.open(url, '_blank');
                return;
            }

            if (type === 'OPEN_APP') {
                const botId = btn.contactId ?? btn.contact_id ?? btn.botId ?? btn.bot_id;
                if (!botId) {
                    log('❌ Не удалось определить botId для мини-приложения', 'error');
                    return;
                }
                const deeplink = parseWebAppDeeplink(btn.webApp || btn.web_app || btn.url);
                await openMiniAppViaServer(botId, {
                    title: btn.text || 'Мини-приложение',
                    startParam: btn.payload || btn.startParam || btn.start_param || deeplink.startParam || '',
                    chatId: deeplink.chatId ?? currentChatId,
                });
                return;
            }

            if (type === 'REQUEST_CONTACT' || type === 'REQUEST_GEO_LOCATION') {
                log(`ℹ️ Кнопка "${type}" пока не реализована`, 'info');
                return;
            }

            const callbackId = cache.callbackId;
            if (!callbackId) {
                log('❌ У клавиатуры нет callbackId', 'error');
                return;
            }
            try {
                const res = await fetch('/api/button-callback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chatId: currentChatId,
                        messageId: msgId,
                        callbackId,
                        payload: btn.payload ?? btn.callback_data ?? btn.text ?? '',
                    }),
                });
                const answer = await res.json();
                if (!res.ok) throw new Error(answer.error || 'Ошибка callback');
                if (answer.url) {
                    window.open(answer.url, '_blank');
                    return;
                }
                if (answer.text) {
                    log('ℹ️ ' + answer.text, 'info');
                }
            } catch (e) {
                log('❌ ' + e.message, 'error');
            }
        }

        let miniAppBackHandler = null;
        let miniAppClosingConfirmation = false;

        async function openMiniAppViaServer(botId, meta) {
            try {
                const res = await fetch('/api/web-app-init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        botId,
                        startParam: meta?.startParam || undefined,
                        chatId: meta?.chatId ?? currentChatId,
                    }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Не удалось открыть мини-приложение');
                openMiniApp(data.url, meta);
            } catch (e) {
                log('❌ ' + e.message, 'error');
            }
        }

        function openMiniApp(url, meta) {
            if (url.includes('digital-id.max.ru')) {
                window.open(url, '_blank');
                return;
            }
            const overlay = document.getElementById('miniappOverlay');
            const iframe = document.getElementById('miniappIframe');
            const titleEl = document.getElementById('miniappTitle');
            titleEl.textContent = meta?.title || 'Мини-приложение';
            miniAppBackHandler = null;
            miniAppClosingConfirmation = false;
            document.getElementById('miniappBackBtn').classList.remove('visible');
            iframe.src = url;
            overlay.classList.remove('hidden');
            installMiniAppHostBridge(iframe, url, meta);
        }

        function closeMiniApp() {
            if (miniAppClosingConfirmation) {
                if (!confirm('Закрыть мини-приложение? Несохранённые данные будут потеряны.')) return;
            }
            const overlay = document.getElementById('miniappOverlay');
            const iframe = document.getElementById('miniappIframe');
            overlay.classList.add('hidden');
            iframe.src = 'about:blank';
            window.removeEventListener('message', miniAppMessageListener);
        }

        document.getElementById('miniappCloseBtn').onclick = closeMiniApp;
        document.getElementById('miniappBackBtn').onclick = () => {
            if (miniAppBackHandler) miniAppBackHandler();
        };

        let miniAppMessageListener = null;

        function installMiniAppHostBridge(iframe, launchUrl, meta) {
            if (miniAppMessageListener) {
                window.removeEventListener('message', miniAppMessageListener);
            }

            const serverInitData = extractWebAppDataFromUrl(launchUrl);
            const initDataUnsafe = {
                query_id: 'AA' + Date.now(),
                user: {
                    id: selfId,
                    first_name: contactsById[selfId]?.firstName || contactsById[selfId]?.name || '',
                    last_name: contactsById[selfId]?.lastName || '',
                },
                chat_instance: String(currentChatId || ''),
                start_param: meta?.startParam || '',
                auth_date: Math.floor(Date.now() / 1000),
            };
            const fallbackInitData = Object.entries(initDataUnsafe)
                .map(([k, v]) => `${k}=${encodeURIComponent(typeof v === 'object' ? JSON.stringify(v) : v)}`)
                .join('&');
            const initDataStr = serverInitData || fallbackInitData;

            function postToApp(eventType, eventData) {
                iframe.contentWindow?.postMessage(JSON.stringify({ eventType, eventData: eventData ?? {} }), '*');
            }

            miniAppMessageListener = (event) => {
                if (event.source !== iframe.contentWindow) return;
                let msg;
                try {
                    msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                } catch (e) {
                    return;
                }
                const { eventType, eventData } = msg || {};
                switch (eventType) {
                    case 'web_app_ready':
                        postToApp('viewport_changed', { height: iframe.clientHeight, is_expanded: true, is_state_stable: true });
                        break;
                    case 'web_app_request_theme':
                        postToApp('theme_changed', { theme_params: {} });
                        break;
                    case 'web_app_request_viewport':
                        postToApp('viewport_changed', { height: iframe.clientHeight, is_expanded: true, is_state_stable: true });
                        break;
                    case 'web_app_setup_back_button':
                        if (eventData?.is_visible) {
                            document.getElementById('miniappBackBtn').classList.add('visible');
                            miniAppBackHandler = () => postToApp('back_button_pressed');
                        } else {
                            document.getElementById('miniappBackBtn').classList.remove('visible');
                            miniAppBackHandler = null;
                        }
                        break;
                    case 'web_app_setup_closing_behavior':
                        miniAppClosingConfirmation = !!eventData?.need_confirmation;
                        break;
                    case 'web_app_open_link':
                        window.open(eventData?.url, '_blank');
                        break;
                    case 'web_app_open_max_link':
                    case 'web_app_open_tg_link':
                        window.open(eventData?.path_full || eventData?.url, '_blank');
                        break;
                    case 'web_app_close':
                        closeMiniApp();
                        break;
                    case 'web_app_data_send':
                        console.log('[maxclient] web_app_data_send:', eventData);
                        break;
                    case 'web_app_expand':
                    case 'web_app_set_header_color':
                    case 'web_app_set_background_color':
                        break;
                    case 'web_app_request_phone':
                    case 'web_app_request_write_access':
                    case 'web_app_invoke_custom_method':
                        postToApp(eventType + '_failed', { error: 'client.method_unavailable' });
                        break;
                    default:
                        console.log('[maxclient] неизвестное событие от мини-приложения:', eventType, eventData);
                }
            };
            window.addEventListener('message', miniAppMessageListener);

            iframe.onload = () => {
                if (!serverInitData) {
                    postToApp('set_init_data', { initData: initDataStr, initDataUnsafe, platform: 'web', version: '1.0' });
                }
            };
        }
        function updateComposerVisibility(chat) {
            const composer = document.getElementById('composerRow');
            const messageInput = document.getElementById('messageText');

            if (!composer || !chat) {
                if (composer) composer.classList.add('hidden');
                return;
            }

            // Скрываем, если юзер не авторизован
            if (!isAuthenticated()) {
                composer.classList.add('hidden');
                return;
            }

            // Основная проверка прав
            if (canWriteToChat(chat)) {
                composer.classList.remove('hidden');
                messageInput.disabled = false;
                messageInput.placeholder = 'Сообщение';
            } else {
                composer.classList.add('hidden');
                // Дополнительно можно заблокировать инпут, если он остался видим
                messageInput.disabled = true;
                messageInput.placeholder = 'Только чтение';
            }
        }

        // ========================================
        // ПОИСК ЛЮДЕЙ И ССЫЛКИ @username / max.ru/...
        // ========================================

        function normalizePhoneForSearch(raw) {
            const digits = (raw || '').replace(/[^\d]/g, '');
            if (digits.length < 5) return null;
            return '+' + digits;
        }

        // Открывает существующий или создаёт "виртуальный" личный чат с найденным
        // контактом. chatId для ещё не существующего диалога вычисляется как
        // XOR своего id и id собеседника — так же, как это делает Komet
        // (см. contact_profile_screen.dart: accountId ^ contactId).
        function openOrCreateDialogWithContact(contact) {
            if (!contact || typeof contact.id !== 'number' || !selfId) return;
            contactsById[contact.id] = contact;
            let chatId = null;
            for (const id in chatsById) {
                const c = chatsById[id];
                if (c.type === 'DIALOG' && otherParticipantId(c) === contact.id) {
                    chatId = c.id;
                    break;
                }
            }
            if (chatId == null) {
                chatId = selfId ^ contact.id;
                if (!chatsById[chatId]) {
                    chatsById[chatId] = {
                        id: chatId,
                        type: 'DIALOG',
                        participants: { [selfId]: 0, [contact.id]: 0 },
                    };
                }
            }
            openChat(chatId);
        }

        function contactNameFromPayload(contact) {
            const names = contact?.names;

            // Вывод всех вариантов имен из массива names в одну строку с пометками
            if (Array.isArray(names) && names.length) {
                const descriptions = names.map((n, i) => {
                    if (!n) return `[${i}]: null`;
                    return `[${i}]: name="${n.name || ''}" firstName="${n.firstName || ''}" lastName="${n.lastName || ''}"`;
                }).join(' | ');
                console.log(`[Contact ID: ${contact?.id}] Все имена: ${descriptions}`);
            } else {
                console.log(`[Contact ID: ${contact?.id}] Массив names пуст или отсутствует`);
            }

            if (Array.isArray(names) && names.length) {
                // Ищем объект, где есть хотя бы имя или фамилия. Если нет — берем первый элемент.
                const n = names.find(x => x && (x.firstName || x.lastName || x.name)) || names[0];

                // Формируем full строго как firstName + lastName. Если их нет, используем n.name.
                const full = `${n.firstName || ''} ${n.lastName || ''}`.trim() || n.name || '';

                if (full) return full;
            }
            return 'Контакт #' + contact?.id;
        }

        function handleLinkResolved(payload) {

                const chat = payload.chat;
                chatsById[chat.id] = chatsById[chat.id] || chat;
