        function chatPreview(chat) {
            const draft = getDrafts()[chat.id];
            if (draft) return `✏️ Черновик: ${escapeHtml(draft.slice(0, 80))}`;
            const m = chat.lastMessage;
            if (!m) return '';
            const isTranslationKey = m.text && /^[a-z0-9]+(\.[a-z0-9]+)+$/i.test(m.text);
            const attach = m.attaches?.[0];
            if (attach?._type === 'CONTROL') {
                return attach.message || attach.shortMessage || 'Системное событие';
            }
            if (attach?._type === 'VIDEO') {
                return '🎬 Видео';
            }
            if (m.text && !isTranslationKey) return m.text.slice(0, 80);
            if (attach) {
                const labels = {
                    PHOTO: '🖼️ Фото',
                    VIDEO: '🎬 Видео',
                    FILE: '📎 ' + (attach.name || 'Файл'),
                    CALL: attach.callType === 'VIDEO' ? '📞 Видеозвонок' : '📞 Звонок',
                };
                return labels[attach._type] || `[${attach._type}]`;
            }
            return '';
        }

        function buildStatusTicksHtml(m, chat) {
            try {
                if (chat?.type !== 'DIALOG') {
                    return '<span class="msg-status sent">✓</span>';
                }
                const otherId = otherParticipantId(chat);
                if (!otherId) return '<span class="msg-status sent">✓</span>';
                const info = chat?.participants?.[otherId];
                let otherLastRead = null;
                if (typeof info === 'number' || typeof info === 'string') {
                    otherLastRead = info;
                } else if (info && typeof info === 'object') {
                    otherLastRead = info.lastReadMessageId ?? info.mark ?? info.readMark ?? null;
                }
                if (otherLastRead == null && chat?.readMarks) {
                    otherLastRead = chat.readMarks[otherId] || null;
                }
                if (otherLastRead != null) {
                    try {
                        if (BigInt(m.id) <= BigInt(otherLastRead)) {
                            return '<span class="msg-status read">✓✓</span>';
                        }
                    } catch (e) { }
                }
                return '<span class="msg-status sent">✓</span>';
            } catch (err) {
                return '<span class="msg-status sent">✓</span>';
            }
        }

        function buildReactionsHtml(m) {
            try {
                const counts = m.reactionInfo?.counters || [];
                let badges = '';
                if (Array.isArray(counts)) {
                    counts.forEach(r => {
                        const emoji = r.reaction || '👍';
                        const count = r.count ?? 1;
                        badges +=
                            `<span class="reaction-badge" data-emoji="${escapeHtml(emoji)}">${emoji} ${count}</span>`;
                    });
                }
                return badges ? `<div class="msg-reactions">${badges}</div>` : '';
            } catch (err) {
                return '';
            }
        }

        function createMessageElement(m) {
            const el = document.createElement('div');
            const isOwn = m.sender === selfId;
            el.className = 'msg-bubble' + (isOwn ? ' own' : '');
            el.dataset.msgId = m.id;
            let attachesHtml = '';
            (m.attaches || []).forEach(a => {
                if (a._type === 'PHOTO') {
                    let src = a.baseRawUrl || a.baseUrl;
                    if (src) src = '/img?url=' + encodeURIComponent(src);
                    if (!src && a.previewData) {
                        src = hexPreviewToDataUrl(a.previewData);
                    }
                    if (src) {
                        attachesHtml +=
                            `<div class="msg-attach"><img class="msg-img" src="${src}" alt="Фото" loading="lazy" onerror="this.style.display='none'" onclick="openPhotoViewer('${src}', '${m.id}')"></div>`;
                    } else {
                        attachesHtml += `<div class="msg-attach msg-file">🖼️ Фото (недоступно)</div>`;
                    }
                    return;
                }
                if (a._type === 'VIDEO') {
                    attachesHtml += `<div class="msg-attach">${createVideoPreview(m.id, currentChatId, a)}</div>`;
                    return;
                }
                if (a._type === 'FILE') {
                    const fileName = a.name || 'файл';
                    attachesHtml += `<div class="msg-attach msg-file">📎 ${escapeHtml(fileName)}</div>`;
                    return;
                }
                if (a._type === 'CALL') {
                    attachesHtml +=
                        `<div class="msg-attach msg-file">📞 ${a.callType === 'VIDEO' ? 'Видеозвонок' : 'Звонок'}</div>`;
                    return;
                }
                if (a._type === 'CONTROL') {
                    const text = a.message || a.shortMessage || 'Системное событие';
                    attachesHtml +=
                        `<div class="msg-attach" style="text-align:center;color:#888;font-size:12px;">${escapeHtml(text)}</div>`;
                    return;
                }
                if (a._type === 'INLINE_KEYBOARD' || a._type === 'KEYBOARD') {
                    attachesHtml += renderKeyboardAttach(a, m.id);
                    return;
                }
                // Неизвестный тип attach — не рендерим, но логируем, чтобы можно было
                // опознать реальное имя типа (например для клавиатуры бота) по живому трафику
                // и добавить обработчик выше.
                console.log('[maxclient] неизвестный attach._type:', a._type, a);
            });
            const isTranslationKey = m.text && /^[a-z0-9]+(\.[a-z0-9]+)+$/i.test(m.text);
            const hasControlAttach = (m.attaches || []).some(a => a._type === 'CONTROL');
            let textHtml = '';
            if (m.text && !(isTranslationKey && hasControlAttach)) {
                textHtml = `<div class="msg-text">${escapeHtml(m.text)}</div>`;
            }
            const time = m.time ? new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
            const chat = chatsById[currentChatId];
            const statusHtml = isOwn ? buildStatusTicksHtml(m, chat) : '';
            const timeHtml = `<div class="msg-time">${time}${statusHtml}</div>`;
            const reactionsHtml = buildReactionsHtml(m);
            el.innerHTML = attachesHtml + textHtml + reactionsHtml + timeHtml;
            return el;
        }

        // ========================================
        // БОТЫ: клавиатура (inline_keyboard) и мини-приложения (WebApp)
        // ========================================
        //
        // Схема кнопок ориентируется на официальный Bot API MAX (dev.max.ru),
        // т.к. приватный протокол мессенджера почти наверняка использует ту же
        // модель данных. Точные имена полей у приватного протокола не подтверждены
        // статическим анализом APK — код написан защитно (проверяет несколько
        // возможных путей к массиву кнопок) и логирует непонятные структуры,
        // чтобы их можно было быстро доопределить по реальному трафику.
        function renderKeyboardAttach(attach, msgId) {
            const rows = attach.buttons || attach.payload?.buttons || attach.keyboard?.buttons || [];
            if (!Array.isArray(rows) || !rows.length) {
                console.log('[maxclient] клавиатура без кнопок, структура:', attach);
                return '';
            }
            let html = `<div class="msg-keyboard" data-msg-id="${msgId}">`;
            rows.forEach((row, rowIdx) => {
                const buttons = Array.isArray(row) ? row : [row];
                html += `<div class="msg-keyboard-row">`;
                buttons.forEach((btn, btnIdx) => {
                    const type = btn.type || 'callback';
                    const label = escapeHtml(btn.text || btn.label || '...');
                    const cls = type === 'link' || type === 'open_app' ? 'link-btn' : '';
                    // Кнопку описываем данными в data-*, а не инлайн JS с сериализацией текста,
                    // чтобы не ловить проблемы с экранированием кавычек в url/payload.
                    html += `<div class="msg-keyboard-btn ${cls}" data-row="${rowIdx}" data-btn="${btnIdx}" data-msg-id="${msgId}" onclick="handleKeyboardButtonClick(this)">${label}</div>`;
                });
                html += `</div>`;
            });
            html += `</div>`;
            // Кэшируем сырые данные кнопок, чтобы достать их по клику без повторного парсинга DOM
            keyboardAttachCache[msgId] = rows;
            return html;
        }

        const keyboardAttachCache = {};

        function handleKeyboardButtonClick(el) {
            const msgId = el.dataset.msgId;
            const rowIdx = +el.dataset.row;
            const btnIdx = +el.dataset.btn;
            const rows = keyboardAttachCache[msgId];
            if (!rows) return;
            const row = Array.isArray(rows[rowIdx]) ? rows[rowIdx] : [rows[rowIdx]];
            const btn = row[btnIdx];
            if (!btn) return;
            const type = btn.type || 'callback';
            if (type === 'link') {
                window.open(btn.url, '_blank');
                return;
            }
            if (type === 'open_app') {
                const url = btn.url || btn.webApp?.url || btn.web_app?.url;
                if (!url) {
                    console.log('[maxclient] у кнопки open_app нет url:', btn);
                    return;
                }
                openMiniApp(url, {
                    title: btn.text || 'Мини-приложение',
                    startParam: btn.startParam || btn.start_param || '',
                    botId: btn.botId || btn.bot_id || null,
                });
                return;
            }
            if (type === 'request_contact' || type === 'request_geo_location') {
                console.log(`[maxclient] кнопка "${type}" пока не реализована на клиенте`);
                return;
            }
            // callback / message — обычная кнопка, шлём payload обратно как нажатие.
            // Опкод для callback-ответа боту не подтверждён (нет в статическом анализе) —
            // подставь реальный, когда увидишь его в трафике. Пока просто логируем намерение.
            console.log('[maxclient] нажатие кнопки (callback), нужно отправить боту:', {
                msgId, chatId: currentChatId, payload: btn.payload ?? btn.callback_data ?? btn.text,
            });
        }

        // --- Мини-приложение: overlay + iframe + хост-мост window.WebApp ---
        let miniAppBackHandler = null;
        let miniAppClosingConfirmation = false;

        function openMiniApp(url, meta) {
            const overlay = document.getElementById('miniappOverlay');
            const iframe = document.getElementById('miniappIframe');
            const titleEl = document.getElementById('miniappTitle');
            titleEl.textContent = meta?.title || 'Мини-приложение';
            miniAppBackHandler = null;
            miniAppClosingConfirmation = false;
            document.getElementById('miniappBackBtn').classList.remove('visible');
            let fullUrl = url;
            if (meta?.startParam) {
                fullUrl += (url.includes('?') ? '&' : '?') + 'startapp=' + encodeURIComponent(meta.startParam);
            }
            iframe.src = fullUrl;
            overlay.classList.remove('hidden');
            installMiniAppHostBridge(iframe, meta);
        }

        function closeMiniApp() {
            if (miniAppClosingConfirmation) {
                if (!confirm('Закрыть мини-приложение? Несохранённые данные будут потеряны.')) return;
            }
            const overlay = document.getElementById('miniappOverlay');
            const iframe = document.getElementById('miniappIframe');
            overlay.classList.add('hidden');
            iframe.src = 'about:blank';
            window.removeEventListener('message', miniAppMessageListener);
        }

        document.getElementById('miniappCloseBtn').onclick = closeMiniApp;
        document.getElementById('miniappBackBtn').onclick = () => {
            if (miniAppBackHandler) miniAppBackHandler();
        };

        let miniAppMessageListener = null;

        // ВАЖНО: это реализация "по аналогии" с открытой моделью Telegram WebApp
        // (та же схема HMAC-валидации initData подтверждена сторонними источниками
        // как идентичная у MAX), а НЕ подтверждённый реверс-инжинирингом протокол
        // моста MAX (max-web-app.js закрыт для автоматического скачивания — robots.txt).
        // Поэтому:
        //   1) initData здесь собран из данных нашей уже авторизованной сессии, но
        //      БЕЗ настоящей подписи (hash) — её может посчитать только сервер бота,
        //      зная секретный token бота, которого у нас нет и быть не может.
        //      Мини-приложения, которые на своём бэкенде строго проверяют hash,
        //      с этим мостом не заработают "по-настоящему" (не пройдут валидацию),
        //      но UI большинства мини-приложений всё равно должен отрисоваться.
        //   2) Набор событий (eventType) ниже — стандартный минимум, который есть
        //      почти в любой такой библиотеке. Всё, что реально пришлёт конкретное
        //      мини-приложение и на что нет ответа, будет видно в консоли
        //      (см. else-ветку) — так проще всего дополнить список по факту.
        function installMiniAppHostBridge(iframe, meta) {
            if (miniAppMessageListener) {
                window.removeEventListener('message', miniAppMessageListener);
            }
            const initDataUnsafe = {
                query_id: 'AA' + Date.now(),
                user: {
                    id: selfId,
                    first_name: contactsById[selfId]?.firstName || contactsById[selfId]?.name || '',
                    last_name: contactsById[selfId]?.lastName || '',
                },
                chat_instance: String(currentChatId || ''),
                start_param: meta?.startParam || '',
                auth_date: Math.floor(Date.now() / 1000),
            };
            // Строка initData без hash (см. комментарий выше) — сериализуем то, что есть
            const initDataStr = Object.entries(initDataUnsafe)
                .map(([k, v]) => `${k}=${encodeURIComponent(typeof v === 'object' ? JSON.stringify(v) : v)}`)
                .join('&');

            function postToApp(eventType, eventData) {
                iframe.contentWindow?.postMessage(JSON.stringify({ eventType, eventData: eventData ?? {} }), '*');
            }

            miniAppMessageListener = (event) => {
                if (event.source !== iframe.contentWindow) return;
                let msg;
                try {
                    msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                } catch (e) {
                    return;
                }
                const { eventType, eventData } = msg || {};
                switch (eventType) {
                    case 'web_app_ready':
                        postToApp('viewport_changed', { height: iframe.clientHeight, is_expanded: true, is_state_stable: true });
                        break;
                    case 'web_app_request_theme':
                        postToApp('theme_changed', { theme_params: {} });
                        break;
                    case 'web_app_request_viewport':
                        postToApp('viewport_changed', { height: iframe.clientHeight, is_expanded: true, is_state_stable: true });
                        break;
                    case 'web_app_setup_back_button':
                        if (eventData?.is_visible) {
                            document.getElementById('miniappBackBtn').classList.add('visible');
                            miniAppBackHandler = () => postToApp('back_button_pressed');
                        } else {
                            document.getElementById('miniappBackBtn').classList.remove('visible');
                            miniAppBackHandler = null;
                        }
                        break;
                    case 'web_app_setup_closing_behavior':
                        miniAppClosingConfirmation = !!eventData?.need_confirmation;
                        break;
                    case 'web_app_open_link':
                        window.open(eventData?.url, '_blank');
                        break;
                    case 'web_app_open_max_link':
                    case 'web_app_open_tg_link':
                        window.open(eventData?.path_full || eventData?.url, '_blank');
                        break;
                    case 'web_app_close':
                        closeMiniApp();
                        break;
                    case 'web_app_data_send':
                        // Мини-приложение отправляет данные обратно боту — по офиц. схеме это
                        // должно уйти в чат как служебное сообщение. Опкод не подтверждён,
                        // логируем, чтобы можно было домаппить на реальный вызов send(...).
                        console.log('[maxclient] web_app_data_send:', eventData);
                        break;
                    case 'web_app_expand':
                    case 'web_app_set_header_color':
                    case 'web_app_set_background_color':
                        // Косметика, безопасно игнорировать
                        break;
                    case 'web_app_request_phone':
                    case 'web_app_request_write_access':
                    case 'web_app_invoke_custom_method':
                        // Требуют реальной подписи/нативного UI, которого у нас нет —
                        // отвечаем ошибкой в формате, близком к официальному
                        postToApp(eventType + '_failed', { error: 'client.method_unavailable' });
                        break;
                    default:
                        console.log('[maxclient] неизвестное событие от мини-приложения:', eventType, eventData);
                }
            };
            window.addEventListener('message', miniAppMessageListener);

            iframe.onload = () => {
                postToApp('set_init_data', { initData: initDataStr, initDataUnsafe, platform: 'web', version: '1.0' });
            };
        }

        function openChat(chatId) {
            const chat = chatsById[chatId];
            if (!chat) return;
            currentChatId = chatId;
            document.getElementById('chatsSection').classList.add('hidden');
            document.getElementById('chatDetailSection').classList.remove('hidden');
            document.getElementById('chatDetailName').innerHTML = chatDisplayName(chat);
            document.getElementById('chatDetailStatus').textContent = '';
            document.getElementById('chatIdLabel').textContent = 'ID: ' + chatId;
            const avatarUrl = chatAvatarUrl(chat);
            const initial = chatDisplayName(chat).charAt(0).toUpperCase();
            let avatarHtml;
            if (avatarUrl) {
                avatarHtml = `<img src="${avatarUrl}" alt="" loading="lazy" onerror="handleAvatarError(this)">`;
            } else {
                avatarHtml = initial;
            }
            const avatarContainer = document.getElementById('chatDetailAvatar');
            avatarContainer.innerHTML = avatarHtml;
            avatarContainer.dataset.initials = initial;
            const list = document.getElementById('messagesList');
            list.innerHTML = '';
            earliestMessageTime = null;
            isLoadingMore = false;
            document.getElementById('messageText').value = getDrafts()[chatId] || '';
            send(49, { chatId, from: Date.now() + 86400000, forward: 0, backward: 10, getMessages: true });
        }

        function renderMessages(payload, prepend) {
            const list = document.getElementById('messagesList');
            const existingIds = new Set();
            list.querySelectorAll('.msg-bubble[data-msg-id]').forEach(el => {
                existingIds.add(el.dataset.msgId);
            });
            const messages = (payload.messages || []).slice().sort((a, b) => (a.time || 0) - (b.time || 0));
            const newMessages = messages.filter(m => !existingIds.has(String(m.id)));

            if (newMessages.length === 0) {
                isLoadingMore = false;
                return;
            }

            const batchMinTime = Math.min(...newMessages.map(m => m.time || Infinity));
            if (earliestMessageTime == null || batchMinTime < earliestMessageTime) {
                earliestMessageTime = batchMinTime;
            }

            if (prepend) {
                const prevScrollHeight = list.scrollHeight;
                const prevScrollTop = list.scrollTop;
                const frag = document.createDocumentFragment();
                newMessages.forEach(m => frag.appendChild(createMessageElement(m)));
                list.insertBefore(frag, list.firstChild);
                // Сохраняем позицию скролла, чтобы подгрузка не "прыгала" вниз
                list.scrollTop = prevScrollTop + (list.scrollHeight - prevScrollHeight);
                isLoadingMore = false;
            } else {
                newMessages.forEach(m => list.appendChild(createMessageElement(m)));
                list.scrollTop = list.scrollHeight;
            }
        }

        document.getElementById('messagesList').addEventListener('scroll', function () {
            if (this.scrollTop < 50 && !isLoadingMore && earliestMessageTime != null && currentChatId != null) {
                isLoadingMore = true;
                send(49, {
                    chatId: currentChatId,
                    from: earliestMessageTime - 1,
                    forward: 0,
                    backward: 10,
                    getMessages: true,
                });
            }
        });

        function connect() {
            if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
                log('❌ Достигнут лимит попыток переподключения', 'error');
                setStatus('Connection lost', 'error');
                return;
            }
            log('Подключение... (попытка ' + (reconnectAttempts + 1) + ')');
            setStatus('Подключение...', 'info');
            ws = new WebSocket(`ws://${window.location.host}/relay`);
            ws.onopen = () => {
                isConnected = true;
                reconnectAttempts = 0;
                setStatus('Подключено', 'success');
                document.getElementById('connectionBadge').textContent = 'Online';
                document.getElementById('connectionBadge').className = 'badge online';
                log('✅ Подключено');
                if (pingInterval) clearInterval(pingInterval);
                pingInterval = setInterval(() => {
                    if (isConnected && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ opcode: 0, payload: {} }));
                    }
                }, 25000);
            };
            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.opcode === 0 && data.payload?.pong) return;
                    if (data.type === 'connected') { log(`✅ ${data.message}`, 'success'); return; }
                    if (data.type === 'session_restored') {
                        log(`✅ ${data.message}`, 'success');
                        setStatus('Авторизован', 'success');
                        showAuthenticatedUI();
                        send(19, { chatsSync: 0, contactsSync: 0, interactive: true });
                        return;
                    }
                    if (data.type === 'auth_required') {
                        log('🔒 Требуется авторизация', 'info');
                        showLoginUI();
                        return;
                    }
                    if (data._auth_error ||
                        (data.opcode === 19 && data.cmd === 768 &&
                            data.payload?.localizedMessage?.includes('авторизируйтесь'))) {
                        log('❌ Сессия истекла. Требуется повторная авторизация.', 'error');
                        setStatus('Сессия истекла', 'error');
                        showLoginUI();
                        document.getElementById('connectionBadge').className = 'badge auth-error';
                        document.getElementById('connectionBadge').textContent = 'Auth Error';
                        return;
                    }
                    if (data.cmd === 768) {
                        const err = data.payload?.localizedMessage || data.payload?.error || 'Ошибка';
                        log(`❌ ${err}`, 'error');
                        setStatus(`Ошибка: ${err}`, 'error');
                        return;
                    }
                    if (data.opcode === 17 && data.cmd === 256) {
                        otpToken = data.payload.token;
                        log('✅ Код отправлен!', 'success');
                        document.getElementById('authStatus').textContent = '✅ Код отправлен. Введите код из SMS.';
                        startResendTimer(60);
                        return;
                    }
                    if (data.opcode === 18 && data.cmd === 256) {
                        if (data.payload?.passwordChallenge) {
                            const pc = data.payload.passwordChallenge;
                            document.getElementById('passwordSection').classList.remove('hidden');
                            document.getElementById('passwordHint').textContent = '💡 Подсказка: ' + (pc.hint || '');
                            document.getElementById('passwordEmail').textContent = '📧 ' + (pc.email || '');
                            document.getElementById('authStatus').textContent = '🔒 Требуется ввод пароля';
                            log('🔒 Требуется ввод пароля', 'info');
                            return;
                        }
                        log('✅ Авторизация успешна!', 'success');
                        setStatus('Авторизован', 'success');
                        showAuthenticatedUI();
                        send(19, { chatsSync: 0, contactsSync: 0, interactive: true });
                        return;
                    }
                    if (data.opcode === 20 && data.cmd === 256) {
                        log('✅ Авторизация с паролем успешна!', 'success');
                        setStatus('Авторизован', 'success');
                        showAuthenticatedUI();
                        document.getElementById('passwordSection').classList.add('hidden');
                        document.getElementById('password').value = '';
                        send(19, { chatsSync: 0, contactsSync: 0, interactive: true });
                        return;
                    }
                    if (data.opcode === 19 && data.cmd === 256) {
                        renderChats(data.payload);
                        return;
                    }
                    if (data.opcode === 49 && data.cmd === 256) {
                        renderMessages(data.payload, isLoadingMore);
                        return;
                    }
                    if (data.opcode === 64 && data.cmd === 256) {
                        document.getElementById('messageText').value = '';
                        send(49, {
                            chatId: currentChatId, from: Date.now() + 86400000, forward: 0, backward: 50,
                            getMessages: true
                        });
                        return;
                    }
                    if (data.opcode === 130 && data.payload) {
                        const p = data.payload;
                        if (p.chatId != null && p.userId != null && p.mark != null) {
                            const chat = chatsById[p.chatId];
                            if (chat) {
                                if (!chat.participants) chat.participants = {};
                                chat.participants[p.userId] = p.mark;
                                if (p.chatId === currentChatId) {
                                    document.querySelectorAll('#messagesList .msg-bubble.own').forEach(bubble => {
                                        const msgId = bubble.dataset.msgId;
                                        const statusEl = bubble.querySelector('.msg-status');
                                        if (statusEl && msgId != null) {
                                            try {
                                                if (BigInt(msgId) <= BigInt(p.mark)) {
                                                    statusEl.outerHTML =
                                                        '<span class="msg-status read">✓✓</span>';
                                                }
                                            } catch (e) { }
                                        }
                                    });
                                }
                            }
                        }
                        return;
                    }
                    if (data.opcode === 132 && data.payload) {
                        const uid = data.payload.userId;
                        const p = data.payload.presence;
                        if (uid != null && p) {
                            presenceById[uid] = { online: p.status === 1, seen: p.seen || 0 };
                            if (currentChatId) {
                                const chat = chatsById[currentChatId];
                                if (chat && chat.type === 'DIALOG' && otherParticipantId(chat) == uid) {
                                    const statusEl = document.getElementById('chatDetailStatus');
                                    if (statusEl) {
                                        statusEl.textContent = p.status === 1 ? 'в сети' : 'был(а) в сети';
                                        statusEl.style.color = p.status === 1 ? '#4caf50' : '#888';
                                    }
                                }
                            }
                        }
                        return;
                    }

                    // notifMessage — новое входящее сообщение в реальном времени
                    if (data.opcode === 128 && data.payload) {
                        const msg = data.payload.message || data.payload;
                        const chatId = data.payload.chatId ?? msg.chatId;
                        if (chatId == null) return;

                        if (chatsById[chatId]) {
                            chatsById[chatId].lastMessage = msg;
                            chatsById[chatId].lastEventTime = msg.time || Date.now();
                        }

                        const chatDetailOpen = !document.getElementById('chatDetailSection').classList.contains('hidden');
                        if (chatId === currentChatId && chatDetailOpen) {
                            const el = createMessageElement(msg);
                            document.getElementById('messagesList').appendChild(el);
                            document.getElementById('messagesList').scrollTop = document.getElementById('messagesList').scrollHeight;
                        } else if (msg.sender !== selfId) {
                            // Чат не открыт — показываем системное уведомление
                            const chat = chatsById[chatId];
                            const senderName = chat ? chatDisplayName(chat) : 'Новое сообщение';
                            if ('Notification' in window && Notification.permission === 'granted') {
                                const n = new Notification(senderName, {
                                    body: msg.text || '📎 Вложение',
                                    icon: chat ? (chatAvatarUrl(chat) || undefined) : undefined,
                                });
                                n.onclick = () => {
                                    window.focus();
                                    if (chatsById[chatId]) openChat(chatId);
                                };
                            }
                        }
                        return;
                    }
                } catch (err) {
                    console.error('[ws error]', err);
                }
            };
            ws.onclose = () => {
                isConnected = false;
                if (pingInterval) clearInterval(pingInterval);
                setStatus('Отключено', 'error');
                document.getElementById('connectionBadge').textContent = 'Offline';
                document.getElementById('connectionBadge').className = 'badge offline';
                log('🔌 Отключено', 'error');
                const delay = 300;
                reconnectAttempts++;
                if (reconnectAttempts <= MAX_RECONNECT_ATTEMPTS) {
                    log('🔄 Переподключение...', 'info');
                    if (reconnectTimer) clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(connect, delay);
                } else {
                    log('❌ Достигнут лимит попыток переподключения', 'error');
                }
            };
        }

        // ========================================
        // SETTINGS FUNCTIONS
        // ========================================

        function loadSettingsVars() {
            try { return JSON.parse(localStorage.getItem('maxclient_settings_vars') || '{}'); } catch (e) { return {}; }
        }

        function applySettingsVars(vars) {
            Object.entries(vars).forEach(([k, v]) => {
                document.documentElement.style.setProperty('--' + k, v);
            });
        }

        function addSettingRow(key = '', value = '') {
            const container = document.getElementById('settingsRowsContainer');
            if (!container) return;
            const empty = container.querySelector('.settings-empty');
            if (empty) empty.remove();
            const row = document.createElement('div');
            row.className = 'settings-row';
            row.innerHTML = `
            <input class="setting-key" placeholder="Название" value="${escapeHtml(key)}">
            <input class="setting-value" placeholder="Значение" value="${escapeHtml(value)}">
        `;
            container.appendChild(row);
            settingsMenu.refreshPage('vars');
        }

        function saveSettings() {
            const vars = {};
            document.querySelectorAll('#page-vars .settings-row').forEach(row => {
                const k = row.querySelector('.setting-key').value.trim();
                const v = row.querySelector('.setting-value').value.trim();
                if (k) vars[k] = v;
            });
            localStorage.setItem('maxclient_settings_vars', JSON.stringify(vars));
            applySettingsVars(vars);
            log('✅ Настройки сохранены', 'success');
            settingsMenu.refreshPage('vars');
        }

        // ========================================
        // SETTINGS MODAL CONTROL
        // ========================================

        function openSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            settingsMenu.refreshAll();
        }

        function closeSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('settingsModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeSettingsModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('settingsModal').classList.contains('active')) {
                closeSettingsModal();
            }
        });

        // ========================================
        // АУТЕНТИФИКАЦИЯ
        // ========================================

        document.getElementById('requestOtp').onclick = async () => {
            const phone = document.getElementById('phone').value.trim().replace(/[\s\-\(\)]/g, '');
            if (!phone || phone === '+7') {
                log('❌ Введите номер телефона', 'error');
                return;
            }
            phoneNumber = phone;
            document.getElementById('authStatus').textContent = '⏳ Отправляю код...';
            try {
                const res = await fetch('/api/start-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();
                if (data.success) {
                    log('✅ Код отправлен', 'success');
                    document.getElementById('authStatus').textContent = '✅ Код отправлен. Введите код из SMS.';
                    startResendTimer(60);
                    return;
                } else {
                    log('⚠️ ' + (data.error || 'Неизвестная ошибка'), 'info');
                }
            } catch (e) {
                log('⚠️ API недоступен, использую WebSocket', 'info');
            }
            if (isConnected) {
                send(17, { phone, type: 'START_AUTH' });
                document.getElementById('authStatus').textContent = '⏳ Отправляю код через WebSocket...';
            } else {
                log('❌ Нет соединения', 'error');
                document.getElementById('authStatus').textContent = '❌ Нет соединения с сервером';
            }
        };

        document.getElementById('verifyCode').onclick = async () => {
            const code = document.getElementById('code').value.trim();
            if (!code) {
                log('❌ Введите код', 'error');
                return;
            }
            document.getElementById('authStatus').textContent = '⏳ Проверяю код...';
            try {
                const res = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await res.json();
                if (data.needPassword) {
                    document.getElementById('passwordSection').classList.remove('hidden');
                    document.getElementById('passwordHint').textContent = '💡 Подсказка: ' + (data.hint || '');
                    document.getElementById('passwordEmail').textContent = '📧 ' + (data.email || '');
                    document.getElementById('authStatus').textContent = '🔒 Требуется ввод пароля';
                    log('🔒 Требуется ввод пароля', 'info');
                    return;
                }
                if (data.success) {
                    log('✅ Авторизация успешна!', 'success');
                    setStatus('Авторизован', 'success');
                    showAuthenticatedUI();
                    if (isConnected) {
                        send(19, { chatsSync: 0, contactsSync: 0, interactive: true });
                    }
                    return;
                } else {
                    log('❌ Ошибка: ' + (data.error || 'Неверный код'), 'error');
                    document.getElementById('authStatus').textContent = '❌ ' + (data.error || 'Неверный код');
                    return;
                }
            } catch (e) {
                log('⚠️ API недоступен, использую WebSocket', 'info');
            }
            if (!otpToken) {
                log('❌ Сначала запросите код', 'error');
                document.getElementById('authStatus').textContent = '❌ Сначала запросите код';
                return;
            }
            if (isConnected) {
                send(18, {
                    token: otpToken,
                    verifyCode: code,
                    authTokenType: 'CHECK_CODE',
                    phone: phoneNumber
                });
                document.getElementById('authStatus').textContent = '⏳ Проверяю код через WebSocket...';
            } else {
                log('❌ Нет соединения', 'error');
                document.getElementById('authStatus').textContent = '❌ Нет соединения с сервером';
            }
        };

        document.getElementById('verifyPassword').onclick = async () => {
            const password = document.getElementById('password').value.trim();
            if (!password) {
                log('❌ Введите пароль', 'error');
                return;
            }
            document.getElementById('authStatus').textContent = '⏳ Проверяю пароль...';
            try {
                const res = await fetch('/api/verify-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    log('✅ Пароль принят!', 'success');
                    document.getElementById('passwordSection').classList.add('hidden');
                    document.getElementById('password').value = '';
                    document.getElementById('authStatus').textContent = '✅ Вход выполнен!';
                    setTimeout(() => {
                        setStatus('Переподключение...', 'info');
                        showAuthenticatedUI();
                        if (ws) ws.close();
                    }, 1000);
                } else if (data.needPassword) {
                    document.getElementById('passwordHint').textContent = '💡 Подсказка: ' + (data.hint || '');
                    document.getElementById('authStatus').textContent = '❌ ' + (data.error || 'Неверный пароль');
                    document.getElementById('password').value = '';
                    log('❌ Неверный пароль', 'error');
                } else {
                    log('❌ Ошибка: ' + (data.error || 'Неверный пароль'), 'error');
                    document.getElementById('authStatus').textContent = '❌ ' + (data.error || 'Неверный пароль');
                }
            } catch (e) {
                log('❌ Ошибка соединения', 'error');
            }
        };

        async function handleResendCode() {
            const phone = document.getElementById('phone').value.trim().replace(/[\s\-\(\)]/g, '');
            if (!phone || phone === '+7') {
                log('❌ Введите номер телефона', 'error');
                return;
            }
            document.getElementById('authStatus').textContent = '⏳ Отправляю код повторно...';
            startResendTimer(60);
            try {
                const res = await fetch('/api/resend-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();
                if (data.success) {
                    log('✅ Код отправлен повторно', 'success');
                    document.getElementById('authStatus').textContent = '✅ Код отправлен повторно. Проверьте SMS.';
                    return;
                }
            } catch (e) {
                log('⚠️ API resend failed, using WebSocket', 'info');
            }
            if (isConnected) {
                send(17, { phone, type: 'START_AUTH' });
            }
        }

        document.getElementById('resendCode').onclick = handleResendCode;

        let resendTimer = null;
        let resendSeconds = 0;

        function startResendTimer(seconds = 60) {
            const btn = document.getElementById('resendCode');
            resendSeconds = seconds;
            btn.disabled = true;
            if (resendTimer) clearInterval(resendTimer);
            resendTimer = setInterval(() => {
                resendSeconds--;
                if (resendSeconds <= 0) {
                    clearInterval(resendTimer);
                    btn.disabled = false;
                    btn.textContent = 'Повторно';
                    btn.style.background = '#6c757d';
                } else {
                    btn.textContent = `Повторно (${resendSeconds}с)`;
                    btn.style.background = '#adb5bd';
                }
            }, 1000);
        }

        function handleLogout() {
            if (confirm('Вы уверены, что хотите выйти из аккаунта?')) {
                logout();
                closeSettingsModal();
            }
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
            } catch (e) { }
            selfId = null;
            contactsById = {};
            chatsById = {};
            currentChatId = null;
            otpToken = null;
            phoneNumber = '';
            showLoginUI();
            log('👋 Вы вышли из аккаунта', 'info');
            setStatus('Отключено', 'info');
            document.getElementById('connectionBadge').className = 'badge offline';
            document.getElementById('connectionBadge').textContent = 'Offline';
            settingsMenu.refreshAll();
        }

        document.getElementById('backBtn').onclick = () => {
            currentChatId = null;
            document.getElementById('chatDetailSection').classList.add('hidden');
            document.getElementById('chatsSection').classList.remove('hidden');
        };

        document.getElementById('sendMessageBtn').onclick = () => {
            const text = document.getElementById('messageText').value.trim();
            if (!text || !currentChatId) return;
            send(64, { chatId: currentChatId, message: { text, cid: Date.now(), attaches: [] }, notify: true });
            document.getElementById('messageText').value = '';
            saveDraft(currentChatId, '');
        };

        document.getElementById('messageText').addEventListener('input', (e) => {
            if (currentChatId) saveDraft(currentChatId, e.target.value);
        });

        function getDrafts() {
            try {
                return JSON.parse(localStorage.getItem('maxclient_drafts') || '{}');
            } catch (e) {
                return {};
            }
        }

        function saveDraft(chatId, text) {
            const drafts = getDrafts();
            if (text) {
                drafts[chatId] = text;
            } else {
                delete drafts[chatId];
            }
            localStorage.setItem('maxclient_drafts', JSON.stringify(drafts));
        }

        document.querySelectorAll('input').forEach(el => {
            el.onkeypress = (e) => {
                if (e.key === 'Enter') {
                    const map = {
                        phone: 'requestOtp',
                        code: 'verifyCode',
                        password: 'verifyPassword',
                        messageText: 'sendMessageBtn'
                    };
                    document.getElementById(map[el.id])?.click();
                }
            };
        });

        function getAutoreplySettings(chatId) {
            try {
                const all = JSON.parse(localStorage.getItem('maxclient_autoreply') || '{}');
                return all[chatId] || { enabled: false, text: '', firstReplySent: false };
            } catch (e) { return { enabled: false, text: '', firstReplySent: false }; }
        }

        function saveAutoreplySettings(chatId, settings) {
            const all = JSON.parse(localStorage.getItem('maxclient_autoreply') || '{}');
            all[chatId] = settings;
            localStorage.setItem('maxclient_autoreply', JSON.stringify(all));
        }

        async function checkAuth() {
            try {
                const res = await fetch('/api/check-auth');
                const data = await res.json();
                if (!data.authenticated) {
                    showLoginUI();
                }
            } catch (e) {
                showLoginUI();
            }
        }

        applySettingsVars(loadSettingsVars());
        checkAuth();
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        connect();

        window.onbeforeunload = () => { if (ws) ws.close(); };
    </script>
</body>
