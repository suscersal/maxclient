        // GIF-вложения. У сервера тут может быть два разных формата:
        //  1) "настоящий" анимированный файл (baseUrl/url/baseRawUrl,
        //     оканчивающийся на .gif или отданный как image/gif) — тогда
        //     достаточно обычного <img>, он анимируется сам.
        //  2) GIF, перекодированный сервером в короткое немое зацикленное
        //     видео (как делают многие мессенджеры ради размера трафика) —
        //     тогда рендерим как <video autoplay loop muted>, без плашки
        //     "▶" и без тапа для воспроизведения (в отличие от VIDEO), т.к.
        //     GIF должен проигрываться сразу и сам по себе.
        function createGifPreview(messageId, chatId, attach) {
            const rawUrl = attach.baseRawUrl || attach.baseUrl || attach.url;
            const looksLikeImage = rawUrl && (/\.gif(\?|$)/i.test(rawUrl) || attach.mimeType === 'image/gif');

            if (looksLikeImage) {
                const src = '/img?url=' + encodeURIComponent(rawUrl);
                return `<img class="msg-img" src="${src}" alt="GIF" loading="lazy" style="max-width:100%;border-radius:8px;display:block;" onerror="this.style.display='none'" onclick="openPhotoViewer('${src}', '')">`;
            }

            // Иначе считаем, что это видео-GIF — тот же протокол, что и у
            // VIDEO-вложений: token/videoId сами по себе не воспроизводимая
            // ссылка, их сперва нужно обменять на реальный источник через
            // /api/video-sources (см. inlineVideoTap), поэтому здесь рисуем
            // постер-заглушку, а сам src подставляется асинхронно в
            // initGifVideo() после вставки элемента в DOM.
            const uid = 'gif_' + Math.random().toString(36).slice(2, 9);
            const posterUrl = attach.thumbnail ? '/img?url=' + encodeURIComponent(attach.thumbnail) : '';
            const token = attach.token || attach.videoToken || '';
            const videoId = attach.videoId || 0;
            return `
            <div class="msg-gif-container" id="${uid}" data-msg-id="${messageId}" data-chat-id="${chatId}" data-token="${escapeHtml(token)}" data-video-id="${videoId}" style="position:relative;max-width:100%;border-radius:8px;overflow:hidden;">
                ${posterUrl ? `<img src="${posterUrl}" alt="GIF" style="width:100%;display:block;">` : `<div style="aspect-ratio:1;background:#1a1a1a;"></div>`}
            </div>`;
        }

        /** Догружает реальный видео-источник для GIF-плейсхолдера и
         * подставляет вместо постера автоплеящийся <video>. Вызывается для
         * всех новых GIF-контейнеров после вставки сообщений в DOM (см.
         * renderMessages), аналогично loadLottieSticker для стикеров. */
        async function initGifVideo(container) {
            const token = container.dataset.token;
            const videoId = container.dataset.videoId;
            const messageId = container.dataset.msgId;
            const chatId = container.dataset.chatId;
            if (!token || !videoId || !chatId) return;
            try {
                const res = await fetch('/api/video-sources', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messageId, chatId, token, videoId }),
                });
                const data = await res.json();
                const sources = data.sources || {};
                const best = sources['480p'] || sources['720p'] || Object.values(sources)[0];
                if (!best) return;
                const posterEl = container.querySelector('img');
                const v = document.createElement('video');
                v.src = '/video?url=' + encodeURIComponent(best);
                v.loop = true;
                v.muted = true;
                v.autoplay = true;
                v.playsInline = true;
                v.style.cssText = 'width:100%;display:block;';
                if (posterEl) posterEl.replaceWith(v); else container.appendChild(v);
                v.play().catch(() => { });
            } catch (e) {
                console.log('[maxclient] не удалось загрузить GIF-видео:', e);
            }
        }

        // ========================================
        // СКАМ-ПРОВЕРКА СООБЩЕНИЙ ЛОКАЛЬНОЙ ИИ-МОДЕЛЬЮ
        // ========================================
        //
        // На Android бридж (bridge.py) прогоняет сообщения через ИИ-модель,
        // работающую ПРЯМО В ПРИЛОЖЕНИИ (MediaPipe LLM Inference через
        // Chaquopy) — ничего ставить/настраивать не нужно, модель качается
        // один раз в фоне сама. На десктопе (или пока модель ещё не
        // скачалась) используется fallback на внешний OpenAI-совместимый
        // сервер (Ollama/llama.cpp/LM Studio), см. поля URL/модель ниже.

        let scamCheckSettingsCache = null;
        let scamCheckModelsCache = null;
        // Промис первичной загрузки настроек — нужен, чтобы queueScamCheck()
        // не "молча" пропускал сообщения, которые отрендерились ДО того, как
        // настройки успели прийти с сервера (см. комментарий в queueScamCheck).
        let scamCheckSettingsPromise = null;
        const scamVerdictCache = {}; // msgId -> { is_scam, confidence, reason }
        let scamCheckQueue = [];
        let scamCheckBusy = false;

        // Модели (особенно слабые on-device) иногда присылают confidence вне
        // диапазона 0..100 (300, -500 и т.п.). Бэкенд уже зажимает диапазон,
        // но подстраховываемся и на фронте — на случай старого закэшированного
        // вердикта или бриджа, запущенного без последнего обновления кода.
        function clampPct(v) {
            if (typeof v !== 'number' || isNaN(v)) return v;
            return Math.max(0, Math.min(100, Math.round(v)));
        }

        // Три категории риска по проценту confidence (те же пороги, что и на
        // бэкенде — см. SCAM_THRESHOLD_LIKELY/SCAM_THRESHOLD_SCAM в bridge.py):
        // <50 — не скам, [50,90) — вероятно скам, >=90 — скам (красным).
        // verdict.category уже приходит с бэкенда, но пересчитываем на всякий
        // случай (например, для старого кэша без этого поля).
        function scamCategory(verdict) {
            if (verdict && verdict.category) return verdict.category;
            const pct = verdict ? verdict.confidence : null;
            if (typeof pct === 'number') {
                if (pct >= 90) return 'scam';
                if (pct >= 50) return 'likely';
                return 'safe';
            }
            return (verdict && verdict.is_scam) ? 'scam' : 'safe';
        }
        // Сколько записей из st.results уже выведено в консоль при опросе
        // /api/scam-check/scan-all/status — чтобы при поллинге логировать
        // только НОВЫЕ проверенные сообщения, а не весь список каждый раз.
        let scamScanLoggedCount = 0;

        async function loadScamCheckSettings() {
            try {
                const res = await fetch('/api/scam-check/settings');
                scamCheckSettingsCache = await res.json();
            } catch (e) {
                scamCheckSettingsCache = { enabled: false, url: '', model: '', hfToken: '' };
            }
            return scamCheckSettingsCache;
        }

        // Гарантирует, что scamCheckSettingsCache уже загружен (или загрузка
        // хотя бы запущена), переиспользуя один и тот же промис при
        // повторных вызовах — чтобы не слать лишние запросы /settings.
        function ensureScamCheckSettingsLoaded() {
            if (!scamCheckSettingsPromise) {
                scamCheckSettingsPromise = loadScamCheckSettings();
            }
            return scamCheckSettingsPromise;
        }

        function formatBytes(n) {
            if (!n) return '0 МБ';
            return (n / (1024 * 1024)).toFixed(0) + ' МБ';
        }

        async function loadScamCheckModels() {
            try {
                const res = await fetch('/api/scam-check/models');
                scamCheckModelsCache = await res.json();
            } catch (e) {
                scamCheckModelsCache = { models: [], current: '' };
            }
            return scamCheckModelsCache;
        }

        function renderScamCheckModelSelect() {
            const wrap = document.getElementById('scamCheckModelSelectWrap');
            if (!wrap) return;
            const data = scamCheckModelsCache;
            if (!data || !data.models || !data.models.length) {
                wrap.innerHTML = '';
                return;
            }
            const options = data.models.map(m => `
                <option value="${escapeHtml(m.id)}" ${m.selected ? 'selected' : ''}>
                    ${escapeHtml(m.label)}${m.downloaded ? ' ✓' : ''}
                </option>
            `).join('');
            wrap.innerHTML = `
                <div style="margin:14px 0 6px;font-weight:600;">Модель на устройстве</div>
                <div class="settings-row">
                    <select id="scamCheckOnDeviceModel" class="setting-value" style="flex:1;"
                            onchange="saveScamCheckSettings()">
                        ${options}
                    </select>
                </div>
                <div class="settings-empty" style="text-align:left;font-size:11px;line-height:1.4;margin:2px 0 0;">
                    ✓ — уже скачана на этом устройстве. При смене модели старая
                    удаляется, новая скачивается автоматически.
                </div>
            `;
        }

        async function refreshScamCheckModelSelect() {
            await loadScamCheckModels();
            renderScamCheckModelSelect();
        }

        async function refreshScamCheckModelStatus() {
            const box = document.getElementById('scamCheckModelStatus');
            const barWrap = document.getElementById('scamCheckProgressWrap');
            const bar = document.getElementById('scamCheckProgressBar');
            const deleteBtn = document.getElementById('scamCheckDeleteBtn');
            const retryBtn = document.getElementById('scamCheckRetryBtn');
            if (!box) return;
            try {
                const res = await fetch('/api/scam-check/model-status');
                const st = await res.json();
                if (barWrap) barWrap.style.display = 'none';
                if (deleteBtn) deleteBtn.style.display = 'none';
                if (retryBtn) retryBtn.style.display = 'none';

                if (!st.onDeviceSupported) {
                    box.textContent = 'On-device модель недоступна (не Android-сборка) — используется внешний сервер ниже.';
                } else if (st.modelReady) {
                    box.innerHTML = '✅ Модель на устройстве готова, проверка работает автоматически. <span class="msg-scam-speed-chip">⚡ Быстро</span>';
                    if (deleteBtn) deleteBtn.style.display = '';
                } else if (st.downloading) {
                    const pct = st.totalBytes ? Math.round(st.downloadedBytes / st.totalBytes * 100) : null;
                    box.textContent = pct != null
                        ? `⏳ Скачивается модель: ${pct}% (${formatBytes(st.downloadedBytes)} / ${formatBytes(st.totalBytes)})`
                        : `⏳ Скачивается модель: ${formatBytes(st.downloadedBytes)}…`;
                    if (barWrap && bar) {
                        barWrap.style.display = '';
                        bar.style.width = (pct != null ? pct : 0) + '%';
                    }
                    setTimeout(refreshScamCheckModelStatus, 1500);
                } else if (st.error) {
                    box.textContent = '❌ Не удалось скачать модель: ' + st.error;
                    if (retryBtn) retryBtn.style.display = '';
                } else {
                    box.textContent = 'Модель ещё не скачана — начнётся автоматически после включения проверки.';
                }
            } catch (e) {
                box.textContent = '';
            }
        }

        let transcribeSettingsCache = null;

        const TRANSCRIBE_ENGINE_INFO = {
            vosk: { label: 'Vosk (лёгкая, ~40 МБ)', sizeLabel: '~40 МБ' },
            whisper: { label: 'Whisper (точнее, 190 МБ)', sizeLabel: '190 МБ' },
        };

        function getSelectedTranscribeEngine() {
            const checked = document.querySelector('input[name="transcribeEngine"]:checked');
            return checked?.value || transcribeSettingsCache?.onDeviceEngine || 'vosk';
        }

        async function loadTranscribeSettings() {
            try {
                const resp = await fetch('/api/transcribe/settings');
                transcribeSettingsCache = await resp.json();
            } catch (e) {
                transcribeSettingsCache = { enabled: false, url: '', model: '', language: 'ru', autoTranscribeIncoming: false, onDeviceEngine: 'vosk' };
            }
            return transcribeSettingsCache;
        }

        async function saveTranscribeSettings() {
            const body = {
                enabled: document.getElementById('transcribeEnabled')?.checked || false,
                url: document.getElementById('transcribeUrl')?.value.trim() || '',
                model: document.getElementById('transcribeModel')?.value.trim() || '',
                language: document.getElementById('transcribeLanguage')?.value.trim() || 'ru',
                autoTranscribeIncoming: document.getElementById('transcribeAutoIncoming')?.checked || false,
                onDeviceEngine: getSelectedTranscribeEngine(),
            };
            const statusEl = document.getElementById('transcribeSaveStatus');
            try {
                const resp = await fetch('/api/transcribe/settings', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                transcribeSettingsCache = await resp.json();
                if (statusEl) statusEl.textContent = '✅ Сохранено';
                refreshTranscribeModelStatus();
            } catch (e) {
                if (statusEl) statusEl.textContent = '❌ Ошибка: ' + (e.message || e);
            }
        }

        // Меняем движок (radio) без нажатия "Сохранить" — сразу показываем
        // статус его модели, но настройку на бэкенде не трогаем, пока
        // пользователь явно не сохранит (соответствует остальным полям формы).
        function onTranscribeEngineChange() {
            refreshTranscribeModelStatus();
        }

        async function refreshTranscribeModelStatus() {
            const box = document.getElementById('transcribeModelStatus');
            const barWrap = document.getElementById('transcribeProgressWrap');
            const bar = document.getElementById('transcribeProgressBar');
            const deleteBtn = document.getElementById('transcribeDeleteBtn');
            const retryBtn = document.getElementById('transcribeRetryBtn');
            if (!box) return;
            const engine = getSelectedTranscribeEngine();
            const sizeLabel = TRANSCRIBE_ENGINE_INFO[engine]?.sizeLabel || '';
            try {
                const res = await fetch('/api/transcribe/model-status?engine=' + encodeURIComponent(engine));
                const st = await res.json();
                console.debug('[transcribe] model-status:', st);
                if (barWrap) barWrap.style.display = 'none';
                if (deleteBtn) deleteBtn.style.display = 'none';
                if (retryBtn) retryBtn.style.display = 'none';

                if (!st.onDeviceSupported) {
                    box.textContent = 'On-device модель недоступна (не Android-сборка) — можно указать внешний сервер ниже.';
                } else if (st.ready) {
                    box.innerHTML = '✅ Модель на устройстве готова, распознавание работает офлайн.';
                    if (deleteBtn) deleteBtn.style.display = '';
                } else if (st.downloading) {
                    const pct = st.totalBytes ? Math.round(st.downloadedBytes / st.totalBytes * 100) : null;
                    box.textContent = pct != null
                        ? `⏳ Скачивается модель (${sizeLabel}): ${pct}% (${formatBytes(st.downloadedBytes)} / ${formatBytes(st.totalBytes)})`
                        : `⏳ Скачивается модель: ${formatBytes(st.downloadedBytes)}…`;
                    if (barWrap && bar) {
                        barWrap.style.display = '';
                        bar.style.width = (pct != null ? pct : 0) + '%';
                    }
                    setTimeout(refreshTranscribeModelStatus, 1500);
                } else if (st.error) {
                    console.error('[transcribe] model download error:', st.error, 'full status:', JSON.stringify(st));
                    const hdrHex = (st.whisper && st.whisper.debugHeaderHex) || st.debugHeaderHex;
                    if (hdrHex) {
                        let asText = '';
                        try {
                            asText = hdrHex.match(/.{1,2}/g).map(b => {
                                const c = parseInt(b, 16);
                                return (c >= 32 && c < 127) ? String.fromCharCode(c) : '.';
                            }).join('');
                        } catch (e) { }
                        console.error('[transcribe] первые 64 байта скачанного файла (hex):', hdrHex);
                        console.error('[transcribe] те же байты как текст:', asText);
                    }
                    box.textContent = '❌ Не удалось скачать модель: ' + st.error;
                    if (retryBtn) retryBtn.style.display = '';
                } else {
                    box.textContent = `Модель ещё не скачана (${sizeLabel}).`;
                    if (retryBtn) { retryBtn.style.display = ''; retryBtn.textContent = '⬇️ Скачать модель'; }
                }
            } catch (e) {
                console.error('[transcribe] refreshTranscribeModelStatus failed:', e);
                box.textContent = '';
            }
        }

        async function transcribeModelDownload() {
            const engine = getSelectedTranscribeEngine();
            console.debug('[transcribe] starting download, engine=', engine);
            const r = await fetch('/api/transcribe/model/download?engine=' + encodeURIComponent(engine), { method: 'POST' });
            console.debug('[transcribe] download POST response status=', r.status);
            try {
                console.debug('[transcribe] download POST response body=', await r.clone().text());
            } catch (e) { }
            refreshTranscribeModelStatus();
        }

        async function transcribeModelDelete() {
            const engine = getSelectedTranscribeEngine();
            if (!confirm('Удалить скачанную модель распознавания речи (' + (TRANSCRIBE_ENGINE_INFO[engine]?.label || engine) + ')?')) return;
            await fetch('/api/transcribe/model?engine=' + encodeURIComponent(engine), { method: 'DELETE' });
            refreshTranscribeModelStatus();
        }

        function transcribeModelImportPick() {
            document.getElementById('transcribeModelImportInput')?.click();
        }

        async function transcribeModelImportFile(input) {
            const file = input.files && input.files[0];
            input.value = ''; // чтобы повторный выбор того же файла снова триггерил change
            if (!file) return;
            const engine = getSelectedTranscribeEngine();
            const box = document.getElementById('transcribeModelStatus');
            const importBtn = document.getElementById('transcribeImportBtn');
            const label = TRANSCRIBE_ENGINE_INFO[engine]?.label || engine;
            if (engine === 'vosk' && !/\.zip$/i.test(file.name)) {
                if (!confirm(`Файл «${file.name}» не похож на .zip — для Vosk обычно нужен архив модели с alphacephei.com. Всё равно попробовать?`)) return;
            }
            if (engine === 'whisper' && !/\.bin$/i.test(file.name)) {
                if (!confirm(`Файл «${file.name}» не похож на .bin — для Whisper нужен ggml-файл whisper.cpp (например ggml-large-v3-turbo.bin). Всё равно попробовать?`)) return;
            }
            if (importBtn) importBtn.disabled = true;
            if (box) box.textContent = `⏳ Импортируется «${file.name}» как модель ${label} — для больших файлов это может занять минуту-другую…`;
            try {
                const fd = new FormData();
                fd.append('file', file, file.name);
                const resp = await fetch('/api/transcribe/model/import?engine=' + encodeURIComponent(engine), {
                    method: 'POST', body: fd
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || 'не удалось импортировать модель');
            } catch (e) {
                if (box) box.textContent = '❌ Импорт не удался: ' + (e.message || e);
            } finally {
                if (importBtn) importBtn.disabled = false;
                refreshTranscribeModelStatus();
            }
        }

            const el = document.getElementById('transcribeDiagOut');
            if (el) el.textContent = 'Проверяю…';
            try {
                const resp = await fetch('/api/debug/java-diag');
                const data = await resp.json();
                console.log('[java-diag]', JSON.stringify(data));
                if (el) el.textContent = JSON.stringify(data, null, 1);

                console.error('[java-diag] fetch failed', e.message);
                if (el) el.textContent = '⚠️ ' + e.message;
            }
        }

        async function saveScamCheckSettings() {
            const enabled = document.getElementById('scamCheckEnabled')?.checked || false;
            const url = document.getElementById('scamCheckUrl')?.value.trim() || '';
            const model = document.getElementById('scamCheckModel')?.value.trim() || '';
            const onDeviceModelId = document.getElementById('scamCheckOnDeviceModel')?.value || undefined;
            const statusEl = document.getElementById('scamCheckStatus');
            try {
                const res = await fetch('/api/scam-check/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled, url, model, onDeviceModelId }),
                });
                const json = await res.json();
                if (!json.ok) throw new Error(json.error || 'unknown error');
                scamCheckSettingsCache = json;
                if (statusEl) statusEl.textContent = '✅ Сохранено';
                refreshScamCheckModelStatus();
                refreshScamCheckModelSelect();
            } catch (e) {
                if (statusEl) statusEl.textContent = '❌ Ошибка: ' + (e.message || e);
            }
        }

        async function deleteScamCheckModel() {
            try {
                await fetch('/api/scam-check/model', { method: 'DELETE' });
            } catch (e) { /* ignore */ }
            refreshScamCheckModelStatus();
            refreshScamCheckModelSelect();
        }

        async function retryScamCheckDownload() {
            // Токен из поля мог поменяться, но ещё не сохранён — сохраняем
            // настройки заново перед повторной попыткой, чтобы бридж уже
            // использовал актуальный hfToken.
            await saveScamCheckSettings();
            try {
                await fetch('/api/scam-check/model/redownload', { method: 'POST' });
            } catch (e) { /* ignore */ }
            refreshScamCheckModelStatus();
        }
        async function importScamCheckModelFile() {
            if (!window.AndroidModelImport || !AndroidModelImport.isAvailable()) {
                alert('Импорт файла модели доступен только в Android-приложении.');
                return;
            }
            const modelId = document.getElementById('scamCheckOnDeviceModel')?.value
                || (scamCheckModelsCache && scamCheckModelsCache.current) || '';
            if (!modelId) { alert('Сначала выберите модель в списке выше.'); return; }
            const statusEl = document.getElementById('scamCheckModelStatus');
            if (statusEl) statusEl.textContent = '⏳ Выберите файл модели (.task)…';
            AndroidModelImport.pickAndImport(modelId);
        }

        window.onAndroidModelImportResult = function (res) {
            if (res && res.ok) {
                refreshScamCheckModelStatus();
                refreshScamCheckModelSelect();
            } else {
                const statusEl = document.getElementById('scamCheckModelStatus');
                if (statusEl) statusEl.textContent = '❌ Импорт не удался: ' + ((res && res.error) || 'неизвестная ошибка');
            }
        };

        async function scanScamCheckModelFolder() {
            if (!window.AndroidModelImport || !AndroidModelImport.isAvailable()) {
                alert('Поиск .task-файлов доступен только в Android-приложении.');
                return;
            }
            const statusEl = document.getElementById('scamCheckModelStatus');
            if (statusEl) statusEl.textContent = '⏳ Выберите папку (например «Загрузки»)…';
            AndroidModelImport.scanFolder();
        }

        window.onAndroidModelScanResult = function (res) {
            const box = document.getElementById('scamCheckModelStatus');
            if (!res || !res.ok) {
                if (box) box.textContent = '❌ ' + ((res && res.error) || 'Не удалось прочитать папку');
                return;
            }
            if (!res.items || !res.items.length) {
                if (box) box.textContent = 'В выбранной папке .task-файлы не найдены.';
                return;
            }
            const modelId = document.getElementById('scamCheckOnDeviceModel')?.value
                || (scamCheckModelsCache && scamCheckModelsCache.current) || '';
            const list = res.items.map(it =>
                `<div class="settings-row" style="align-items:center;">
            <span style="flex:1;font-size:12px;word-break:break-all;">${escapeHtml(it.name)}</span>
            <button class="settings-menu-item" style="width:auto;padding:4px 8px;"
                    onclick='AndroidModelImport.importFromUri(${JSON.stringify(it.uri)}, ${JSON.stringify(modelId)})'>
                Импортировать
            </button>
        </div>`
            ).join('');
            if (box) box.innerHTML = 'Найдены файлы модели в папке:' + list;
        };

        // Проверяем не чаще, чем по одному сообщению за раз — локальная модель
        // на обычном железе не тянет параллельные запросы без деградации.
        async function queueScamCheck(msgId, text, context) {
            if (!text) {
                console.log('[scam-check] skip: пустой текст сообщения', { msgId });
                return;
            }
            if (scamVerdictCache[msgId]) {
                console.log('[scam-check] skip: вердикт уже в кэше', { msgId, verdict: scamVerdictCache[msgId] });
                return;
            }
            // РАНЬШЕ здесь была проверка `if (!scamCheckSettingsCache || ...) return`
            // ДО первого ответа /api/scam-check/settings — а loadScamCheckSettings()
            // на старте приложения не await-ится (см. вызов рядом с connect()).
            // Из-за этого первые же сообщения, отрисованные при открытии/подгрузке
            // истории чата СРАЗУ после старта, вызывали queueScamCheck() раньше,
            // чем настройки успевали прийти с сервера — проверка тихо
            // пропускалась. А т.к. msgId сразу попадает в existingIds при
            // рендере, повторно этот же элемент никогда не перерисовывается —
            // сообщение так и оставалось непроверенным навсегда, даже когда
            // проверка включена и настройки в итоге загрузились.
            // Теперь вместо немедленного skip — дожидаемся первой загрузки
            // настроек (или её результата, если уже загружены) и только
            // потом решаем, продолжать проверку или нет.
            if (!scamCheckSettingsCache) {
                await ensureScamCheckSettingsLoaded();
            }
            if (!scamCheckSettingsCache || !scamCheckSettingsCache.enabled) {
                console.log('[scam-check] skip: проверка выключена', { msgId, settings: scamCheckSettingsCache });
                return;
            }
            // Вердикт мог прийти, пока мы ждали настройки (или сообщение уже
            // поставлено в очередь другим путём) — проверяем ещё раз.
            if (scamVerdictCache[msgId]) return;
            console.log('[scam-check] queued', { msgId, text, contextLen: (context || '').length });
            // unshift, а не push: сообщения ставятся в очередь в том порядке,
            // в котором рендерятся (обычно от старых к новым), а по запросу
            // "сначала новейшие" реальные скам-попытки интереснее только что
            // пришедших сообщений — поэтому каждое следующее (более новое)
            // сообщение встаёт в НАЧАЛО очереди и обгоняет уже ждущие там
            // более старые.
            scamCheckQueue.unshift({ msgId, text, context: context || '' });
            processScamCheckQueue();
        }

        async function processScamCheckQueue() {
            if (scamCheckBusy) return;
            const job = scamCheckQueue.shift();
            if (!job) return;
            scamCheckBusy = true;
            console.log('[scam-check] sending request', job);
            try {
                const res = await fetch('/api/scam-check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: job.text, context: job.context || '' }),
                });
                if (res.ok) {
                    const verdict = await res.json();
                    if (typeof verdict.confidence === 'number') {
                        verdict.confidence = clampPct(verdict.confidence);
                    }
                    console.log('[scam-check] verdict received', { msgId: job.msgId, verdict });
                    scamVerdictCache[job.msgId] = verdict;
                    applyScamVerdictToDom(job.msgId, verdict);
                } else {
                    const errText = await res.text();
                    console.warn('[scam-check] server returned error', res.status, errText);
                }
            } catch (e) {
                console.warn('[scam-check] request failed (fetch exception)', e);
            } finally {
                scamCheckBusy = false;
                if (scamCheckQueue.length) processScamCheckQueue();
            }
        }

        function applyScamVerdictToDom(msgId, verdict) {
            const el = document.querySelector(`.msg-bubble[data-msg-id="${msgId}"] .msg-scam-badge`);
            if (!el) {
                console.warn('[scam-check] badge element not found in DOM for msgId', msgId, '(сообщение уже перерисовано/удалено?)');
                return;
            }
            const pct = typeof verdict.confidence === 'number' ? clampPct(verdict.confidence) : (verdict.confidence ?? '?');
            const cat = scamCategory(verdict);
            el.style.display = '';
            el.classList.remove('msg-scam-badge-safe', 'msg-scam-badge-likely');
            if (cat === 'scam') {
                el.textContent = `⚠️ Похоже на скам (${pct}%): ${verdict.reason || ''}`;
            } else if (cat === 'likely') {
                el.classList.add('msg-scam-badge-likely');
                el.textContent = `⚠️ Вероятно скам (${pct}%): ${verdict.reason || ''}`;
            } else {
                // Раньше бейдж просто удалялся для "чистых" сообщений — теперь
                // процент риска показываем всегда, даже когда это не скам.
                el.classList.add('msg-scam-badge-safe');
                el.textContent = `✅ Скам-проверка: ${pct}% риска`;
            }
        }

        // ========================================
        // КАСТОМНЫЕ БОТЫ: реестр на GitHub + локальный чат по HTTP API бота
        // ========================================
        //
        // ИДЕЯ: пользователь может подключить любого «стороннего» бота, не
        // связанного с протоколом MAX — достаточно, чтобы у бота был свой
        // веб-сервер (адрес + порт), отвечающий на два простых HTTP-эндпоинта.
        // Список публичных ботов («реестр») — это обычный JSON-файл, лежащий
        // в GitHub-репозитории и отдаваемый через raw.githubusercontent.com —
        // никакого спец. бэкенда для реестра не нужно, GitHub и есть хранилище.
        //
        // КОНТРАКТ API БОТА (реализует сервер бота, любой стек — Python/Node/Go/...):
        //
        //   GET  {baseUrl}/api/info
        //     -> 200 { "name": "MyBot", "description": "...", "avatar_url": "...", "version": "1.0" }
        //
        //   POST {baseUrl}/api/message
        //     тело запроса:  { "chat_id": "<локальный id чата>",
        //                      "user": { "id": <selfId>, "name": "<имя>" },
        //                      "text": "<текст сообщения>",
        //                      "history": [ { "role": "user"|"bot", "text": "...", "ts": 1690000000000 }, ... ] }
        //     ответ:         { "text": "<ответ бота, поддерживает ``` код ``` >",
        //                      "buttons": [ [ { "text": "Кнопка", "value": "payload" } ] ] } // необязательно
        //
        // ФОРМАТ РЕЕСТРА (bots.json в репозитории на GitHub):
        //   [
        //     { "name": "EchoBot", "url": "http://1.2.3.4:8080", "description": "Отвечает эхом" },
        //     { "name": "WeatherBot", "url": "http://myhost.example.com:9090", "description": "Прогноз погоды" }
        //   ]

        const DEFAULT_BOT_REGISTRY_URL = 'https://raw.githubusercontent.com/suscersal/maxclient/main/bots.json';
        let botRegistryCache = [];
        let activeBotChatId = null;

        function getBotRegistryUrl() {
            return localStorage.getItem('maxclient_bot_registry_url') || DEFAULT_BOT_REGISTRY_URL;
        }

        function getCustomBots() {
            try { return JSON.parse(localStorage.getItem('maxclient_custom_bots') || '[]'); }
            catch (e) { return []; }
        }

        function saveCustomBotsList(bots) {
            localStorage.setItem('maxclient_custom_bots', JSON.stringify(bots));
        }

        function normalizeBotBaseUrl(url) {
            return String(url || '').trim().replace(/\/+$/, '');
        }

        function renderBotsPage() {
            const bots = getCustomBotsSorted();
            const installedHtml = bots.length
                ? bots.map(bot => `
                    <div class="chat-profile-option" style="align-items:flex-start;">
                        <span class="opt-icon">🤖</span>
                        <div style="flex:1;min-width:0;">
                            <div style="font-weight:600;">${escapeHtml(bot.name)}</div>
                            <div style="font-size:12px;color:#888;word-break:break-all;">${escapeHtml(bot.url)}</div>
                            <div style="font-size:11px;color:#aaa;margin-top:2px;">${bot.source === 'manual' ? 'добавлен вручную' : 'из реестра'}${bot.lastUsedAt ? ' · запускался' : ''}</div>
                        </div>
                        <button class="settings-menu-item" style="width:auto;padding:6px 10px;" onclick="openBotChatModal('${bot.id}')">💬 Чат</button>
                        <button class="settings-menu-item danger" style="width:auto;padding:6px 10px;" onclick="removeCustomBot('${bot.id}')">🗑️</button>
                    </div>`).join('')
                : `<div class="settings-empty">Пока нет добавленных ботов</div>`;

            return `
                <div style="margin-bottom:14px;">
                    <div style="font-weight:600;margin-bottom:6px;">Мои боты</div>
                    ${installedHtml}
                </div>
                <hr class="settings-menu-divider">
                <div style="margin:14px 0 6px;font-weight:600;">Реестр ботов (GitHub)</div>
                <div class="settings-row">
                    <input class="setting-key" id="botRegistryUrlInput" placeholder="Raw-ссылка на bots.json"
                           value="${escapeHtml(getBotRegistryUrl())}" style="flex:1;">
                </div>
                <div class="settings-content-footer" style="margin-bottom:10px;">
                    <button class="btn-save" onclick="loadBotRegistry()">⟳ Загрузить реестр</button>
                </div>
                <div id="botRegistryList"></div>
                <hr class="settings-menu-divider">
                <div style="margin:14px 0 6px;font-weight:600;">Добавить бота вручную</div>
                <div class="settings-row">
                    <input class="setting-key" id="manualBotName" placeholder="Имя бота">
                    <input class="setting-value" id="manualBotUrl" placeholder="http://host:port">
                </div>
                <div class="settings-content-footer">
                    <button class="btn-add" onclick="addManualCustomBot()">+ Добавить бота</button>
                </div>
            `;
        }

        async function loadBotRegistry() {
            const input = document.getElementById('botRegistryUrlInput');
            const url = (input?.value || '').trim() || getBotRegistryUrl();
            localStorage.setItem('maxclient_bot_registry_url', url);
            const listEl = document.getElementById('botRegistryList');
            if (!listEl) return;
            listEl.innerHTML = '<div class="settings-empty">⏳ Загружаю реестр...</div>';
            try {
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const registry = await res.json();
                if (!Array.isArray(registry)) throw new Error('реестр должен быть JSON-массивом');
                botRegistryCache = registry;
                renderBotRegistryList(registry);
            } catch (e) {
                listEl.innerHTML = `<div class="settings-empty">❌ Не удалось загрузить реестр: ${escapeHtml(String(e.message || e))}</div>`;
            }
        }

        function renderBotRegistryList(registry) {
            const listEl = document.getElementById('botRegistryList');
            if (!listEl) return;
            if (!registry.length) {
                listEl.innerHTML = '<div class="settings-empty">Реестр пуст</div>';
                return;
            }
            const installed = getCustomBots();
            listEl.innerHTML = registry.map((bot, idx) => {
                const url = normalizeBotBaseUrl(bot.url);
                const already = installed.some(b => b.url === url);
                return `
                <div class="chat-profile-option" style="align-items:flex-start;">
                    <span class="opt-icon">🤖</span>
                    <div style="flex:1;min-width:0;">
                        <div style="font-weight:600;">${escapeHtml(bot.name || 'Бот без имени')}</div>
                        <div style="font-size:12px;color:#888;word-break:break-all;">${escapeHtml(url)}</div>
                        ${bot.description ? `<div style="font-size:12px;color:#666;margin-top:2px;">${escapeHtml(bot.description)}</div>` : ''}
                    </div>
                    <button class="settings-menu-item" style="width:auto;padding:6px 10px;" ${already ? 'disabled' : ''}
                        onclick="addCustomBotFromRegistry(${idx})">${already ? '✅ Добавлен' : '➕ Добавить'}</button>
                </div>`;
            }).join('');
        }

        function addCustomBotFromRegistry(idx) {
            const bot = botRegistryCache[idx];
            if (!bot) return;
            addCustomBot(bot.name || bot.url, normalizeBotBaseUrl(bot.url), 'registry');
        }

        function addManualCustomBot() {
            const name = (document.getElementById('manualBotName')?.value || '').trim();
            const url = normalizeBotBaseUrl(document.getElementById('manualBotUrl')?.value || '');
            if (!url) { log('❌ Укажите адрес бота (с портом)', 'error'); return; }
            addCustomBot(name || url, url, 'manual');
        }

        // source: 'manual' — бот, адрес которого пользователь ввёл сам (высокий
        // приоритет в поиске), 'registry' — добавлен из GitHub-реестра.
        function addCustomBot(name, url, source) {
            if (!url) return;
            const bots = getCustomBots();
            if (bots.some(b => b.url === url)) {
                log('ℹ️ Такой бот уже добавлен', 'info');
                return;
            }
            bots.push({
                id: 'bot_' + Math.random().toString(36).slice(2, 10),
                name: name || url,
                url,
                source: source || 'manual',
                addedAt: Date.now(),
                lastUsedAt: null,
            });
            saveCustomBotsList(bots);
            log('✅ Бот добавлен: ' + (name || url), 'success');
            settingsMenu.refreshPage('bots');
        }

        // Отмечает бота как «запускавшийся» — влияет на порядок в поиске
        // (недавно открытые/использованные боты поднимаются выше).
        function touchCustomBot(botId) {
            const bots = getCustomBots();
            const bot = bots.find(b => b.id === botId);
            if (!bot) return;
            bot.lastUsedAt = Date.now();
            saveCustomBotsList(bots);
        }

        // Приоритет: сначала боты, которые пользователь добавил сам вручную
        // (source === 'manual'), затем — по недавнему использованию
        // (те, что «запускались» позже, — выше), затем по дате добавления.
        function getCustomBotsSorted() {
            return getCustomBots().slice().sort((a, b) => {
                const aManual = a.source === 'manual' ? 1 : 0;
                const bManual = b.source === 'manual' ? 1 : 0;
                if (aManual !== bManual) return bManual - aManual;
                const aUsed = a.lastUsedAt || 0;
                const bUsed = b.lastUsedAt || 0;
                if (aUsed !== bUsed) return bUsed - aUsed;
                return (b.addedAt || 0) - (a.addedAt || 0);
            });
        }

        function removeCustomBot(id) {
            const bots = getCustomBots().filter(b => b.id !== id);
            saveCustomBotsList(bots);
            localStorage.removeItem('maxclient_bot_chat_' + id);
            settingsMenu.refreshPage('bots');
        }

        function getBotChatHistory(botId) {
            try { return JSON.parse(localStorage.getItem('maxclient_bot_chat_' + botId) || '[]'); }
            catch (e) { return []; }
        }

        function saveBotChatHistory(botId, history) {
            // храним не более 200 последних сообщений на бота
            localStorage.setItem('maxclient_bot_chat_' + botId, JSON.stringify(history.slice(-200)));
        }

        // Рендерит текст сообщения бота: та же логика, что и для обычных сообщений
        // MAX без elements — экранирование + блоки кода ``` ``` + ссылки
        // (см. renderPlainMessageText / buildMessageTextHtml).
        function renderBotMessageText(text) {
            return renderPlainMessageText(text || '');
        }

        function openBotChatModal(botId) {
            const bot = getCustomBots().find(b => b.id === botId);
            if (!bot) return;
            activeBotChatId = botId;
            touchCustomBot(botId);
            document.getElementById('botChatTitle').textContent = '🤖 ' + bot.name;
            renderBotChatMessages();
            document.getElementById('botChatModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            closeSettingsModal();
        }

        function closeBotChatModal() {
            document.getElementById('botChatModal').classList.remove('active');
            document.body.style.overflow = '';
            activeBotChatId = null;
        }

        document.getElementById('botChatModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeBotChatModal();
        });

        function renderBotChatMessages() {
            const container = document.getElementById('botChatMessages');
            if (!container || !activeBotChatId) return;
            const history = getBotChatHistory(activeBotChatId);
            container.innerHTML = history.map(m => `
                <div style="align-self:${m.role === 'user' ? 'flex-end' : 'flex-start'};max-width:85%;
                            background:${m.role === 'user' ? '#007bff' : '#f0f0f0'};color:${m.role === 'user' ? '#fff' : '#000'};
                            padding:8px 10px;border-radius:12px;">
                    ${renderBotMessageText(m.text)}
                </div>`).join('');
            container.scrollTop = container.scrollHeight;
        }
        function getCurrentUserName() {
            // 1. Проверяем, есть ли у нас загруженный профиль
            if (currentProfilePayload && currentProfilePayload.names) {
                // Ищем имя с типом ONEME или CUSTOM
                const nameEntry = currentProfilePayload.names.find(
                    n => n.type === 'ONEME' || n.type === 'CUSTOM'
                );
                if (nameEntry && nameEntry.name) {
                    return nameEntry.name;
                }
            }

            // 2. Если профиля нет или там нет имени, пробуем взять из contactsById
            if (selfId && contactsById[selfId]) {
                const contact = contactsById[selfId];
                if (contact.names) {
                    const nameEntry = contact.names.find(
                        n => n.type === 'ONEME' || n.type === 'CUSTOM'
                    );
                    if (nameEntry && nameEntry.name) {
                        return nameEntry.name;
                    }
                }
            }

            // 3. Если ничего не нашли — возвращаем заглушку
            return 'Пользователь MAX';
        }

        async function sendBotChatMessage() {
            const input = document.getElementById('botChatInput');
            const text = (input?.value || '').trim();
            if (!text || !activeBotChatId) return;
            const bot = getCustomBots().find(b => b.id === activeBotChatId);
            if (!bot) return;
            input.value = '';
            touchCustomBot(activeBotChatId);

            const history = getBotChatHistory(activeBotChatId);
            history.push({ role: 'user', text, ts: Date.now() });
            saveBotChatHistory(activeBotChatId, history);
            renderBotChatMessages();

            try {
                const res = await fetch(normalizeBotBaseUrl(bot.url) + '/api/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: activeBotChatId,
                        user: { id: selfId || null, name: getCurrentUserName() },
                        text,
                        history: history.slice(-20),
                    }),
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const replyText = data.text || '(пустой ответ)';
                const freshHistory = getBotChatHistory(activeBotChatId);
                freshHistory.push({ role: 'bot', text: replyText, ts: Date.now() });
                saveBotChatHistory(activeBotChatId, freshHistory);
                renderBotChatMessages();
            } catch (e) {
                const freshHistory = getBotChatHistory(activeBotChatId);
                freshHistory.push({ role: 'bot', text: '⚠️ Бот недоступен: ' + String(e.message || e), ts: Date.now() });
                saveBotChatHistory(activeBotChatId, freshHistory);
                renderBotChatMessages();
            }
        }

        // ========================================
        // SETTINGS MODAL — МЕНЮ СИСТЕМА
        // ========================================

        class SettingsMenu {
            constructor() {
                this.items = [];
                this.pages = {};
                this.currentPage = null;
                this.menuContainer = document.getElementById('settingsMenu');
                this.contentContainer = document.getElementById('settingsContent');
            }

            addItem(options) {
                this.items.push(options);
                if (options.page) {
                    this.pages[options.id] = options.page;
                }
                return this;
            }

            addDivider() {
                this.items.push({ divider: true });
                return this;
            }

            render() {
                this.menuContainer.innerHTML = '';
                this.contentContainer.innerHTML = '';
                let firstPageId = null;
                this.items.forEach((item) => {
                    if (item.divider) {
                        const hr = document.createElement('hr');
                        hr.className = 'settings-menu-divider';
                        this.menuContainer.appendChild(hr);
                        return;
                    }
                    const btn = document.createElement('button');
                    btn.className = 'settings-menu-item';
                    if (item.danger) btn.classList.add('danger');
                    btn.innerHTML = `
                    <span class="icon">${item.icon || '•'}</span>
                    <span class="label">${item.label}</span>
                    ${item.badge ? `<span class="settings-menu-badge">${item.badge}</span>` : ''}
                    <span class="arrow">›</span>
                `;
                    btn.onclick = () => { this.showPage(item.id); };
                    this.menuContainer.appendChild(btn);
                    if (!firstPageId) firstPageId = item.id;
                });
                Object.entries(this.pages).forEach(([id, pageFn]) => {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'settings-content-page';
                    pageDiv.id = 'page-' + id;
                    pageDiv.innerHTML = pageFn();
                    this.contentContainer.appendChild(pageDiv);
                });
                if (firstPageId) {
                    this.showPage(firstPageId);
                }
            }

            showPage(id) {
                document.querySelectorAll('.settings-content-page').forEach(el => {
                    el.classList.remove('active');
                });
                const page = document.getElementById('page-' + id);
                if (page) {
                    page.classList.add('active');
                }
                this.currentPage = id;
                this.menuContainer.querySelectorAll('.settings-menu-item').forEach((btn, index) => {
                    const items = this.items.filter(it => !it.divider);
                    const item = items[index];
                    if (item && item.id === id) {
                        btn.style.background = 'rgba(0,0,0,0.06)';
                    } else {
                        btn.style.background = 'transparent';
                    }
                });
            }

            refreshPage(id) {
                const pageFn = this.pages[id];
                if (!pageFn) return;
                const pageDiv = document.getElementById('page-' + id);
                if (pageDiv) {
                    pageDiv.innerHTML = pageFn();
                    if (id === 'device' && typeof loadDeviceSettings === 'function') {
                        loadDeviceSettings();
                    }
                }
            }

            refreshAll() {
                Object.keys(this.pages).forEach(id => {
                    this.refreshPage(id);
                });
            }
        }

        // ========================================
        // ОСНОВНАЯ ЛОГИКА
        // ========================================
        let ws = null;
        let isConnected = false;
        let isOfflineCacheMode = false;
        const messagesByChatId = {}; // chatId -> последние сообщения (не более 20), для офлайн-кэша
        let offlineBannerShown = false;
        let explicitOfflineErrors = 0;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 10;
        let reconnectTimer = null;
        let pingInterval = null;
        let otpToken = null;
        let phoneNumber = '';
        let selfId = null; // <-- ОБЪЯВЛЯЕМ selfId ЗДЕСЬ (ПЕРЕД ИСПОЛЬЗОВАНИЕМ)
        let contactsById = {};
        let chatsById = {};
        let currentChatId = null;
        let earliestMessageTime = null;
        let isLoadingMore = false;
        let metadataOverride = {};
        let requestedContactIds = new Set();
        let presenceById = {};

        // Функция проверки авторизации — использует глобальную переменную selfId
        function isAuthenticated() {
            return typeof selfId !== 'undefined' && selfId !== null && selfId !== false;

            try {

            } else {
                entries.forEach(([k, v]) => {
                    html += `
                    <div class="settings-row">
                        <input class="setting-key" placeholder="Название" value="${escapeHtml(k)}">
                        <input class="setting-value" placeholder="Значение" value="${escapeHtml(v)}">
                    </div>
                `;
                });
            }
            html += `
            <div class="settings-content-footer">
                <button class="btn-add" onclick="addSettingRow()">+ переменная</button>
                <button class="btn-save" onclick="saveSettings()">Сохранить</button>
            </div>
        `;
            return html;
        }

        async function loadDeviceSettings() {
            try {
                const res = await fetch('/api/device-settings');
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }
                const data = await res.json();
                const select = document.getElementById('deviceProfileSelect');
                if (!select) return;
                select.innerHTML = Object.entries(data.profiles || {})
                    .map(([id, label]) => `<option value="${id}">${escapeHtml(label)}</option>`)
                    .join('');
                select.value = data.profile === 'custom' ? '' : data.profile;
                select.onchange = async () => {
                    await fetch('/api/device-settings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ profile: select.value }),
                    });
                    log('✅ Профиль устройства изменён (подключится со следующего коннекта)', 'success');
                    loadDeviceSettings();
                };
                const idEl = document.getElementById('deviceIdDisplay');
                if (idEl) idEl.textContent = data.deviceId;

                const countEl = document.getElementById('catalogCountLabel');
                if (countEl) {
                    countEl.textContent = data.catalogCount > 0
                        ? `в каталоге ${data.catalogCount.toLocaleString('ru-RU')} устройств`
                        : 'каталог ещё скачивается, попробуйте обновить через минуту';
                }
                const activeEl = document.getElementById('customDeviceActive');
                if (activeEl) {
                    activeEl.textContent = data.profile === 'custom' && data.customDeviceName
                        ? `Сейчас активно: ${data.customDeviceName}`
                        : '';
                }
                initDeviceCatalogSearch();
            } catch (e) {
                console.error('[device-settings] failed to load', e);
                const select = document.getElementById('deviceProfileSelect');
                if (select) select.innerHTML = '<option value="">Ошибка загрузки</option>';
                const idEl = document.getElementById('deviceIdDisplay');
                if (idEl) idEl.textContent = 'Ошибка: ' + e.message;
            }
        }

        let _catalogSearchTimer = null;
        function initDeviceCatalogSearch() {
            const input = document.getElementById('catalogSearchInput');
            const results = document.getElementById('catalogResults');
            if (!input || !results || input.dataset.wired) return;
            input.dataset.wired = '1';
            input.addEventListener('input', () => {
                clearTimeout(_catalogSearchTimer);
                const q = input.value.trim();
                if (!q) { results.innerHTML = ''; return; }
                _catalogSearchTimer = setTimeout(async () => {
                    try {
                        const res = await fetch('/api/device-catalog?q=' + encodeURIComponent(q) + '&limit=30');
                        const data = await res.json();
                        if (!data.ready) {
                            results.innerHTML = '<div style="padding:8px;color:#888;font-size:12px;">Каталог ещё не скачан</div>';
                            return;
                        }
                        if (!data.matches.length) {
                            results.innerHTML = '<div style="padding:8px;color:#888;font-size:12px;">Ничего не найдено</div>';
                            return;
                        }
                        results.innerHTML = data.matches.map(name => `
                            <div class="catalog-result-item" style="padding:8px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px;"
                                 onclick="selectCatalogDevice('${name.replace(/'/g, "\\'")}')">${escapeHtml(name)}</div>
                        `).join('');
                    } catch (e) {
                        results.innerHTML = '<div style="padding:8px;color:#c00;font-size:12px;">Ошибка поиска: ' + escapeHtml(e.message) + '</div>';
                    }
                }, 250);
            });
        }

        function renderGifPreviewPage() {

        // ========================================
        // CHAT PROFILE MODAL
        // ========================================

        let chatProfileChatId = null;

        // Проверка одного открытого чата (кнопка в профиле чата). Сначала
        // досылаем на бэкенд то, что реально сейчас загружено в память для
        // этого чата (messagesByChatId) — чтобы сканер видел свежие
        // сообщения, а не только то, что попало в кэш раньше. Затем просим
        // бридж просканировать именно этот chatId (см. scan_all_cached_chats
        // с chat_id_filter) и опрашиваем статус.
        async function checkCurrentChatForScam() {
            const chatId = chatProfileChatId;
            const label = document.getElementById('scamCheckChatBtnLabel');
            const out = document.getElementById('scamCheckChatResult');
            // Логируем ПЕРВЫМ делом, до всех проверок — иначе при раннем
            // return (например, chatId не задан) в консоли не будет вообще
            // ничего, и непонятно, сработал ли клик по кнопке.
            console.log('[scam-check][chat-check] нажата кнопка "Проверить чат на скам"',
                { chatId, settingsEnabled: !!(scamCheckSettingsCache && scamCheckSettingsCache.enabled) });
            if (!chatId) {
                console.warn('[scam-check][chat-check] chatProfileChatId не задан — профиль чата открыт некорректно, проверять нечего');
                if (out) out.textContent = '❌ Не удалось определить чат — откройте профиль чата заново и повторите.';
                return;
            }
            if (!scamCheckSettingsCache || !scamCheckSettingsCache.enabled) {
                if (out) out.textContent = '⚠️ Сначала включите скам-проверку в настройках (🛡️ Скам-проверка (ИИ)).';
                console.log('[scam-check][chat-check] skipped: не включено', scamCheckSettingsCache);
                return;
            }
            if (label) label.textContent = 'Проверяю...';
            if (out) out.textContent = '';
            scamScanLoggedCount = 0;
            console.log('[scam-check][chat-check] syncing current messages to cache for chat', chatId,
                messagesByChatId[chatId]);
            if (messagesByChatId[chatId] && messagesByChatId[chatId].length) {
                cacheMessagesToDisk(chatId, messagesByChatId[chatId]);
            }
            try {
                const res = await fetch('/api/scam-check/scan-all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ selfId, chatId }),
                });
                const json = await res.json();
                if (!json.ok) {
                    if (out) out.textContent = '❌ ' + (json.error || 'не удалось запустить');
                    if (label) label.textContent = 'Проверить чат на скам';
                    console.warn('[scam-check][chat-check] start failed', json);
                    return;
                }
                pollScamCheckChatStatus();
            } catch (e) {
                if (out) out.textContent = '❌ ' + (e.message || e);
                if (label) label.textContent = 'Проверить чат на скам';
                console.warn('[scam-check][chat-check] start exception', e);
            }
        }

        // Результаты последнего массового скана — держим отдельно от текста
        // панели, чтобы модалка "Все проверенные" могла их отрисовать по
        // клику на кнопку, не гоняя данные повторно с бэкенда.
        let lastScamAllCheckedResults = [];

        const SCAM_CAT_STYLE = {
            scam: { border: 'rgba(229,57,53,0.3)', bg: 'rgba(229,57,53,0.06)', icon: '⚠️' },
            likely: { border: 'rgba(224,123,0,0.35)', bg: 'rgba(224,123,0,0.07)', icon: '⚠️' },
            safe: { border: 'rgba(0,0,0,0.08)', bg: 'rgba(0,0,0,0.03)', icon: '✅' },
        };

        function renderScamRow(f) {
            const cat = scamCategory(f);
            const s = SCAM_CAT_STYLE[cat] || SCAM_CAT_STYLE.safe;
            const pct = typeof f.confidence === 'number' ? clampPct(f.confidence) : (f.confidence ?? '?');
            return `
                <div style="border:1px solid ${s.border};background:${s.bg};border-radius:8px;padding:8px 10px;margin-bottom:8px;">
                    <div style="font-weight:600;display:flex;justify-content:space-between;"><span>${s.icon} ${pct}%</span></div>
                    ${f.reason ? `<div style="color:#666;margin-top:2px;">${escapeHtml(f.reason)}</div>` : ''}
                    <div style="margin-top:4px;font-style:italic;">«${escapeHtml((f.text || '').slice(0, 200))}»</div>
                </div>
            `;
        }

        function openScamAllCheckedModal() {
            const modal = document.getElementById('scamAllCheckedModal');
            const body = document.getElementById('scamAllCheckedBody');
            const title = document.getElementById('scamAllCheckedTitle');
            if (!modal || !body) return;
            title.textContent = `🛡️ Все проверенные (${lastScamAllCheckedResults.length})`;
            body.innerHTML = lastScamAllCheckedResults.length
                ? lastScamAllCheckedResults.map(renderScamRow).join('')
                : '<div style="color:#888;padding:12px 0;">Пока пусто.</div>';
            modal.classList.add('active');
        }

        function closeScamAllCheckedModal() {
            const modal = document.getElementById('scamAllCheckedModal');
            if (modal) modal.classList.remove('active');
        }

        async function pollScamCheckChatStatus() {
            const label = document.getElementById('scamCheckChatBtnLabel');
            const out = document.getElementById('scamCheckChatResult');
            try {
                const res = await fetch('/api/scam-check/scan-all/status');
                const st = await res.json();
                console.log('[scam-check][chat-check] status', st);
                // Выводим в консоль пары "сообщение - процент на скам" по
                // мере проверки — только те записи из st.results, которых
                // ещё не было в предыдущем опросе (results уже отсортирован
                // по убыванию процента бэкендом, поэтому логируем не по
                // порядку — берём именно новые по количеству).
                if (!('results' in st)) {
                    // Бридж ещё не перезапущен с обновлённым bridge.py (поле
                    // "results" появилось там же, где и подробный лог по
                    // каждому сообщению) — use_reloader=False, апдейт файла
                    // сам по себе процесс не подхватывает. Без перезапуска
                    // покажем то, что есть (только флагнутые), но явно
                    // предупредим, чтобы не искать проблему в другом месте.
                    console.warn('[scam-check][chat-check] в ответе бэкенда нет поля "results" — похоже, запущена старая версия bridge.py. Перезапустите бридж (сам процесс, не просто перезагрузите страницу), чтобы подтянуть обновлённый код с логированием процента по каждому сообщению.');
                }
                const results = (st.results || st.flagged || []).map(f => (
                    typeof f.confidence === 'number' ? { ...f, confidence: clampPct(f.confidence) } : f
                ));
                if (results.length > scamScanLoggedCount) {
                    console.log(`[scam-check][chat-check] новые результаты (${results.length - scamScanLoggedCount}):`);
                    results.slice(scamScanLoggedCount).forEach(f => {
                        const pct = f.confidence ?? '?';
                        console.log(`[scam-check][chat-check] "${(f.text || '').slice(0, 120)}" — ${pct}%${f.is_scam ? ' ⚠️ СКАМ' : ''}`);
                    });
                    scamScanLoggedCount = results.length;
                }
                if (st.running) {
                    if (label) label.textContent = `Проверяю... (${st.checked}/${st.total})`;
                    setTimeout(pollScamCheckChatStatus, 1000);
                    return;
                }
                if (label) label.textContent = 'Проверить чат на скам';
                if (!out) return;
                if (st.error) {
                    out.innerHTML = '❌ ' + escapeHtml(st.error);
                } else if (!st.checked) {
                    out.innerHTML = 'ℹ️ Не найдено сообщений этого чата в кэше (откройте чат, полистайте сообщения и попробуйте снова).';
                } else {
                    const results = (st.results || st.flagged || []).map(f => (
                        typeof f.confidence === 'number' ? { ...f, confidence: clampPct(f.confidence) } : f
                    ));
                    // "Флагнутые" в сводке — вероятно скам ИЛИ скам (confidence >= 50),
                    // а не только жёсткая категория "scam" (>=90).
                    const flaggedCount = results.filter(f => scamCategory(f) !== 'safe').length;
                    const summary = flaggedCount
                        ? `⚠️ Проверено ${st.checked}, найдено подозрительных: ${flaggedCount}`
                        : `✅ Проверено ${st.checked} сообщений — подозрительных не найдено.`;
                    // Список ВСЕХ проверенных сообщений (не только флагнутых) —
                    // отдельная модалка с кнопкой закрытия, а не разворачивающийся
                    // <details> внутри панели (тот было неудобно закрыть).
                    lastScamAllCheckedResults = results;
                    out.innerHTML = summary +
                        (results.length ? `
                            <button type="button" class="settings-menu-item" style="margin-top:8px;width:auto;padding:6px 10px;"
                                onclick="openScamAllCheckedModal()">Показать все проверенные (${results.length})</button>
                        ` : '');
                }
            } catch (e) {
                console.warn('[scam-check][chat-check] poll failed', e);
                if (label) label.textContent = 'Проверить чат на скам';
            }
        }

        function fetchMissingContactInfo() {
            const missing = new Set();
            Object.values(chatsById).forEach(chat => {
                if (chat.type !== 'DIALOG' || chat.id === 0) return;
                const otherId = otherParticipantId(chat);
                if (otherId == null) return;
                if (contactsById[otherId]) return;
                if (metadataOverride[otherId]) return;
                if (requestedContactIds.has(otherId)) return;
                missing.add(otherId);
            });
            if (!missing.size) return;
            const ids = Array.from(missing);
            ids.forEach(id => requestedContactIds.add(id));
            send(32, { contactIds: ids });
        }

        function otherParticipantId(chat) {
            if (!chat || !chat.participants) return null;
            const ids = Object.keys(chat.participants).map(Number);

                // собеседника ещё не пришла), НЕЛЬЗЯ откатываться на ids[0] —
                // это и есть selfId, из-за чего свои же сообщения сравнивались
                // с собственной меткой прочтения и получали ✓✓ (прочитано)
                // ещё до того, как собеседник их вообще увидел.
                const other = ids.find(id => id !== selfId);
                return other !== undefined ? other : null;
            }
            return ids.length ? ids[0] : null;

        }

        function avatarGradient(seed) {
            const str = String(seed ?? '0');
            let h = 0;
            for (let i = 0; i < str.length; i++) {
                h = (h * 31 + str.charCodeAt(i)) >>> 0;
            }

            // 1. Оставляем базовые оттенки
            const hue1 = h % 360;
            const hue2 = (hue1 + 21 + (h % 90)) % 360;

            // 2. ФОРМУЛА НЕОНОВОЙ ЯРКОСТИ (Идеальный диапазон 50% - 65% для сочности)
            // Для вашего seed (h % 13 = 11): 50 + 11 = 61% (самый сочный, "горящий" неон)
            const lightness1 = 50 + (h % 13);

            // Для второй точки делаем контрастный темный неон (около 30-35% яркости)
            // Для вашего seed (h % 11 = 4): 30 + 4 = 34% (глубокий, светящийся в темноте оттенок)
            const lightness2 = 30 + (h % 11);

            // Включаем 100% насыщенность (saturation) для ядовитого эффекта
            return `linear-gradient(135deg, hsl(${hue1},100%,${lightness1}%), hsl(${hue2},100%,${lightness2}%))`;
        }

        function getInitials(name) {
            const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
            if (!parts.length) return '?';
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
        }

        function chatAvatarUrl(chat) {
            if (chat.type === 'DIALOG' && chat.id === 0) {
                return "/assets/favorite.png";
            }
            const otherId = chat.type === 'DIALOG' ? otherParticipantId(chat) : chat.id;
            const meta = metadataOverride[otherId];
            if (meta && meta.avatar) {
                return meta.avatar.startsWith('http') ? '/img?url=' + encodeURIComponent(meta.avatar) : meta.avatar;
            }
            if (chat.baseIconUrl) return '/img?url=' + encodeURIComponent(chat.baseIconUrl);
            if (chat.type === 'DIALOG' && chat.id !== 0) {
                const contact = contactsById[otherId];
                if (contact?.baseUrl) return '/img?url=' + encodeURIComponent(contact.baseUrl);
            }

        function escapeHtml(s) {

        // ========================================
        // ТЕКСТ СООБЩЕНИЙ: разметка MAX (elements: MONOSPACED/STRONG/HEADING/...)
        // + фолбэк на markdown ``` для кастомных ботов + ссылки/упоминания
        // ========================================
        //
        // Реальные сообщения MAX (в т.ч. от встроенных ботов вроде GigaChat)
        // размечаются НЕ через markdown-символы в тексте, а через отдельный
        // массив `elements`: [{ type: 'MONOSPACED'|'STRONG'|'HEADING'|..., from, length }],
        // где from/length — смещения в исходном m.text (индексы UTF-16 code unit,
        // как и обычная длина JS-строки). Если elements нет (например, у
        // кастомных ботов, отвечающих обычным текстом) — используется прежний
        // markdown-парсинг ``` код ``` .

        function buildMessageTextHtml(m) {
            const text = m.text || '';
            if (Array.isArray(m.elements) && m.elements.length) {
                return renderTextWithMaxElements(text, m.elements);
            }
            return renderPlainMessageText(text);
        }

        // Ссылки на max.ru, обычные http(s)-ссылки и @упоминания — общая логика,
        // применяется только к «простым» (неразмеченным) кускам текста.
        function linkifyPlainSegment(escapedSegment) {
            let out = escapedSegment;
            const maxLinkRegex = /(https?:\/\/(?:www\.)?max\.ru\/[^\s<>"']+)/gi;
            out = out.replace(maxLinkRegex, function (url) {
                return `<span class="mention-link" onclick="resolveMaxLink('${url.replace(/'/g, "\\'")}')">${url}</span>`;
            });
            const urlRegex = /(https?:\/\/[^\s<>"']+)/gi;
            out = out.replace(urlRegex, function (url) {
                if (/max\.ru\//i.test(url)) return url; // уже обработано выше
                return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:#007bff;text-decoration:underline;">${url}</a>`;
            });
            const mentionRegex = /(^|[^\w@/])@([A-Za-z][A-Za-z0-9_]{2,31})/g;
            out = out.replace(mentionRegex, function (full, pre, username) {
                return `${pre}<span class="mention-link" onclick="handleMentionClick('${username.replace(/'/g, "\\'")}')">@${username}</span>`;
            });
            return out;
        }

        // Прежний путь: обычный текст (например, от кастомного бота), в котором
        // ``` код ``` — единственный источник разметки.
        function renderPlainMessageText(text) {
            let processedText = escapeHtml(text);
            const { text: textWithoutCode, blocks: codeBlocks } = extractCodeBlocks(processedText);
            processedText = linkifyPlainSegment(textWithoutCode);
            processedText = reinsertCodeBlocks(processedText, codeBlocks);
            return processedText;
        }

        // Новый путь: реальный формат MAX с массивом elements.
        function renderTextWithMaxElements(text, elements) {
            const els = elements
                .filter(e => e && typeof e.from === 'number' && typeof e.length === 'number' && e.length > 0)
                .sort((a, b) => (a.from - b.from) || (b.length - a.length));

            let html = '';
            let pos = 0;
            els.forEach(el => {
                const start = el.from;
                const end = el.from + el.length;
                // Защита от некорректных/пересекающихся диапазонов — пропускаем,
                // если элемент выходит за пределы текста или залезает на предыдущий.
                if (start < pos || end > text.length || end <= start) return;
                html += linkifyPlainSegment(escapeHtml(text.slice(pos, start)));
                html += wrapMaxElement(el, text.slice(start, end));
                pos = end;
            });
            html += linkifyPlainSegment(escapeHtml(text.slice(pos)));
            return html;
        }

        function wrapMaxElement(el, rawInner) {
            const inner = escapeHtml(rawInner);
            switch (String(el.type || '').toUpperCase()) {
                case 'MONOSPACED':
                    return `<code class="msg-inline-code">${inner}</code>`;
                case 'STRONG':
                case 'BOLD':
                    return `<b>${inner}</b>`;
                case 'EMPHASIZED':
                case 'ITALIC':
                    return `<i>${inner}</i>`;
                case 'STRIKETHROUGH':
                case 'STRIKE':
                    return `<s>${inner}</s>`;
                case 'UNDERLINE':
                    return `<u>${inner}</u>`;
                case 'HEADING':
                    return `<div class="msg-heading">${inner}</div>`;
                case 'LINK': {
                    const url = el.url || el.link || '';
                    return url
                        ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" style="color:#007bff;text-decoration:underline;">${inner}</a>`
                        : inner;
                }
                default:
                    // Неизвестный тип разметки — показываем как обычный текст,
                    // чтобы сообщение не потерялось из-за нового/незнакомого типа.
                    return inner;
            }
        }

        // ========================================
        // MARKDOWN: блоки кода ```lang ... ``` с подсветкой языка и кнопкой «Копировать»
        // ========================================
        //
        // Работает поверх уже escapeHtml()-нутого текста (обратные кавычки не
        // экранируются, поэтому регэксп по ним безопасно матчится). Блоки кода
        // вырезаются и заменяются на плейсхолдеры ДО обработки ссылок/упоминаний,
        // чтобы их содержимое не превращалось в кликабельные ссылки, а затем
        // подставляются обратно уже готовым HTML.
        function extractCodeBlocks(escapedText) {
            const codeBlockRegex = /```([a-zA-Z0-9_+#.-]*)[ \t]*\r?\n?([\s\S]*?)```/g;
            const blocks = [];
            const text = escapedText.replace(codeBlockRegex, (match, lang, code) => {
                const trimmedCode = code.replace(/\r?\n$/, '');
