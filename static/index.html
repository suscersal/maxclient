        // ========================================
        // Разделители дат в списке сообщений
        // ========================================
        function dateKeyOf(ts) {
            const d = new Date(ts || Date.now());
            return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        }

        function formatDateSeparatorLabel(ts) {
            const d = new Date(ts || Date.now());
            const now = new Date();
            const startOfDay = (dt) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()).getTime();
            const diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
            if (diffDays === 0) return 'Сегодня';
            if (diffDays === 1) return 'Вчера';
            const sameYear = d.getFullYear() === now.getFullYear();
            return d.toLocaleDateString('ru-RU', sameYear
                ? { day: 'numeric', month: 'long' }
                : { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function createDateSeparatorElement(ts) {
            const el = document.createElement('div');
            el.className = 'date-separator';
            el.dataset.dateKey = dateKeyOf(ts);
            el.textContent = formatDateSeparatorLabel(ts);
            return el;
        }

        // Полный пересчёт разделителей по всему списку — надёжнее точечной
        // вставки при prepend/append (не плодит дубликаты и пропуски при
        // подгрузке истории вверх/вниз).
        function reconcileDateSeparators(list) {
            list.querySelectorAll('.date-separator').forEach(el => el.remove());
            const bubbles = Array.from(list.querySelectorAll('.msg-bubble[data-msg-id]'));
            let lastKey = null;
            bubbles.forEach(bubble => {
                const ts = Number(bubble.dataset.msgTime) || 0;
                const key = dateKeyOf(ts);
                if (key !== lastKey) {
                    list.insertBefore(createDateSeparatorElement(ts), bubble);
                    lastKey = key;
                }
            });
        }

        // ========================================
        // Отметка сообщений прочитанными (CHAT_MARK, opcode 50)
        // ========================================
        function isGhostReadEnabled(chatId) {
            try {
                const all = JSON.parse(localStorage.getItem('maxclient_ghost_read') || '{}');
                return !!all[chatId];
            } catch (_) {
                return false;
            }
        }

        // Берём самое новое сообщение с подтверждённым сервером числовым id —
        // так же, как это исправлено в Dart-клиенте: если бы среди сообщений
        // попадались временные (ещё не подтверждённые) id, отметка о прочтении
        // на них не должна тихо теряться.
        function findLastReadableMessage(messages) {
            for (let i = messages.length - 1; i >= 0; i--) {
                const m = messages[i];
                const idNum = Number(m.id);
                if (Number.isFinite(idNum)) return m;
            }
            return null;
        }

        function sendReadMark(chatId, message) {
            if (!message || chatId == null) { console.log('[readmark] abort: no message/chatId', { chatId, message }); return; }
            if (!isConnected || !ws || ws.readyState !== WebSocket.OPEN) { console.log('[readmark] abort: ws not open', { isConnected, wsState: ws && ws.readyState }); return; }
            if (isGhostReadEnabled(chatId)) { console.log('[readmark] abort: ghost mode on for chat', chatId); return; }

            // ВАЖНО: id сообщений в MAX — большие 64-битные числа, зачастую
            // превышающие Number.MAX_SAFE_INTEGER (2^53-1). На бэкенде
            // (bridge.py, stringify_big_ints) такие id уходят в браузер как
            // СТРОКИ, чтобы не терять точность. Если прогнать message.id через
            // Number(...) и отправить именно это число обратно — оно округлится,
            // и на сервер уйдёт messageId, который не совпадает с реальным.
            // Сервер такую отметку молча игнорирует, поэтому чужой клиент
            // продолжает видеть сообщение непрочитанным. Используем Number()
            // только для проверки, что id вообще валиден, а отправляем исходное
            // значение как есть (bridge.py сам развернёт строку обратно в
            // точный int через numify_big_int_strings).
            const msgId = message.id;
            if (msgId == null || !Number.isFinite(Number(msgId))) { console.log('[readmark] abort: bad msgId', msgId); return; }

            const chat = chatsById[chatId];
            if (chat && !chat.newMessages && (chat.lastReadMark ?? 0) >= (message.time || 0)) { console.log('[readmark] abort: already marked', { newMessages: chat.newMessages, lastReadMark: chat.lastReadMark, msgTime: message.time }); return; }

            console.log('[readmark] SENDING opcode 50', { chatId, msgId, mark: message.time });
            send(50, {
                type: 'READ_MESSAGE',
                chatId,
                messageId: msgId,
                mark: message.time || Date.now(),
            });

            if (chat) {
                chat.newMessages = 0;
                chat.lastReadMark = message.time || Date.now();
                const badge = document.querySelector(`.chat-item[data-chat-id="${chatId}"] .unread`);
                if (badge) badge.remove();
            }
        }

        // Отмечаем прочитанным то, что видно в открытом чате прямо сейчас.
        function markCurrentChatRead(messages) {
            if (currentChatId == null) { console.log('[readmark] markCurrentChatRead abort: no currentChatId'); return; }
            const chatDetailOpen = !document.getElementById('chatDetailSection').classList.contains('hidden');
            if (!chatDetailOpen) { console.log('[readmark] markCurrentChatRead abort: chat detail hidden'); return; }
            const last = findLastReadableMessage(messages);
            console.log('[readmark] markCurrentChatRead', { currentChatId, messagesCount: messages.length, last });
            if (last) sendReadMark(currentChatId, last);
        }

        async function renderMessages(payload, prepend) {
            const list = document.getElementById('messagesList');
            const existingIds = new Set();
            list.querySelectorAll('.msg-bubble[data-msg-id]').forEach(el => {
                existingIds.add(el.dataset.msgId);
            });
            const messages = (payload.messages || []).slice().sort((a, b) => (a.time || 0) - (b.time || 0));
            const newMessages = messages.filter(m => !existingIds.has(String(m.id)));

            if (newMessages.length === 0) {
                isLoadingMore = false;
                return;
            }

            await e2ePreprocessMessages(newMessages, currentChatId);

            updateMessagesCache(currentChatId, newMessages);

            const batchMinTime = Math.min(...newMessages.map(m => m.time || Infinity));
            if (earliestMessageTime == null || batchMinTime < earliestMessageTime) {
                earliestMessageTime = batchMinTime;
            }

            console.log('[readmark] renderMessages branch', { prepend, currentChatId, newMessagesCount: newMessages.length });
            if (prepend) {
                const prevScrollHeight = list.scrollHeight;
                const prevScrollTop = list.scrollTop;
                const frag = document.createDocumentFragment();
                newMessages.forEach(m => frag.appendChild(createMessageElement(m, messages)));
                list.insertBefore(frag, list.firstChild);
                reconcileDateSeparators(list);
                list.scrollTop = prevScrollTop + (list.scrollHeight - prevScrollHeight);
                isLoadingMore = false;
            } else {
                newMessages.forEach(m => insertMessageInOrder(list, createMessageElement(m, messages)));
                reconcileDateSeparators(list);
                list.scrollTop = list.scrollHeight;
                // Открытый чат догнал историю до конца — отмечаем прочитанным.
                markCurrentChatRead(messages);
            }

            // --------------------------------------------
            // ЗАГРУЖАЕМ Lottie-стикеры для всех сообщений
            // (повторный вызов не перезагружает, если уже загружено)
            // --------------------------------------------
            const stickerContainers = list.querySelectorAll('.msg-attach.msg-sticker[data-lottie-url]');
            stickerContainers.forEach(container => {
                const url = container.dataset.lottieUrl;
                const holderId = container.dataset.holderId;
                if (url && holderId) {
                    loadLottieSticker(holderId, url);
                }
            });

            // --------------------------------------------
            // Догружаем видео-источник для GIF-вложений, у которых нет
            // прямой ссылки на анимированный файл (см. createGifPreview) —
            // только для тех, что ещё не подменены на <video> (без него
            // internal <img> — постер-заглушка, поэтому проверяем именно
            // его отсутствие, а не факт "новизны" контейнера).
            const gifContainers = list.querySelectorAll('.msg-gif-container');
            gifContainers.forEach(container => {
                if (!container.querySelector('video')) {
                    initGifVideo(container);
                }
            });
        }

        document.getElementById('messagesList').addEventListener('scroll', function () {
            if (this.scrollTop < 50 && !isLoadingMore && earliestMessageTime != null && currentChatId != null) {
                isLoadingMore = true;
                send(49, {
                    chatId: currentChatId,
                    from: earliestMessageTime - 1,
                    forward: 0,
                    backward: 10,
                    getMessages: true,
                });
            }
        });

        function connect() {
            if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
                log('❌ Достигнут лимит попыток переподключения', 'error');
                setStatus('Connection lost', 'error');
                hideLoadingOverlay();
                showOfflineCachedChats();
                return;
            }
            // Если у устройства физически нет сети (самолётный режим, нет
            // wi-fi/данных) — не долбим /relay безуспешными WS-хендшейками
            // (это лишь плодит WS-ошибки в консоли и тратит время), а сразу
            // показываем то, что есть локально.
            if ('onLine' in navigator && !navigator.onLine) {
                log('📴 Устройство офлайн — подключение не выполняется', 'info');
                setStatus('Нет интернета', 'error');
                hideLoadingOverlay();
                showOfflineCachedChats();
                return;
            }
            log('Подключение... (попытка ' + (reconnectAttempts + 1) + ')');
            setStatus('Подключение...', 'info');
            ws = new WebSocket(`ws://${window.location.host}/relay`);
            ws.onopen = () => {
                isConnected = true;
                reconnectAttempts = 0;
                explicitOfflineErrors = 0;
                isOfflineCacheMode = false;
                offlineBannerShown = false;
                removeOfflineBanner();
                setStatus('Подключено', 'success');
                document.getElementById('connectionBadge').textContent = 'Online';
                document.getElementById('connectionBadge').className = 'badge online';
                log('✅ Подключено');
                if (pingInterval) clearInterval(pingInterval);
                pingInterval = setInterval(() => {
                    if (isConnected && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ opcode: 0, payload: {} }));
                    }
                }, 25000);
            };
            ws.onmessage = async (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.error && data.offline && !data.opcode && !data.type) {
                        // Наш собственный bridge.py не смог достучаться до сервера
                        // MAX (нет интернета / сервер недоступен) — это надёжный
                        // сигнал, не ждём, пока израсходуются все попытки
                        // переподключения, а реагируем сразу.
                        explicitOfflineErrors++;
                        log(`🌐 Нет соединения с сервером MAX: ${data.details}`, 'error');
                        setStatus('Нет интернета', 'error');
                        if (explicitOfflineErrors >= 1) {
                            showOfflineCachedChats();
                        }
                        return;
                    }
                    if (data.opcode === 0 && data.payload?.pong) return;
                    if (data.type === 'connected') { log(`✅ ${data.message}`, 'success'); return; }
                    if (data.type === 'session_restored') {
                        log(`✅ ${data.message}`, 'success');
                        setStatus('Авторизован', 'success');
                        showAuthenticatedUI();
                        send(19, { chatsSync: 0, contactsSync: 0, interactive: true });
                        return;
                    }
                    if (data.type === 'auth_required') {
                        log('🔒 Требуется авторизация', 'info');
                        showLoginUI();
                        return;
                    }
                    if (data._auth_error ||
                        (data.opcode === 19 && data.cmd === 768 &&
                            data.payload?.localizedMessage?.includes('авторизируйтесь'))) {
                        log('❌ Сессия истекла. Требуется повторная авторизация.', 'error');
                        setStatus('Сессия истекла', 'error');
                        showLoginUI();
                        document.getElementById('connectionBadge').className = 'badge auth-error';
                        document.getElementById('connectionBadge').textContent = 'Auth Error';
                        return;
                    }
                    if (data.opcode === 32 && data.cmd === 768) {
                        // Фоновый дозапрос инфо о боте/собеседнике — не показываем
                        // пользователю ошибку, просто оставляем как "Контакт #ID".
                        return;
                    }
                    if ((data.opcode === 46 || data.opcode === 60 || data.opcode === 89) && data.cmd === 768) {
                        handleSearchOrLinkError(data.opcode, data.payload);
                        return;
                    }
                    if (data.cmd === 768) {
                        const err = data.payload?.localizedMessage || data.payload?.error || 'Ошибка';

                        if (err === "Ошибка валидации") {
                            log('Ошибка отправки сообщения', 'error')
                            setStatus('Ошибка валидации сообщения. Возможно вы привысили лимит символов в одном сообщении', 'error')
                        }
                        else {
                            log(`❌ ${err}`, 'error');
                            setStatus(`Ошибка: ${err}`, 'error');
                        }
                        return;
                    }
                    if (data.opcode === 17 && data.cmd === 256) {
                        otpToken = data.payload.token;
                        log('✅ Код отправлен!', 'success');
                        document.getElementById('authStatus').textContent = '✅ Код отправлен. Введите код из SMS.';
                        startResendTimer(60);
                        return;
                    }
                    if (data.opcode === 18 && data.cmd === 256) {
                        if (data.payload?.passwordChallenge) {
                            const pc = data.payload.passwordChallenge;
                            document.getElementById('passwordSection').classList.remove('hidden');
                            document.getElementById('passwordHint').textContent = '💡 Подсказка: ' + (pc.hint || '');
                            document.getElementById('passwordEmail').textContent = '📧 ' + (pc.email || '');
                            document.getElementById('authStatus').textContent = '🔒 Требуется ввод пароля';
                            log('🔒 Требуется ввод пароля', 'info');
                            return;
                        }
                        log('✅ Авторизация успешна!', 'success');
                        setStatus('Авторизован', 'success');
                        showAuthenticatedUI();
                        send(19, { chatsSync: 0, contactsSync: 0, interactive: true });
                        return;
                    }
                    if (data.opcode === 20 && data.cmd === 256) {
                        log('✅ Авторизация с паролем успешна!', 'success');
                        setStatus('Авторизован', 'success');
                        showAuthenticatedUI();
                        document.getElementById('passwordSection').classList.add('hidden');
                        document.getElementById('password').value = '';
                        send(19, { chatsSync: 0, contactsSync: 0, interactive: true });
                        return;
                    }
                    if (data.opcode === 19 && data.cmd === 256) {


                        console.log(JSON.stringify(data.payload, null, 2))

                        if (data.payload?.profile?.contact) {
                            currentProfilePayload = data.payload.profile.contact;

                            // Обновляем selfId для совместимости со старым кодом
                            selfId = currentProfilePayload.id;

                            // Также сразу кладем себя в справочник контактов, 
                            // чтобы функции аватаров могли найти нас по contactsById[selfId]
                            contactsById[selfId] = currentProfilePayload;
                        }


                        renderChats(data.payload);
                        setTimeout(hideLoadingOverlay, 500);
                        return;
                    }
                    if (data.opcode === 49 && data.cmd === 256) {



                        console.log(JSON.stringify(data.payload, null, 2))



                        renderMessages(data.payload, isLoadingMore);
                        return;
                    }
                    if (data.opcode === 32 && data.cmd === 256) {
                        const contacts = data.payload?.contacts;
                        if (Array.isArray(contacts) && contacts.length) {
                            contacts.forEach(c => {
                                if (c && typeof c.id === 'number') contactsById[c.id] = c;
                            });
                            renderChats({ chats: Object.values(chatsById), contacts: Object.values(contactsById) });
                        }
                        return;
                    }
                    if (data.opcode === 46 && data.cmd === 256) {
                        handlePhoneSearchResult(data.payload);
                        return;
                    }
                    if (data.opcode === 60 && data.cmd === 256) {
                        handlePublicSearchResult(data.payload);
                        return;
                    }
                    if (data.opcode === 89 && data.cmd === 256) {
                        handleLinkResolved(data.payload);
                        return;
                    }
                    if (data.opcode === 64 && data.cmd === 256) {
                        document.getElementById('messageText').value = '';
                        send(49, {
                            chatId: currentChatId, from: Date.now() + 86400000, forward: 0, backward: 50,
                            getMessages: true
                        });
                        return;
                    }
                    if (data.opcode === 130 && data.payload) {
                        const p = data.payload;
                        if (p.chatId != null && p.userId != null && p.mark != null) {
                            const chat = chatsById[p.chatId];
                            if (chat) {
                                if (!chat.participants) chat.participants = {};
                                chat.participants[p.userId] = p.mark;
                                if (p.chatId === currentChatId) {
                                    document.querySelectorAll('#messagesList .msg-bubble.own').forEach(bubble => {
                                        const msgId = bubble.dataset.msgId;
                                        const statusEl = bubble.querySelector('.msg-status');
                                        if (statusEl && msgId != null) {
                                            try {
                                                if (BigInt(msgId) <= BigInt(p.mark)) {
                                                    statusEl.outerHTML =
                                                        '<span class="msg-status read">✓✓</span>';
                                                }
                                            } catch (e) { }
                                        }
                                    });
                                }
                            }
                        }
                        return;
                    }
                    if (data.opcode === 132 && data.payload) {
                        const uid = data.payload.userId;
                        const p = data.payload.presence;

                        if (uid != null && p) {
                            // 🔥 ЗАГРУЗКА: получаем сохранённое время последнего визита
                            let savedLastSeen = null;
                            try {
                                const allPresences = JSON.parse(localStorage.getItem('user\_presences')) || {};
                                savedLastSeen = allPresences[uid]?.lastSeen || null;
                            } catch (e) { }

                            // Обновляем текущий статус
                            presenceById[uid] = {
                                online: p.status === 1,
                                seen: p.seen || 0
                            };

                            // 🔥 СОХРАНЕНИЕ: записываем текущее присутствие
                            try {
                                let allPresences = JSON.parse(localStorage.getItem('user\_presences')) || {};

                                allPresences[uid] = {
                                    online: p.status === 1,
                                    lastSeen: Date.now(),
                                    rawSeen: p.seen || 0,
                                    statusCode: p.status
                                };

                                // Ограничиваем до 50 последних пользователей
                                const userIds = Object.keys(allPresences);
                                if (userIds.length > 50) {
                                    const sorted = userIds.sort((a, b) => allPresences[b].lastSeen - allPresences[a].lastSeen);
                                    for (let i = 50; i < sorted.length; i++) {
                                        delete allPresences[sorted[i]];
                                    }
                                }

                                localStorage.setItem('user\_presences', JSON.stringify(allPresences));
                            } catch (e) { }

                            if (currentChatId) {
                                const chat = chatsById[currentChatId];
                                if (chat && chat.type === 'DIALOG' && otherParticipantId(chat) == uid) {
                                    const statusEl = document.getElementById('chatDetailStatus');
                                    if (statusEl) {
                                        if (p.status === 1) {
                                            // Пользователь онлайн
                                            statusEl.textContent = 'в сети';
                                            statusEl.style.color = '#4caf50';
                                        } else {
                                            // Пользователь офлайн — показываем время
                                            let timeText = '';

                                            if (savedLastSeen) {
                                                const diffMs = Date.now() - savedLastSeen;
                                                const diffMins = Math.floor(diffMs / 60000);

                                                if (diffMins < 60) {
                                                    timeText = `{diffMins} мин. назад`;
                                                } else if (diffMins < 1440) {
                                                    timeText = `{Math.floor(diffMins / 60)} ч. назад`;
                                                } else {
                                                    timeText = `{Math.floor(diffMins / 1440)} дн. назад`;
                                                }
                                            } else if (p.seen) {
                                                // Fallback на серверные данные
                                                const serverTime = new Date(p.seen * 1000);
                                                const now = new Date();
                                                const diffMinutes = Math.floor((now - serverTime) / 60000);

                                                if (diffMinutes < 60) {
                                                    timeText = diffMinutes + 'мин. назад';
                                                } else if (diffMinutes < 1440) {
                                                    timeText = Math.floor(diffMinutes / 60) + 'ч. назад';
                                                } else {
                                                    timeText = Math.floor(diffMinutes / 1440) + 'дн. назад';
                                                }
                                            }
                                        }
                                    }
                                }
                                return;
                            }
                        }
                    }

                    // notifMessage — новое входящее сообщение в реальном времени
                    if (data.opcode === 128 && data.payload) {
                        const msg = data.payload.message || data.payload;
                        const chatId = data.payload.chatId ?? msg.chatId;
                        if (chatId == null) return;

                        await e2ePreprocessMessage(msg, chatId);

                        if (chatsById[chatId]) {
                            chatsById[chatId].lastMessage = msg;
                            chatsById[chatId].lastEventTime = msg.time || Date.now();
                        }

                        // Функция для очистки текста от HTML-тегов
                        const stripHtml = (html) => {
                            const tmp = document.createElement("DIV");
                            tmp.innerHTML = html;
                            return tmp.textContent || tmp.innerText || "";
                        };

                        const chatDetailOpen = !document.getElementById('chatDetailSection').classList.contains('hidden');

                        if (chatId === currentChatId && chatDetailOpen) {
                            const list = document.getElementById('messagesList');
                            const el = createMessageElement(msg);
                            insertMessageInOrder(list, el);
                            reconcileDateSeparators(list);
                            list.scrollTop = list.scrollHeight;
                            // Сообщение видно прямо сейчас в открытом чате — читаем.
                            sendReadMark(chatId, msg);
                        } else if (msg.sender !== selfId) {
                            // Чат не открыт — показываем системное уведомление 
                            const chat = chatsById[chatId];
                            const senderName = chat ? chatDisplayName(chat) : 'Новое сообщение';

                            if ('Notification' in window && Notification.permission === 'granted') {
                                const avatar = chat ? chatAvatarUrl(chat) : null;
                                const icon = avatar && avatar.startsWith('http') ? avatar : undefined;

                                // Очищаем имя и текст сообщения от тегов перед отправкой в Notification
                                const cleanSenderName = stripHtml(senderName);
                                const cleanBodyText = msg.text ? stripHtml(msg.text) : '📎 Вложение';

                                const n = new Notification(cleanSenderName, {
                                    body: cleanBodyText,
                                    icon,
                                });

                                n.onclick = () => {
                                    window.focus();
                                    if (chatsById[chatId]) openChat(chatId);
                                };
                            }
                        }

                        return;

                    }
                } catch (err) {
                    console.error('[ws error]', err);
                }
            };
            ws.onclose = () => {
                isConnected = false;
                if (pingInterval) clearInterval(pingInterval);
                setStatus('Отключено', 'error');
                document.getElementById('connectionBadge').textContent = 'Offline';
                document.getElementById('connectionBadge').className = 'badge offline';
                log('🔌 Отключено', 'error');
                const delay = 300;

                }
            };
        }

        // ========================================
        // E2E-ШИФРОВАНИЕ (ECDH P-256 + AES-256-GCM)
        // ========================================
        const e2eSessions = {}; // chatId -> { status: 'pending'|'active', keyPair?, aesKey? }
        const e2ePendingIncoming = {}; // chatId -> true, пока показан confirm() на входящий запрос
        const e2eProcessedHandshakeIds = new Set(); // id сообщений с уже обработанным handshake-payload

        const E2E_HS_START = '\u2063\u2063\u2063\u2063'; // invisible separator x4 — начало служебных данных
        const E2E_HS_END = '\u2064\u2064\u2064\u2064';   // invisible plus x4 — конец служебных данных
        const E2E_MSG_PREFIX = '⛨E2E:';

        function e2eBytesToBase64(bytes) {
            let bin = '';
            bytes.forEach(b => bin += String.fromCharCode(b));
            return btoa(bin);
        }
        function e2eBase64ToBytes(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }

        // Кодируем произвольные байты невидимыми символами (ZWSP/ZWNJ = биты 0/1)
        function e2eBytesToInvisible(bytes) {
            let out = '';
            for (const b of bytes) {
                for (let i = 7; i >= 0; i--) {
                    out += (b >> i) & 1 ? '\u200C' : '\u200B';
                }
            }
            return out;
        }
        function e2eInvisibleToBytes(str) {
            const bytes = [];
            for (let i = 0; i + 8 <= str.length; i += 8) {
                let byte = 0;
                for (let j = 0; j < 8; j++) {
                    byte = (byte << 1) | (str[i + j] === '\u200C' ? 1 : 0);
                }
                bytes.push(byte);
            }
            return new Uint8Array(bytes);
        }

        // Прячем служебный JSON (запрос/подтверждение шифрования) в конец видимого текста
        function e2eEmbedPayload(visibleText, payloadObj) {
            const bytes = new TextEncoder().encode(JSON.stringify(payloadObj));
            return visibleText + E2E_HS_START + e2eBytesToInvisible(bytes) + E2E_HS_END;
        }
        function e2eExtractPayload(text) {
            if (!text) return null;
            const si = text.indexOf(E2E_HS_START);
            const ei = text.indexOf(E2E_HS_END);
            if (si === -1 || ei === -1 || ei <= si) return null;
            try {
                const bytes = e2eInvisibleToBytes(text.slice(si + E2E_HS_START.length, ei));
                return JSON.parse(new TextDecoder().decode(bytes));
            } catch (e) { return null; }
        }
        function e2eStripPayload(text) {
            const si = text.indexOf(E2E_HS_START);
            const ei = text.indexOf(E2E_HS_END);
            if (si === -1 || ei === -1) return text;
            return (text.slice(0, si) + text.slice(ei + E2E_HS_END.length)).trim();
        }

        // --- Персистентность активных сессий (localStorage) ---
        function e2eLoadPersisted() {
            try { return JSON.parse(localStorage.getItem('maxclient_e2e') || '{}'); } catch (e) { return {}; }
        }
        function e2eSavePersistedMap(map) {
            localStorage.setItem('maxclient_e2e', JSON.stringify(map));
        }
        async function e2ePersistActive(chatId, aesKey) {
            const raw = new Uint8Array(await crypto.subtle.exportKey('raw', aesKey));
            const map = e2eLoadPersisted();
            map[chatId] = { status: 'active', k: e2eBytesToBase64(raw) };
            e2eSavePersistedMap(map);
        }
        async function e2eRestoreForChat(chatId) {
            const entry = e2eLoadPersisted()[chatId];
            if (entry && entry.status === 'active' && entry.k) {
                try {
                    const aesKey = await crypto.subtle.importKey(
                        'raw', e2eBase64ToBytes(entry.k), { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
                    e2eSessions[chatId] = { status: 'active', aesKey };
                    return 'active';
                } catch (e) { /* повреждённый ключ — сбрасываем */ }
            }
            delete e2eSessions[chatId];
            return 'none';
        }

        // --- UI ---
        function e2eSetUiStatus(chatId, status) {
            if (chatId !== currentChatId) return;
            const cb = document.getElementById('e2eCheckbox');
            const icon = document.getElementById('e2eStatusIcon');
            if (!cb || !icon) return;
            if (status === 'active') {
                cb.checked = true; cb.disabled = false;
                icon.textContent = '🔒'; icon.title = 'Шифрование включено';
            } else if (status === 'pending') {
                cb.checked = true; cb.disabled = true;
                icon.textContent = '⏳'; icon.title = 'Ожидание подтверждения...';
            } else {
                cb.checked = false; cb.disabled = false;
                icon.textContent = '🔓'; icon.title = 'Шифрование выключено';
            }
        }

        function onE2eCheckboxChange() {
            const cb = document.getElementById('e2eCheckbox');
            if (!currentChatId) { cb.checked = false; return; }
            if (cb.checked) {
                e2eStartHandshake(currentChatId);
            } else {
                delete e2eSessions[currentChatId];
                const map = e2eLoadPersisted();
                delete map[currentChatId];
                e2eSavePersistedMap(map);
                e2eSetUiStatus(currentChatId, 'none');
                log('🔓 Шифрование выключено для чата ' + currentChatId, 'info');
            }
        }

        // --- Handshake ---
        async function e2eStartHandshake(chatId) {
            const keyPair = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
            e2eSessions[chatId] = { status: 'pending', keyPair };
            e2eSetUiStatus(chatId, 'pending');
            const pubRaw = new Uint8Array(await crypto.subtle.exportKey('raw', keyPair.publicKey));
            const text = e2eEmbedPayload('🔐 Запрос на включение шифрования', { t: 'req', k: e2eBytesToBase64(pubRaw) });
            send(64, { chatId, message: { text, cid: Date.now(), attaches: [] }, notify: true });
            log('🔐 Отправлен запрос на шифрование для чата ' + chatId, 'info');
        }

        async function e2eHandleHandshakePayload(chatId, payload) {
            if (!payload || !payload.t || !payload.k) return;
            let peerKey;
            try {
                peerKey = await crypto.subtle.importKey(
                    'raw', e2eBase64ToBytes(payload.k), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
            } catch (e) { return; }

            if (payload.t === 'req') {
                // Не включаем шифрование молча — спрашиваем пользователя перед подтверждением
                if (e2ePendingIncoming[chatId]) return; // запрос уже показан, не дублируем
                e2ePendingIncoming[chatId] = true;
                const accepted = confirm('Собеседник хочет включить E2E-шифрование для этого чата. Принять?');
                delete e2ePendingIncoming[chatId];
                if (!accepted) {
                    log('🔓 Запрос на шифрование отклонён для чата ' + chatId, 'info');
                    return;
                }
                const keyPair = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']);
                const aesKey = await crypto.subtle.deriveKey(
                    { name: 'ECDH', public: peerKey }, keyPair.privateKey, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
                e2eSessions[chatId] = { status: 'active', aesKey };
                await e2ePersistActive(chatId, aesKey);
                e2eSetUiStatus(chatId, 'active');
                const pubRaw = new Uint8Array(await crypto.subtle.exportKey('raw', keyPair.publicKey));
                const text = e2eEmbedPayload('🔐 Шифрование включено', { t: 'ack', k: e2eBytesToBase64(pubRaw) });
                send(64, { chatId, message: { text, cid: Date.now(), attaches: [] }, notify: true });
                log('🔒 Шифрование установлено для чата ' + chatId, 'success');
            } else if (payload.t === 'ack') {
                const session = e2eSessions[chatId];
                if (!session || session.status !== 'pending' || !session.keyPair) return;
                const aesKey = await crypto.subtle.deriveKey(
                    { name: 'ECDH', public: peerKey }, session.keyPair.privateKey, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
                e2eSessions[chatId] = { status: 'active', aesKey };
                await e2ePersistActive(chatId, aesKey);
                e2eSetUiStatus(chatId, 'active');
                log('🔒 Шифрование установлено для чата ' + chatId, 'success');
            }
        }

        // --- Шифрование/расшифровка текста сообщений ---
        async function e2eEncryptText(aesKey, plaintext) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ctBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, new TextEncoder().encode(plaintext));
            const combined = new Uint8Array(iv.length + ctBuf.byteLength);
            combined.set(iv, 0);
            combined.set(new Uint8Array(ctBuf), iv.length);
            return E2E_MSG_PREFIX + e2eBytesToBase64(combined);
        }
        async function e2eDecryptText(aesKey, encoded) {
            const raw = e2eBase64ToBytes(encoded.slice(E2E_MSG_PREFIX.length));
            const iv = raw.slice(0, 12);
            const ct = raw.slice(12);
            const ptBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, ct);
            return new TextDecoder().decode(ptBuf);
        }

        // Обрабатывает одно входящее сообщение: расшифровывает, либо ловит handshake-payload
        async function e2ePreprocessMessage(m, chatId) {
            if (!m || typeof m.text !== 'string') return;
            if (m.text.startsWith(E2E_MSG_PREFIX)) {
                const session = e2eSessions[chatId];
                if (session && session.status === 'active') {
                    try {
                        m.__e2e = { encrypted: true, ok: true, text: await e2eDecryptText(session.aesKey, m.text) };
                    } catch (e) {
                        m.__e2e = { encrypted: true, ok: false };
                    }
                } else {
                    m.__e2e = { encrypted: true, ok: false };
                }
                return;
            }
            const hs = e2eExtractPayload(m.text);
            if (hs) {
                m.text = e2eStripPayload(m.text);
                // Пока не знаем свой ID (профиль ещё не подгрузился/переподключение) —
                // невозможно достоверно отличить своё сообщение от чужого, поэтому
                // ничего не показываем — иначе можно словить ложный confirm() на
                // собственный же запрос.
                if (selfId == null) return;
                // Это наше собственное сообщение (мы сами отправили req/ack) —
                // не запрашивать подтверждение у самих себя. Сравниваем через
                // String(), т.к. sender иногда приходит в другом типе, чем selfId.
                if (String(m.sender) === String(selfId)) return;
                // Один и тот же handshake (например, при повторном открытии чата
                // и повторной загрузке той же истории) не должен обрабатываться
                // заново — иначе confirm() всплывал бы каждый раз.
                const msgKey = String(chatId) + ':' + String(m.id);
                if (e2eProcessedHandshakeIds.has(msgKey)) return;
                e2eProcessedHandshakeIds.add(msgKey);
                e2eHandleHandshakePayload(chatId, hs); // не блокируем рендер
            }
        }
        async function e2ePreprocessMessages(messages, chatId) {
            for (const m of messages) await e2ePreprocessMessage(m, chatId);
        }

        applySettingsVars(loadSettingsVars());
        checkAuth();
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        ensureScamCheckSettingsLoaded();
        connect();

        window.addEventListener('online', () => {
            log('🌐 Сеть появилась — переподключаемся', 'info');
            reconnectAttempts = 0;
            if (reconnectTimer) clearTimeout(reconnectTimer);
            if (!isConnected) connect();
        });

        window.onbeforeunload = () => { if (ws) ws.close(); };
        // ========================================
        // КЕШИРОВАНИЕ ЭМОДЗИ (Cache API)
        // ========================================
        async function preloadEmojis() {
            try {
                const cache = await caches.open('emoji-cache-v1');
                const urls = Object.values(window.EMOJI_CDN_URLS || {});
                // Загружаем все уникальные URL
                const uniqueUrls = [...new Set(urls)];
                // Кешируем их
                await cache.addAll(uniqueUrls);
                console.log('[emoji-cache] Preloaded', uniqueUrls.length, 'emojis');
            } catch (e) {
                console.warn('[emoji-cache] Preload failed', e);
            }
        }

        // Функция получения кешированного URL для эмодзи (если в кеше нет, возвращает исходный URL)
        async function getCachedEmojiUrl(emoji) {
            const src = window.EMOJI_CDN_URLS && window.EMOJI_CDN_URLS[emoji];
            if (!src) return null;
            // Пытаемся получить из кеша, но если нет – возвращаем исходный
            try {
                const cache = await caches.open('emoji-cache-v1');
                const response = await cache.match(src);
                if (response) {
                    // Можно вернуть blob URL, но проще вернуть исходный URL – браузер возьмёт из кеша
                    // Чтобы избежать лишнего запроса, можно вернуть src, т.к. браузер сам будет использовать кеш.
                    return src;
                } else {
                    // Если нет в кеше – загружаем и сохраняем
                    const fetchResp = await fetch(src);
                    if (fetchResp.ok) {
                        await cache.put(src, fetchResp.clone());
                        return src;
                    } else {
                        return src; // fallback
                    }
                }
            } catch (e) {
                return src; // fallback
            }
        }

        // Запускаем предзагрузку при старте (можно вызывать после авторизации)
        // Предлагаем вызывать после того, как пользователь авторизовался и загрузились чаты.
        // Можно вставить вызов в функцию showAuthenticatedUI()
        // Например:
        const originalShowAuthenticatedUI = window.showAuthenticatedUI;
        window.showAuthenticatedUI = function () {
            originalShowAuthenticatedUI.apply(this, arguments);
            setTimeout(preloadEmojis, 1000); // предзагружаем после показа UI
        };

    </script>
    <script src="lottie.min.js"></script>
