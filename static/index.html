<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX Client</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            background: #f5f5f5;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #007bff;
        }

        .section {
            margin: 16px 0;
            padding: 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #555;
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .input-group input {
            flex: 1;
            min-width: 150px;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .input-group button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        .input-group button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .input-group button.success {
            background: #28a745;
        }

        .input-group button.warning {
            background: #ffc107;
            color: #000;
        }

        .input-group button.danger {
            background: #dc3545;
        }

        .status {
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        #log {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            max-height: 240px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #d4d4d4;
            line-height: 1.6;
        }

        .log-entry.info {
            color: #9cdcfe;
        }

        .log-entry.success {
            color: #6a9955;
        }

        .log-entry.error {
            color: #f48771;
        }

        .log-entry .time {
            color: #6a6a6a;
            margin-right: 8px;
        }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.online {
            background: #28a745;
            color: white;
        }

        .badge.offline {
            background: #dc3545;
            color: white;
        }

        .badge.auth-error {
            background: #ffc107;
            color: #000;
        }

        .hidden {
            display: none !important;
        }

        .chat-item {
            display: flex;
            gap: 12px;
            padding: 10px 4px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-item:hover {
            background: #f8f9fa;
        }

        .chat-item:last-child {
            border-bottom: none;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #666;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-weight: 600;
            font-size: 14px;
        }

        .chat-preview {
            font-size: 13px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-meta {
            font-size: 11px;
            color: #aaa;
            text-align: right;
            flex-shrink: 0;
        }

        .unread {
            background: #007bff;
            color: white;
            border-radius: 10px;
            font-size: 11px;
            padding: 1px 6px;
            margin-top: 4px;
            display: inline-block;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
        }

        #messagesList {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 50vh;
            overflow-y: auto;
            padding: 4px;
            margin-bottom: 10px;
        }

        .msg-bubble {
            position: relative;
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 14px;
            background: #f0f0f0;
            align-self: flex-start;
        }

        .msg-bubble.own {
            background: #d1e7ff;
            align-self: flex-end;
        }

        .msg-time {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
            text-align: right;
        }

        .msg-img {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 4px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .msg-img:hover {
            opacity: 0.85;
        }

        .msg-attach {
            margin-bottom: 6px;
        }

        /* ======================================== */
        /* СТИЛИ ПЛЕЕРА В СТИЛЕ MAX */
        /* ======================================== */

        /* Контейнер видео в сообщении */
        .msg-video-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            max-width: 350px;
            min-width: 200px;
            margin: 4px 0;
            background: #000;
            cursor: pointer;
        }

        /* Превью видео */
        .msg-video-poster {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #1a1a1a;
            cursor: pointer;
        }

        .msg-video-poster img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .msg-video-poster .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            transition: transform 0.2s, background 0.2s;
        }

        .msg-video-poster:hover .play-icon {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(0, 0, 0, 0.4);
        }

        .msg-video-poster .duration-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .inline-video-el {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .inline-top-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            z-index: 3;
        }

        .inline-bottom-actions {
            position: absolute;
            bottom: 8px;
            left: 8px;
            z-index: 3;
        }

        .inline-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            border: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .msg-video-container.loading .msg-video-poster {
            opacity: 0.5;
        }

        /* ======================================== */
        /* МОДАЛЬНОЕ ОКНО С ПЛЕЕРОМ (как в MAX) */
        /* ======================================== */
        .video-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            z-index: 10000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            align-items: center;
            justify-content: center;
        }

        .video-modal.active {
            display: flex;
        }

        .video-modal .video-wrapper {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            width: auto;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-modal video {
            max-width: 90vw;
            max-height: 85vh;
            width: auto;
            height: auto;
            object-fit: contain;
            background: #000;
            display: block;
        }

        /* Закрытие */
        .video-modal .close-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: white;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .video-modal .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ======================================== */
        /* КАСТОМНЫЕ КОНТРОЛЫ ПЛЕЕРА (как в MAX) */
        /* ======================================== */
        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 24px 24px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85) 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10001;
        }

        .video-modal:hover .player-controls,
        .video-modal.show-controls .player-controls {
            opacity: 1;
        }

        .player-controls .top-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .player-controls .time {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 500;
            min-width: 36px;
            font-variant-numeric: tabular-nums;
        }

        .player-controls .time-right {
            text-align: right;
            min-width: 36px;
        }

        /* Прогресс-бар */
        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            min-height: 20px;
            display: flex;
            align-items: center;
        }

        .progress-bar .progress-fill {
            height: 4px;
            background: #4da3ff;
            border-radius: 2px;
            width: 0%;
            position: relative;
            transition: width 0.1s linear;
        }

        .progress-bar .progress-fill .progress-dot {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: #4da3ff;
            border-radius: 50%;
            border: 2px solid white;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-bar:hover .progress-fill .progress-dot {
            opacity: 1;
        }

        .progress-bar .progress-buffer {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            width: 0%;
        }

        /* Кнопки управления */
        .controls-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-buttons button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            font-size: 20px;
        }

        .controls-buttons button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .controls-buttons button.primary {
            width: 48px;
            height: 48px;
            font-size: 28px;
            background: rgba(255, 255, 255, 0.08);
        }

        .controls-buttons button.primary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .msg-text {
            margin-top: 4px;
            word-wrap: break-word;
        }

        .msg-file {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .msg-file a {
            color: #007bff;
            text-decoration: none;
        }

        .msg-file a:hover {
            text-decoration: underline;
        }

        .chat-header .chat-avatar {
            width: 32px;
            height: 32px;
        }

        .chat-header .chat-id-label {
            font-size: 11px;
            color: #999;
            margin-left: auto;
            white-space: nowrap;
        }

        .settings-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }

        .settings-row input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }

        .autoreply-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 13px;
        }

        .verified-badge {
            color: #4da3ff;
            font-size: 16px;
            font-weight: bold;
            margin-left: 3px;
        }

        .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #4caf50;
            border: 2px solid white;
        }

        .msg-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
            position: relative;
        }

        .reaction-badge {
            background: rgba(0, 0, 0, 0.06);
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 12px;
            cursor: pointer;
        }

        .reaction-badge.mine {
            background: #007bff;
            color: white;
        }

        .msg-status {
            font-size: 12px;
            margin-left: 3px;
        }

        .msg-status.read {
            color: #4fc3f7;
        }

        .msg-status.sent {
            color: #999;
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .video-modal.active {
            animation: fadeIn 0.2s ease;
        }

        /* Скрываем стандартные контролы */
        .video-modal video::-webkit-media-controls {
            display: none !important;
        }

        .video-modal video::-webkit-media-controls-enclosure {
            display: none !important;
        }

        /* ---- Нижняя панель действий (как в MAX): "Перейти к сообщению" / "Скачать" ---- */
        .media-bottom-bar {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.92);
            border-radius: 30px;
            display: flex;
            align-items: center;
            z-index: 2100;
            overflow: hidden;
        }

        .media-bottom-bar button {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            padding: 14px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .media-bottom-bar button+button {
            border-left: 1px solid rgba(255, 255, 255, 0.2);
        }

        .media-bottom-bar button:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .media-viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .media-viewer.active {
            display: flex;
        }

        .media-viewer img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
        }

        .media-viewer .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            z-index: 2101;
        }

        /* Секция пароля */
        #passwordSection {
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 8px;
            border: 1px solid #ffc107;
        }

        #passwordSection.hidden {
            display: none;
        }

        .password-hint {
            font-size: 12px;
            color: #856404;
            margin-bottom: 8px;
        }

        .password-email {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }

        /* Иконки в контролах */
        .icon-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .volume-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-group button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        .center-play {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            font-size: 28px;
            padding: 8px;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .center-play:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <!-- Модальное окно плеера в стиле MAX -->
    <div class="video-modal" id="videoModal">
        <div class="video-wrapper" onclick="togglePlay()">
            <video id="videoPlayer" playsinline></video>

            <!-- Кнопка закрытия -->
            <button class="close-btn" onclick="closeVideoModal(event)">✕</button>

            <!-- Кастомные контролы -->
            <div class="player-controls" id="playerControls">
                <div class="icon-row">
                    <div class="volume-group">
                        <button onclick="toggleMute()" aria-label="Mute">
                            <span id="muteIcon">🔊</span>
                        </button>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100"
                            oninput="setVolumeFromSlider(this.value)">
                    </div>
                    <button class="center-play" onclick="togglePlay()" aria-label="Play/Pause">
                        <span id="playPauseIcon">⏸</span>
                    </button>
                    <button onclick="toggleFullscreen()" aria-label="Fullscreen">
                        <span>⤢</span>
                    </button>
                </div>

                <div class="top-row">
                    <span class="time" id="currentTime">0:00</span>

                    <div class="progress-bar" id="progressBar" onclick="seekVideo(event)">
                        <div class="progress-buffer" id="bufferBar"></div>
                        <div class="progress-fill" id="progressFill">
                            <div class="progress-dot"></div>
                        </div>
                    </div>

                    <span class="time time-right" id="totalTime">0:00</span>
                </div>
            </div>

            <div class="media-bottom-bar" id="videoBottomBar">
                <button onclick="jumpToMessageFromViewer()">↗ Перейти к сообщению</button>
                <button onclick="downloadCurrentVideo()">⬇ Скачать видео</button>
            </div>
        </div>
    </div>

    <div class="media-viewer" id="photoViewer">
        <button class="close-btn" onclick="closePhotoViewer()">✕</button>
        <img id="photoViewerImg" src="" alt="Фото">
        <div class="media-bottom-bar">
            <button onclick="jumpToMessageFromViewer()">↗ Перейти к сообщению</button>
            <button onclick="downloadCurrentPhoto()">⬇ Скачать фото</button>
        </div>
    </div>

    <h1>MAX Client
        <span id="connectionBadge" class="badge offline" style="float:right;">Offline</span>
        <button id="logoutBtn" class="badge danger"
            style="float:right;margin-right:8px;cursor:pointer;display:none;">Выйти</button>
        <button id="settingsToggle"
            style="float:right;margin-right:8px;background:none;border:none;font-size:18px;cursor:pointer;">⚙️</button>
    </h1>
    <div id="status" class="status info">Подключение...</div>

    <div id="loginSection" class="section">
        <h3>📱 Авторизация</h3>
        <div class="input-group">
            <input type="text" id="phone" placeholder="Номер телефона" value="+7">
            <button id="requestOtp">Отправить код</button>
            <button id="resendCode" style="background: #6c757d;">Повторно</button>
        </div>
        <div class="input-group">
            <input type="text" id="code" placeholder="Код из SMS">
            <button id="verifyCode" class="success">Подтвердить</button>
        </div>
        <div id="passwordSection" class="hidden">
            <div class="password-email" id="passwordEmail"></div>
            <div class="password-hint" id="passwordHint"></div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Пароль">
                <button id="verifyPassword" class="warning">Войти</button>
            </div>
        </div>
        <div id="authStatus" style="font-size:13px;color:#888;margin-top:4px;"></div>
    </div>

    <div id="chatsSection" class="section hidden">
        <h3>💬 Чаты</h3>
        <div id="chatsList"></div>
    </div>

    <div id="chatDetailSection" class="section hidden">
        <div class="chat-header">
            <button class="back-btn" id="backBtn">←</button>
            <div class="chat-avatar" id="chatDetailAvatar"></div>
            <div>
                <div class="chat-name" id="chatDetailName"></div>
                <div id="chatDetailStatus" style="font-size:12px;color:#888;"></div>
            </div>
        </div>
        <div id="messagesList"></div>
        <div class="autoreply-row">
            <label><input type="checkbox" id="autoreplyEnabled"> Автоответ на первое сообщение:</label>
        </div>
        <input type="text" id="autoreplyText" placeholder="Текст автоответа"
            style="width:100%;margin-bottom:8px;padding:8px;border:1px solid #ddd;border-radius:6px;">
        <div class="autoreply-row">
            <label><input type="checkbox" id="ghostReadEnabled"> 🕵️ Не отправлять отметку «прочитано»</label>
        </div>
        <div class="input-group" id="composerRow">
            <input type="text" id="messageText" placeholder="Сообщение">
            <button id="sendMessageBtn" class="success">Отправить</button>
        </div>
    </div>

    <div id="settingsSection" class="section hidden">
        <h3>⚙️ Настройки</h3>
        <div id="settingsRows"></div>
        <button id="addSettingRow" style="margin-top:6px;">+ переменная</button>
        <button id="saveSettings" class="success" style="margin-top:6px;margin-left:6px;">Сохранить</button>
    </div>

    <div class="section">
        <h3>📋 Лог</h3>
        <div id="log"></div>
    </div>

    <script>
        // ========================================
        // ПЛЕЕР В СТИЛЕ MAX
        // ========================================
        let currentVideoUrl = null;
        let currentViewerMessageId = null;
        let currentPhotoUrl = null;
        let isPlaying = false;
        let isMuted = false;
        let controlsTimeout = null;
        let isControlsVisible = true;

        const video = document.getElementById('videoPlayer');
        const modal = document.getElementById('videoModal');
        const progressFill = document.getElementById('progressFill');
        const bufferBar = document.getElementById('bufferBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const playPauseIcon = document.getElementById('playPauseIcon');

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function updateProgress() {
            if (!video.duration) return;
            const percent = (video.currentTime / video.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(video.currentTime);
            totalTimeEl.textContent = formatTime(video.duration);
        }

        function updateBuffer() {
            if (!video.buffered || !video.buffered.length) return;
            const bufferedEnd = video.buffered.end(video.buffered.length - 1);
            const percent = (bufferedEnd / video.duration) * 100;
            bufferBar.style.width = percent + '%';
        }

        function togglePlay() {
            if (video.paused) {
                video.play().catch(() => { });
                playPauseIcon.textContent = '⏸';
                isPlaying = true;
            } else {
                video.pause();
                playPauseIcon.textContent = '▶';
                isPlaying = false;
            }
        }

        function toggleMute() {
            video.muted = !video.muted;
            isMuted = video.muted;
            document.getElementById('muteIcon').textContent = isMuted ? '🔇' : '🔊';
            const slider = document.getElementById('volumeSlider');
            if (slider) slider.value = isMuted ? 0 : Math.round((video.volume || 1) * 100);
        }

        function setVolumeFromSlider(value) {
            const v = Number(value) / 100;
            video.volume = v;
            video.muted = v === 0;
            isMuted = video.muted;
            document.getElementById('muteIcon').textContent = video.muted ? '🔇' : (v < 0.5 ? '🔉' : '🔊');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.().catch(() => { });
            } else {
                document.exitFullscreen?.().catch(() => { });
            }
        }

        function seekVideo(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            video.currentTime = x * video.duration;
        }

        function showControls() {
            const controls = document.getElementById('playerControls');
            controls.style.opacity = '1';
            isControlsVisible = true;
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(() => {
                if (isPlaying) {
                    controls.style.opacity = '0';
                    isControlsVisible = false;
                }
            }, 3000);
        }

        function hideControls() {
            if (isPlaying) {
                document.getElementById('playerControls').style.opacity = '0';
                isControlsVisible = false;
            }
        }

        // События видео
        video.addEventListener('timeupdate', updateProgress);
        video.addEventListener('progress', updateBuffer);
        video.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(video.duration);
            updateProgress();
        });
        video.addEventListener('play', () => {
            playPauseIcon.textContent = '⏸';
            isPlaying = true;
            showControls();
        });
        video.addEventListener('pause', () => {
            playPauseIcon.textContent = '▶';
            isPlaying = false;
            showControls();
        });
        video.addEventListener('click', togglePlay);

        // Показываем контролы при движении мыши
        modal.addEventListener('mousemove', showControls);
        modal.addEventListener('touchstart', showControls);

        // Скрываем контролы при клике на видео (кроме кнопок)
        document.querySelector('.video-wrapper').addEventListener('click', (e) => {
            if (e.target === e.currentTarget || e.target.tagName === 'VIDEO') {
                if (isControlsVisible) {
                    hideControls();
                } else {
                    showControls();
                }
            }
        });

        // Клавиатура
        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return;
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
            if (e.key === 'Escape') {
                closeVideoModal();
            }
            if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
            if (e.key === 'm' || e.key === 'M') {
                toggleMute();
            }
        });

        // ========================================
        // ОТКРЫТИЕ ВИДЕО
        // ========================================
        async function inlineVideoTap(uid) {
            const container = document.getElementById(uid);
            if (!container) return;

            const existingVideo = container.querySelector('video');
            if (existingVideo) {
                existingVideo.paused ? existingVideo.play() : existingVideo.pause();
                return;
            }

            const messageId = container.dataset.msgId;
            const chatId = container.dataset.chatId;
            const token = container.dataset.token;
            const videoId = container.dataset.videoId;
            if (!token || !videoId) { log('❌ Нет данных для видео', 'error'); return; }

            container.classList.add('loading');
            try {
                const res = await fetch('/api/video-sources', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messageId, chatId, token, videoId }),
                });
                const data = await res.json();
                const sources = data.sources || {};
                const best = sources['720p'] || sources['480p'] || Object.values(sources)[0];
                if (!best) {
                    log('❌ Не удалось получить видео' + (data.error ? ` (${data.error})` : ''), 'error');
                    container.classList.remove('loading');
                    return;
                }

                const posterImg = container.querySelector('.msg-video-poster img');
                const posterSrc = posterImg ? posterImg.src : '';

                const v = document.createElement('video');
                v.className = 'inline-video-el';
                v.loop = true;
                v.muted = true;
                v.playsInline = true;
                v.autoplay = true;
                if (posterSrc) v.poster = posterSrc;
                v.src = '/video?url=' + encodeURIComponent(best);

                container.querySelector('.msg-video-poster').replaceWith(v);
                container.classList.remove('loading');

                const bottom = document.createElement('div');
                bottom.className = 'inline-bottom-actions';
                bottom.onclick = (e) => e.stopPropagation();
                bottom.innerHTML = `<button class="inline-icon-btn play-pause-btn">⏸</button>`;
                container.appendChild(bottom);
                const playPauseBtn = bottom.querySelector('.play-pause-btn');
                playPauseBtn.onclick = () => { v.paused ? v.play() : v.pause(); };
                v.addEventListener('play', () => { playPauseBtn.textContent = '⏸'; });
                v.addEventListener('pause', () => { playPauseBtn.textContent = '▶'; });

                v.play().catch(() => { });
            } catch (e) {
                log('❌ Ошибка видео: ' + e.message, 'error');
                container.classList.remove('loading');
            }
        }

        function toggleInlineMute(uid) {
            const container = document.getElementById(uid);
            const video = container?.querySelector('video');
            const btn = container?.querySelector('.inline-mute-btn');
            if (!video) return;
            video.muted = !video.muted;
            if (btn) btn.textContent = video.muted ? '🔇' : '🔊';
        }

        function expandInlineVideo(uid) {
            const container = document.getElementById(uid);
            if (!container) return;
            openVideoPlayer(container.dataset.msgId, container.dataset.chatId, container.dataset.token, Number(container
                .dataset.videoId));
        }

        async function openVideoPlayer(messageId, chatId, token, videoId) {
            currentViewerMessageId = messageId;
            if (!token || !videoId) {
                log('❌ Нет данных для видео', 'error');
                return;
            }

            log('⏳ Получаю ссылку на видео...', 'info');

            try {
                const res = await fetch('/api/video-sources', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messageId, chatId, token, videoId }),
                });
                const data = await res.json();
                const sources = data.sources || {};

                // Выбираем лучшее качество
                const best = sources['1080p'] || sources['720p'] || sources['480p'] || Object.values(sources)[0];

                if (!best) {
                    log('❌ Не удалось получить видео' + (data.error ? ` (${data.error})` : ''), 'error');
                    return;
                }

                // Останавливаем текущее видео
                video.pause();
                video.removeAttribute('src');
                video.load();

                // Загружаем новое
                const videoUrl = '/video?url=' + encodeURIComponent(best);
                currentVideoUrl = videoUrl;
                video.src = videoUrl;
                video.load();

                // Показываем модальное окно
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';

                // Автовоспроизведение
                video.play().catch(() => {
                    log('ℹ️ Нажмите Play для воспроизведения', 'info');
                });

                // Показываем контролы
                showControls();

                log('✅ Видео загружено', 'success');

            } catch (e) {
                log('❌ Ошибка: ' + e.message, 'error');
            }
        }

        function closeVideoModal(e) {
            if (e) e.stopPropagation();
            video.pause();
            video.removeAttribute('src');
            video.load();
            modal.classList.remove('active');
            document.body.style.overflow = '';
            currentVideoUrl = null;
        }

        // ---- Просмотрщик фото (та же нижняя панель, что и у видео) ----
        function openPhotoViewer(url, messageId) {
            currentPhotoUrl = url;
            currentViewerMessageId = messageId;
            document.getElementById('photoViewerImg').src = url;
            document.getElementById('photoViewer').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePhotoViewer() {
            document.getElementById('photoViewer').classList.remove('active');
            document.body.style.overflow = '';
            currentPhotoUrl = null;
        }

        async function downloadBlobUrl(url, filename) {
            try {
                const res = await fetch(url);
                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                log(`✅ «${filename}» скачан`, 'success');
            } catch (e) {
                log('❌ Ошибка скачивания: ' + e.message, 'error');
            }
        }

        function downloadCurrentVideo() {
            if (!currentVideoUrl) return;
            downloadBlobUrl(currentVideoUrl, `video_${currentViewerMessageId || Date.now()}.mp4`);
        }

        function downloadCurrentPhoto() {
            if (!currentPhotoUrl) return;
            downloadBlobUrl(currentPhotoUrl, `photo_${currentViewerMessageId || Date.now()}.jpg`);
        }

        function jumpToMessageFromViewer() {
            const messageId = currentViewerMessageId;
            closeVideoModal();
            closePhotoViewer();
            if (messageId == null) return;
            setTimeout(() => {
                const bubble = document.querySelector(`.msg-bubble[data-msg-id="${messageId}"]`);
                if (!bubble) return;
                bubble.scrollIntoView({ behavior: 'smooth', block: 'center' });
                bubble.style.outline = '2px solid #4fc3f7';
                setTimeout(() => { bubble.style.outline = ''; }, 1200);
            }, 100);
        }

        // Закрытие по Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeVideoModal();
            }
            if (e.key === 'Escape' && document.getElementById('photoViewer').classList.contains('active')) {
                closePhotoViewer();
            }
        });

        // ========================================
        // ПРЕВЬЮ ВИДЕО В СООБЩЕНИИ
        // ========================================
        function createVideoPreview(messageId, chatId, attach) {
            const poster = attach.thumbnail ? '/img?url=' + encodeURIComponent(attach.thumbnail) :
                attach.previewData ? hexPreviewToDataUrl(attach.previewData) : null;
            const duration = attach.duration ? formatTime(Math.round(attach.duration / 1000)) : '';
            const token = attach.token || attach.videoToken || '';
            const videoId = attach.videoId || 0;
            const uid = 'vid_' + Math.random().toString(36).slice(2, 9);

            let html = `
                <div class="msg-video-container" id="${uid}"
                     data-msg-id="${messageId}" data-chat-id="${chatId}" data-token="${token}" data-video-id="${videoId}"
                     onclick="inlineVideoTap('${uid}')">
                    <div class="msg-video-poster">
            `;

            if (poster) {
                html +=
                    `<img src="${poster}" alt="Превью видео" loading="lazy" onerror="this.style.display='none'">`;
            } else {
                html +=
                    `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1a1a;color:#666;font-size:40px;">🎬</div>`;
            }

            html += `
                        <div class="play-icon">▶</div>
                        ${duration ? `<div class="duration-badge">${duration}</div>` : ''}
                    </div>
                    <div class="inline-top-actions" onclick="event.stopPropagation();">
                        <button class="inline-icon-btn" onclick="expandInlineVideo('${uid}')" aria-label="Развернуть на весь экран">⛶</button>
                        <button class="inline-icon-btn inline-mute-btn" onclick="toggleInlineMute('${uid}')" aria-label="Звук">🔇</button>
                    </div>
                </div>
            `;

            return html;
        }

        // ========================================
        // ОСТАЛЬНАЯ ЛОГИКА
        // ========================================
        let ws = null;
        let isConnected = false;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 10;
        let reconnectTimer = null;
        let pingInterval = null;
        let otpToken = null;
        let phoneNumber = '';
        let selfId = null;
        let contactsById = {};
        let chatsById = {};
        let currentChatId = null;
        let metadataOverride = {};
        let presenceById = {};
        let seenMessageIds = {};

        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="time">[${new Date().toLocaleTimeString()}]</span>${msg}`;
            el.appendChild(entry);
            el.scrollTop = el.scrollHeight;
            while (el.children.length > 200) el.removeChild(el.firstChild);
        }

        function setStatus(msg, type = 'info') {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = `status ${type}`;
        }

        function showAuthenticatedUI() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('chatsSection').classList.remove('hidden');
            document.getElementById('logoutBtn').style.display = 'inline-block';
            document.getElementById('passwordSection').classList.add('hidden');
        }

        function showLoginUI() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('chatsSection').classList.add('hidden');
            document.getElementById('chatDetailSection').classList.add('hidden');
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('passwordSection').classList.add('hidden');
            document.getElementById('authStatus').textContent = '🔄 Требуется авторизация';
            document.getElementById('code').value = '';
            document.getElementById('password').value = '';
        }

        function send(opcode, payload) {
            if (!isConnected) { log('❌ Нет соединения', 'error'); return; }
            ws.send(JSON.stringify({ opcode, payload }));
        }

        // Загрузка avatars.json
        fetch('avatars.json')
            .then(r => r.ok ? r.json() : {})
            .then(data => {
                metadataOverride = data;
                if (Object.keys(chatsById).length > 0) {
                    renderChats({ chats: Object.values(chatsById), contacts: Object.values(contactsById) });
                }
            })
            .catch(() => { metadataOverride = {}; });

        function otherParticipantId(chat) {
            if (!chat || !chat.participants) return null;
            const ids = Object.keys(chat.participants).map(Number);
            if (selfId) {
                return ids.find(id => id !== selfId) || ids[0];
            }
            return ids[0];
        }

        function chatDisplayName(chat) {
            const otherId = chat.type === 'DIALOG' ? otherParticipantId(chat) : chat.id;
            const meta = metadataOverride[otherId];
            let name;

            if (chat.type === 'DIALOG') {
                if (chat.id === 0) {
                    name = 'Избранное';
                } else if (meta && meta.name) {
                    name = meta.name;
                } else {
                    const contact = contactsById[otherId];
                    if (contact) {
                        const custom = contact.names?.find(n => n.type === 'CUSTOM');
                        const oneme = contact.names?.find(n => n.type === 'ONEME');
                        name = (custom || oneme)?.name || 'Контакт #' + otherId;
                    } else {
                        name = 'Контакт #' + otherId;
                    }
                }
            } else {
                if (meta && meta.name) {
                    name = meta.name;
                } else {
                    name = chat.title || 'Без названия';
                }
            }

            const optionsSource = chat.type === 'DIALOG' ? contactsById[otherId]?.options : chat.options;
            const officialFromServer = Array.isArray(optionsSource) && optionsSource.includes('OFFICIAL');
            const verified = officialFromServer || (meta && meta.verified === true);

            return name + (verified ? ' <span class="verified-badge">✔</span>' : '');
        }

        function chatAvatarUrl(chat) {
            const otherId = chat.type === 'DIALOG' ? otherParticipantId(chat) : chat.id;
            const meta = metadataOverride[otherId];
            if (meta && meta.avatar) {
                return meta.avatar.startsWith('http') ? '/img?url=' + encodeURIComponent(meta.avatar) : meta.avatar;
            }
            if (chat.baseIconUrl) return '/img?url=' + encodeURIComponent(chat.baseIconUrl);
            if (chat.type === 'DIALOG' && chat.id !== 0) {
                const contact = contactsById[otherId];
                if (contact?.baseUrl) return '/img?url=' + encodeURIComponent(contact.baseUrl);
            }
            return null;
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function handleAvatarError(img) {
            img.style.display = 'none';
            const parent = img.parentElement;
            if (parent && parent.classList.contains('chat-avatar')) {
                parent.textContent = parent.dataset.initials || '?';
            }
        }

        function hexPreviewToDataUrl(hex) {
            try {
                const bytes = new Uint8Array(hex.length / 2);
                for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
                let binary = '';
                bytes.forEach(b => binary += String.fromCharCode(b));
                return 'data:image/webp;base64,' + btoa(binary);
            } catch (e) {
                return null;
            }
        }

        function renderChats(payload) {
            selfId = payload.profile?.contact?.id;
            contactsById = {};
            (payload.contacts || []).forEach(c => { contactsById[c.id] = c; });

            if (payload.presence) {
                Object.entries(payload.presence).forEach(([uid, p]) => {
                    presenceById[uid] = { online: p?.status === 1, seen: p?.seen || 0 };
                });
            }

            const chats = (payload.chats || []).slice().sort((a, b) => (b.lastEventTime || 0) - (a.lastEventTime ||
                0));
            chatsById = {};
            const list = document.getElementById('chatsList');
            list.innerHTML = '';

            chats.forEach(chat => {
                chatsById[chat.id] = chat;
                const name = chatDisplayName(chat);
                const preview = chatPreview(chat);
                const time = chat.lastEventTime ? new Date(chat.lastEventTime).toLocaleDateString() : '';
                const unread = chat.newMessages ? `<div class="unread">${chat.newMessages}</div>` : '';
                const avatarUrl = chatAvatarUrl(chat);
                const initial = name.charAt(0).toUpperCase();
                let avatarHtml;
                if (avatarUrl) {
                    avatarHtml =
                        `<img src="${avatarUrl}" alt="" loading="lazy" onerror="handleAvatarError(this)">`;
                } else {
                    avatarHtml = initial;
                }

                const otherId = chat.type === 'DIALOG' ? otherParticipantId(chat) : null;
                const isOnline = otherId != null && presenceById[otherId]?.online;
                const onlineDot = isOnline ? '<span class="online-dot"></span>' : '';

                const el = document.createElement('div');
                el.className = 'chat-item';
                el.innerHTML = `
                    <div class="chat-avatar" data-initials="${initial}" style="position:relative;">${avatarHtml}${onlineDot}</div>
                    <div class="chat-info">
                        <div class="chat-name">${name}</div>
                        <div class="chat-preview">${escapeHtml(preview)}</div>
                    </div>
                    <div class="chat-meta">${time}${unread}</div>
                `;
                el.onclick = () => openChat(chat.id);
                list.appendChild(el);
            });

            log(`📋 Загружено ${chats.length} чатов`, 'success');
        }

        function chatPreview(chat) {
            const m = chat.lastMessage;
            if (!m) return '';
            const isTranslationKey = m.text && /^[a-z0-9]+(\.[a-z0-9]+)+$/i.test(m.text);
            const attach = m.attaches?.[0];
            if (attach?._type === 'CONTROL') {
                return attach.message || attach.shortMessage || 'Системное событие';
            }
            if (attach?._type === 'VIDEO') {
                return '🎬 Видео';
            }
            if (m.text && !isTranslationKey) return m.text.slice(0, 80);
            if (attach) {
                const labels = {
                    PHOTO: '🖼️ Фото',
                    VIDEO: '🎬 Видео',
                    FILE: '📎 ' + (attach.name || 'Файл'),
                    CALL: attach.callType === 'VIDEO' ? '📞 Видеозвонок' : '📞 Звонок',
                };
                return labels[attach._type] || `[${attach._type}]`;
            }
            return '';
        }

        function buildStatusTicksHtml(m, chat) {
            try {
                if (chat?.type !== 'DIALOG') {
                    return '<span class="msg-status sent">✓</span>';
                }
                const otherId = otherParticipantId(chat);
                if (!otherId) return '<span class="msg-status sent">✓</span>';

                const info = chat?.participants?.[otherId];
                let otherLastRead = null;

                if (typeof info === 'number' || typeof info === 'string') {
                    otherLastRead = info;
                } else if (info && typeof info === 'object') {
                    otherLastRead = info.lastReadMessageId ?? info.mark ?? info.readMark ?? null;
                }

                if (otherLastRead == null && chat?.readMarks) {
                    otherLastRead = chat.readMarks[otherId] || null;
                }

                if (otherLastRead != null) {
                    try {
                        if (BigInt(m.id) <= BigInt(otherLastRead)) {
                            return '<span class="msg-status read">✓✓</span>';
                        }
                    } catch (e) { }
                }
                return '<span class="msg-status sent">✓</span>';
            } catch (err) {
                return '<span class="msg-status sent">✓</span>';
            }
        }

        function buildReactionsHtml(m) {
            try {
                const counts = m.reactionInfo?.counters || [];
                let badges = '';
                if (Array.isArray(counts)) {
                    counts.forEach(r => {
                        const emoji = r.reaction || '👍';
                        const count = r.count ?? 1;
                        badges +=
                            `<span class="reaction-badge" data-emoji="${escapeHtml(emoji)}">${emoji} ${count}</span>`;
                    });
                }
                return badges ? `<div class="msg-reactions">${badges}</div>` : '';
            } catch (err) {
                return '';
            }
        }

        function createMessageElement(m) {
            const el = document.createElement('div');
            const isOwn = m.sender === selfId;
            el.className = 'msg-bubble' + (isOwn ? ' own' : '');
            el.dataset.msgId = m.id;

            let attachesHtml = '';
            (m.attaches || []).forEach(a => {
                if (a._type === 'PHOTO') {
                    let src = a.baseRawUrl || a.baseUrl;
                    if (src) src = '/img?url=' + encodeURIComponent(src);
                    if (!src && a.previewData) {
                        src = hexPreviewToDataUrl(a.previewData);
                    }
                    if (src) {
                        attachesHtml +=
                            `<div class="msg-attach"><img class="msg-img" src="${src}" alt="Фото" loading="lazy" onerror="this.style.display='none'" onclick="openPhotoViewer('${src}', '${m.id}')"></div>`;
                    } else {
                        attachesHtml +=
                            `<div class="msg-attach msg-file">🖼️ Фото (недоступно)</div>`;
                    }
                    return;
                }
                if (a._type === 'VIDEO') {
                    attachesHtml +=
                        `<div class="msg-attach">${createVideoPreview(m.id, currentChatId, a)}</div>`;
                    return;
                }
                if (a._type === 'FILE') {
                    const fileName = a.name || 'файл';
                    attachesHtml +=
                        `<div class="msg-attach msg-file">📎 ${escapeHtml(fileName)}</div>`;
                    return;
                }
                if (a._type === 'CALL') {
                    attachesHtml +=
                        `<div class="msg-attach msg-file">📞 ${a.callType === 'VIDEO' ? 'Видеозвонок' : 'Звонок'}</div>`;
                    return;
                }
                if (a._type === 'CONTROL') {
                    const text = a.message || a.shortMessage || 'Системное событие';
                    attachesHtml +=
                        `<div class="msg-attach" style="text-align:center;color:#888;font-size:12px;">${escapeHtml(text)}</div>`;
                    return;
                }
            });

            const isTranslationKey = m.text && /^[a-z0-9]+(\.[a-z0-9]+)+$/i.test(m.text);
            const hasControlAttach = (m.attaches || []).some(a => a._type === 'CONTROL');

            let textHtml = '';
            if (m.text && !(isTranslationKey && hasControlAttach)) {
                textHtml = `<div class="msg-text">${escapeHtml(m.text)}</div>`;
            }

            const time = m.time ? new Date(m.time).toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            }) : '';
            const chat = chatsById[currentChatId];
            const statusHtml = isOwn ? buildStatusTicksHtml(m, chat) : '';
            const timeHtml = `<div class="msg-time">${time}${statusHtml}</div>`;

            const reactionsHtml = buildReactionsHtml(m);

            el.innerHTML = attachesHtml + textHtml + reactionsHtml + timeHtml;
            return el;
        }

        function renderMessages(payload) {
            const list = document.getElementById('messagesList');
            const existingIds = new Set();
            list.querySelectorAll('.msg-bubble[data-msg-id]').forEach(el => {
                existingIds.add(el.dataset.msgId);
            });

            const messages = (payload.messages || []).slice().sort((a, b) => (a.time || 0) - (b.time || 0));
            const newMessages = messages.filter(m => !existingIds.has(String(m.id)));

            newMessages.forEach(m => {
                const el = createMessageElement(m);
                list.appendChild(el);
            });

            if (newMessages.length > 0) {
                list.scrollTop = list.scrollHeight;
            }
        }

        function connect() {
            if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
                log('❌ Достигнут лимит попыток переподключения', 'error');
                setStatus('Connection lost', 'error');
                return;
            }

            log('Подключение... (попытка ' + (reconnectAttempts + 1) + ')');
            setStatus('Подключение...', 'info');
            ws = new WebSocket(`ws://${window.location.host}/relay`);

            ws.onopen = () => {
                isConnected = true;
                reconnectAttempts = 0;
                setStatus('Подключено', 'success');
                document.getElementById('connectionBadge').textContent = 'Online';
                document.getElementById('connectionBadge').className = 'badge online';
                log('✅ Подключено');

                if (pingInterval) clearInterval(pingInterval);
                pingInterval = setInterval(() => {
                    if (isConnected && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ opcode: 0, payload: {} }));
                    }
                }, 25000);
            };

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.opcode === 0 && data.payload?.pong) return;
                    if (data.type === 'connected') { log(`✅ ${data.message}`, 'success'); return; }
                    if (data.type === 'session_restored') {
                        log(`✅ ${data.message}`, 'success');
                        setStatus('Авторизован', 'success');
                        showAuthenticatedUI();
                        send(19, { chatsSync: 0, contactsSync: 0, interactive: true });
                        return;
                    }
                    if (data.type === 'auth_required') {
                        log('🔒 Требуется авторизация', 'info');
                        showLoginUI();
                        return;
                    }

                    // Обработка ошибки авторизации
                    if (data._auth_error ||
                        (data.opcode === 19 && data.cmd === 768 &&
                            data.payload?.localizedMessage?.includes('авторизируйтесь'))) {
                        log('❌ Сессия истекла. Требуется повторная авторизация.', 'error');
                        setStatus('Сессия истекла', 'error');
                        showLoginUI();
                        document.getElementById('connectionBadge').className = 'badge auth-error';
                        document.getElementById('connectionBadge').textContent = 'Auth Error';
                        return;
                    }

                    if (data.cmd === 768) {
                        const err = data.payload?.localizedMessage || data.payload?.error || 'Ошибка';
                        log(`❌ ${err}`, 'error');
                        setStatus(`Ошибка: ${err}`, 'error');
                        return;
                    }

                    if (data.opcode === 17 && data.cmd === 256) {
                        otpToken = data.payload.token;
                        log('✅ Код отправлен!', 'success');
                        document.getElementById('authStatus').textContent = '✅ Код отправлен. Введите код из SMS.';
                        startResendTimer(60);
                        return;
                    }

                    if (data.opcode === 18 && data.cmd === 256) {
                        // Проверяем, нужен ли пароль
                        if (data.payload?.passwordChallenge) {
                            const pc = data.payload.passwordChallenge;
                            document.getElementById('passwordSection').classList.remove('hidden');
                            document.getElementById('passwordHint').textContent = '💡 Подсказка: ' + (pc.hint || '');
                            document.getElementById('passwordEmail').textContent = '📧 ' + (pc.email || '');
                            document.getElementById('authStatus').textContent = '🔒 Требуется ввод пароля';
                            log('🔒 Требуется ввод пароля', 'info');
                            return;
                        }

                        log('✅ Авторизация успешна!', 'success');
                        setStatus('Авторизован', 'success');
                        showAuthenticatedUI();
                        send(19, { chatsSync: 0, contactsSync: 0, interactive: true });
                        return;
                    }

                    if (data.opcode === 20 && data.cmd === 256) {
                        log('✅ Авторизация с паролем успешна!', 'success');
                        setStatus('Авторизован', 'success');
                        showAuthenticatedUI();
                        document.getElementById('passwordSection').classList.add('hidden');
                        document.getElementById('password').value = '';
                        send(19, { chatsSync: 0, contactsSync: 0, interactive: true });
                        return;
                    }

                    if (data.opcode === 19 && data.cmd === 256) {
                        renderChats(data.payload);
                        return;
                    }

                    if (data.opcode === 49 && data.cmd === 256) {
                        renderMessages(data.payload);
                        return;
                    }

                    if (data.opcode === 64 && data.cmd === 256) {
                        document.getElementById('messageText').value = '';
                        send(49, {
                            chatId: currentChatId, from: Date.now() + 86400000, forward: 0,
                            backward: 50, getMessages: true
                        });
                        return;
                    }

                    if (data.opcode === 130 && data.payload) {
                        const p = data.payload;
                        if (p.chatId != null && p.userId != null && p.mark != null) {
                            const chat = chatsById[p.chatId];
                            if (chat) {
                                if (!chat.participants) chat.participants = {};
                                chat.participants[p.userId] = p.mark;
                                if (p.chatId === currentChatId) {
                                    document.querySelectorAll('#messagesList .msg-bubble.own').forEach(
                                        bubble => {
                                            const msgId = bubble.dataset.msgId;
                                            const statusEl = bubble.querySelector('.msg-status');
                                            if (statusEl && msgId != null) {
                                                try {
                                                    if (BigInt(msgId) <= BigInt(p.mark)) {
                                                        statusEl.outerHTML =
                                                            '<span class="msg-status read">✓✓</span>';
                                                    }
                                                } catch (e) { }
                                            }
                                        });
                                }
                            }
                        }
                        return;
                    }

                    if (data.opcode === 132 && data.payload) {
                        const uid = data.payload.userId;
                        const p = data.payload.presence;
                        if (uid != null && p) {
                            presenceById[uid] = { online: p.status === 1, seen: p.seen || 0 };
                            if (currentChatId) {
                                const chat = chatsById[currentChatId];
                                if (chat && chat.type === 'DIALOG' && otherParticipantId(chat) == uid) {
                                    const statusEl = document.getElementById('chatDetailStatus');
                                    if (statusEl) {
                                        statusEl.textContent = p.status === 1 ? 'в сети' :
                                            'был(а) в сети';
                                        statusEl.style.color = p.status === 1 ? '#4caf50' : '#888';
                                    }
                                }
                            }
                        }
                        return;
                    }
                } catch (err) {
                    console.error('[ws error]', err);
                }
            };

            ws.onclose = () => {
                isConnected = false;
                if (pingInterval) clearInterval(pingInterval);
                setStatus('Отключено', 'error');
                document.getElementById('connectionBadge').textContent = 'Offline';
                document.getElementById('connectionBadge').className = 'badge offline';
                log('🔌 Отключено', 'error');

                const delay = 300;
                reconnectAttempts++;
                if (reconnectAttempts <= MAX_RECONNECT_ATTEMPTS) {
                    log('🔄 Переподключение...', 'info');
                    if (reconnectTimer) clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(connect, delay);
                } else {
                    log('❌ Достигнут лимит попыток переподключения', 'error');
                }
            };
        }

            if (resendTimer) clearInterval(resendTimer);

            resendTimer = setInterval(() => {
                resendSeconds--;

                    clearInterval(resendTimer);
                    btn.disabled = false;
                    btn.textContent = 'Повторно';
                    btn.style.background = '#6c757d';
                } else {
                    btn.textContent = `Повторно (${resendSeconds}с)`;
                    btn.style.background = '#adb5bd';
                }
            }, 1000);
        }

        function saveAutoreplySettings(chatId, settings) {
            const all = JSON.parse(localStorage.getItem('maxclient_autoreply') || '{}');
            all[chatId] = settings;
            localStorage.setItem('maxclient_autoreply', JSON.stringify(all));
        }

        document.getElementById('autoreplyEnabled').onchange = (e) => {
            if (!currentChatId) return;
            const s = getAutoreplySettings(currentChatId);
            s.enabled = e.target.checked;
            saveAutoreplySettings(currentChatId, s);
        };

        document.getElementById('autoreplyText').onchange = (e) => {
            if (!currentChatId) return;
            const s = getAutoreplySettings(currentChatId);
            s.text = e.target.value;
            saveAutoreplySettings(currentChatId, s);
        };

        document.getElementById('ghostReadEnabled').onchange = (e) => {
            if (!currentChatId) return;
            const all = JSON.parse(localStorage.getItem('maxclient_ghost_read') || '{}');
            all[currentChatId] = e.target.checked;
            localStorage.setItem('maxclient_ghost_read', JSON.stringify(all));
        };

        // Проверка авторизации при загрузке
        async function checkAuth() {
            try {
                const res = await fetch('/api/check-auth');
                const data = await res.json();
                if (!data.authenticated) {
                    showLoginUI();
                }
            } catch (e) {
                showLoginUI();
            }
        }

        // Инициализация
        applySettingsVars(loadSettingsVars());
        checkAuth();
        connect();

        window.onbeforeunload = () => { if (ws) ws.close(); };
    </script>
</body>

</html>
